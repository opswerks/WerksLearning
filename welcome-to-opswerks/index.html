artTime":1298.569,"finishTime":1299.03},{"text":"the founding was","startTime":1299.689,"finishTime":1300.65},{"text":"instrumental.","startTime":1300.959,"finishTime":1301.53},{"text":"It was sort of the first,","startTime":1301.569,"finishTime":1302.609},{"text":"but this feels like the next chapter,","startTime":1302.65,"finishTime":1304.4},{"text":"sort of clarity of what we're trying to do and build.","startTime":1304.569,"finishTime":1306.829},{"text":"Uh,","startTime":1307.369,"finishTime":1307.67},{"text":"this is what we're up to.","startTime":1307.77,"finishTime":1308.939},{"text":"I know many of you who interviewed me sort of as the last person,","startTime":1309.26,"finishTime":1312.67},{"text":"I think the most common question I got was like,","startTime":1313.17,"finishTime":1315.13},{"text":"where do you see ops works in 5 years","startTime":1315.17,"finishTime":1317.109},{"text":"or 2 years or","startTime":1317.53,"finishTime":1319.069},{"text":"You know,","startTime":1320.209,"finishTime":1320.709},{"text":"I never had an answer for you.","startTime":1320.93,"finishTime":1322.079},{"text":"I always answered,","startTime":1322.369,"finishTime":1323.4},{"text":"I know,","startTime":1323.53,"finishTime":1323.969},{"text":"I don't know where we're going,","startTime":1324.13,"finishTime":1324.92},{"text":"but I know how we're gonna get there.","startTime":1324.989,"finishTime":1326.55},{"text":"I think now,","startTime":1327.05,"finishTime":1327.88},{"text":"you know,","startTime":1328.209,"finishTime":1328.52},{"text":"sharing with you the BVMMs,","startTime":1328.719,"finishTime":1330.41},{"text":"the K2,","startTime":1330.479,"finishTime":1331.25},{"text":"you actually have that answer.","startTime":1331.53,"finishTime":1332.359},{"text":"You can provide the answer for yourself and for others.","startTime":1332.41,"finishTime":1334.39},{"text":"This is how we're gonna get there with the BBMMs.","startTime":1335.41,"finishTime":1337.449},{"text":"This is where we're going with K2.","startTime":1337.76,"finishTime":1339.329},{"text":"Um,","startTime":1339.959,"finishTime":1340.239},{"text":"and so whenever you're in doubt,","startTime":1340.319,"finishTime":1341.719},{"text":"whenever you get confused,","startTime":1341.8,"finishTime":1342.839},{"text":"right,","startTime":1342.92,"finishTime":1343.189},{"text":"there's a saying like when in doubt,","startTime":1343.439,"finishTime":1344.709},{"text":"you know,","startTime":1344.92,"finishTime":1345.079},{"text":"zoom back out.","startTime":1345.229,"finishTime":1346.319},{"text":"Remember to look at the big picture,","startTime":1346.76,"finishTime":1347.79},{"text":"big,","startTime":1347.93,"finishTime":1348.06},{"text":"the big picture,","startTime":1348.4,"finishTime":1349.16},{"text":"the long term,","startTime":1349.439,"finishTime":1350.229},{"text":"what we're after,","startTime":1350.359,"finishTime":1351.14},{"text":"and that should give you guidance,","startTime":1351.76,"finishTime":1353.099},{"text":"and that should give you","startTime":1353.119,"finishTime":1354.219},{"text":"freedom","startTime":1354.56,"finishTime":1354.9},{"text":"into deciding and","startTime":1355.119,"finishTime":1356.489},{"text":"those decisions that you're making on your own,","startTime":1356.8,"finishTime":1358.699},{"text":"helping,","startTime":1359.199,"finishTime":1359.52},{"text":"steering you in the right direction.","startTime":1359.56,"finishTime":1360.719},{"text":"So I know there's a lot to absorb.","startTime":1362.319,"finishTime":1363.67},{"text":"I've been yammering this whole time.","startTime":1363.81,"finishTime":1365.51},{"text":"Um,","startTime":1365.89,"finishTime":1366.359},{"text":"there will be questions.","startTime":1366.93,"finishTime":1367.89},{"text":"Ask them.","startTime":1368.089,"finishTime":1368.65},{"text":"Right.","startTime":1369.53,"finishTime":1369.54},{"text":"It's how we would approach a technical problem.","startTime":1370.28,"finishTime":1372.219},{"text":"This is a","startTime":1372.64,"finishTime":1373.52},{"text":"technical problem as well on the business side.","startTime":1373.939,"finishTime":1376.239},{"text":"Right.","startTime":1376.88,"finishTime":1377.229},{"text":"And","startTime":1377.39,"finishTime":1377.979},{"text":"if you're worried or scared,","startTime":1378.54,"finishTime":1379.689},{"text":"that's OK.","startTime":1379.76,"finishTime":1380.199},{"text":"That's normal.","startTime":1380.319,"finishTime":1380.839},{"text":"That's natural.","startTime":1380.92,"finishTime":1381.439},{"text":"I am too.","startTime":1381.56,"finishTime":1382.28},{"text":"Right,","startTime":1383.25,"finishTime":1383.479},{"text":"but it doesn't stop us from going after.","startTime":1383.619,"finishTime":1385.43},{"text":"If you look at all everything we've done in the past","startTime":1385.53,"finishTime":1387.41},{"text":"and you look at your past history before you're even outsourced,","startTime":1387.41,"finishTime":1390.01},{"text":"what has led to your most growth and your most success and your most impact,","startTime":1390.489,"finishTime":1394.109},{"text":"that's probably taking on something hard and scary and unknown,","startTime":1394.369,"finishTime":1397.709},{"text":"but you still push past it","startTime":1398.13,"finishTime":1399.479},{"text":"because you had something bigger in mind.","startTime":1399.77,"finishTime":1400.91},{"text":"We do too","startTime":1401.849,"finishTime":1402.54},{"text":"together.","startTime":1402.81,"finishTime":1403.209},{"text":"So,","startTime":1403.609,"finishTime":1404.03},{"text":"with that being said,","startTime":1404.65,"finishTime":1405.449},{"text":"I will uh","startTime":1405.609,"finishTime":1406.349},{"text":"Open up the questions,","startTime":1408.079,"finishTime":1409.64},{"text":"so you can find it in the chat here.","startTime":1410.18,"finishTime":1411.599},{"text":"Let's see.","startTime":1414.03,"finishTime":1414.829},{"text":"So I would say,","startTime":1420.579,"finishTime":1421.589},{"text":"as you're processing it all,","startTime":1421.81,"finishTime":1423.03},{"text":"um,","startTime":1423.13,"finishTime":1423.479},{"text":"feel free to hit me up AMA","startTime":1423.489,"finishTime":1425.02},{"text":"ask your leads,","startTime":1425.29,"finishTime":1426.17},{"text":"right?","startTime":1426.51,"finishTime":1426.77},{"text":"Go challenge them a little.","startTime":1426.969,"finishTime":1427.93},{"text":"As your team owners,","startTime":1428.04,"finishTime":1428.959},{"text":"ask Alfie,","startTime":1429.13,"finishTime":1429.77},{"text":"ask Janine,","startTime":1429.849,"finishTime":1430.689},{"text":"right.","startTime":1431.25,"finishTime":1431.55},{"text":"This story that we are building together,","startTime":1431.849,"finishTime":1433.43},{"text":"you will have to know for yourself and it's OK to ask questions,","startTime":1433.849,"finishTime":1436.39},{"text":"right?","startTime":1436.89,"finishTime":1437.16},{"text":"We've been working on","startTime":1437.449,"finishTime":1438.5},{"text":"You know,","startTime":1439.38,"finishTime":1439.56},{"text":"many of us,","startTime":1439.63,"finishTime":1440.349},{"text":"sort of the older,","startTime":1440.459,"finishTime":1441.219},{"text":"the marinated folks have been working on this for years.","startTime":1441.42,"finishTime":1443.439},{"text":"Right,","startTime":1444.18,"finishTime":1444.339},{"text":"and we don't have it all figured out,","startTime":1444.459,"finishTime":1445.54},{"text":"but we know that we will figure it out,","startTime":1445.699,"finishTime":1447.04},{"text":"and I think together it's an eventuality,","startTime":1447.06,"finishTime":1448.859},{"text":"right?","startTime":1449.18,"finishTime":1449.38},{"text":"If it takes 11 years,","startTime":1449.619,"finishTime":1450.52},{"text":"would we be sad?","startTime":1450.579,"finishTime":1451.68},{"text":"Right,","startTime":1452.449,"finishTime":1452.569},{"text":"or in 10 years we only helped,","startTime":1452.619,"finishTime":1453.989},{"text":"only helped 500 people or 400 people.","startTime":1454.209,"finishTime":1457.099},{"text":"We won't cry,","startTime":1457.609,"finishTime":1458.17},{"text":"but we're going after something big,","startTime":1458.25,"finishTime":1459.869},{"text":"um,","startTime":1460.329,"finishTime":1460.829},{"text":"and I think things guide us along the way.","startTime":1461.41,"finishTime":1463.349},{"text":"So","startTime":1463.89,"finishTime":1464.42},{"text":"I just want to say thank you everyone for joining us on this journey,","startTime":1464.569,"finishTime":1466.729},{"text":"for being","startTime":1466.81,"finishTime":1467.349},{"text":"and coming here thus far.","startTime":1467.89,"finishTime":1469.75},{"text":"I'd love for you guys to","startTime":1470.209,"finishTime":1471.469},{"text":"see what's going to happen in the next 1 year,","startTime":1472.25,"finishTime":1473.89},{"text":"2 years,","startTime":1473.969,"finishTime":1474.329},{"text":"3 years,","startTime":1474.41,"finishTime":1475.229},{"text":"um,","startTime":1475.489,"finishTime":1476.03},{"text":"and I'm looking forward to,","startTime":1476.569,"finishTime":1477.89},{"text":"you know,","startTime":1478.01,"finishTime":1478.13},{"text":"all of our growth.","startTime":1478.17,"finishTime":1478.91},{"text":"So thank you,","startTime":1479.17,"finishTime":1479.949},{"text":"everyone.","startTime":1479.959,"finishTime":1480.29}]}}},"questionsById":{},"resourcesById":{"7wYHeGLp63SYnJTNt":{"_id":"7wYHeGLp63SYnJTNt","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Welcome to OpsWerks from Steve","template":"resourceVideo","locale":"en","upload":"3ayxvfvqxqXDEaYFL"},"video":{"autoPlay":true,"type":"AWSS3","isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here. Welcome to OpsWerks. We're excited you're here.","startTime":0.009,"finishTime":4.219},{"text":"Thanks for taking the time.","startTime":4.23,"finishTime":5.5},{"text":"Everyone here is interested in discovering and","startTime":5.51,"finishTime":7.369},{"text":"becoming the best person they could be.","startTime":7.38,"finishTime":9.06},{"text":"This applies to both our work life and our personal life.","startTime":9.069,"finishTime":11.818999999999999},{"text":"Many of the things that we do,","startTime":12.21,"finishTime":13.8},{"text":"but more importantly how we do it helps us in our lives. ","startTime":13.97,"finishTime":16.379},{"text":"We know when we help our teammates grow, we get to grow too.","startTime":16.389,"finishTime":19.37},{"text":"And as we make progress, we love to celebrate it.","startTime":19.43,"finishTime":21.739},{"text":"We don't have it all figured out,","startTime":21.75,"finishTime":22.819},{"text":"but we're figuring it out together and sharing what we learn.","startTime":22.829,"finishTime":25.379},{"text":"And if you're interested in that journey and you want","startTime":25.389,"finishTime":27.44},{"text":"to be with others who are doing the same,","startTime":27.45,"finishTime":29.069},{"text":"have a look around and let us know","startTime":29.079,"finishTime":31.09},{"text":"we are always looking for more folks to join the adventure","startTime":31.19,"finishTime":33.9},{"text":"because we know we can go further when we go together.","startTime":33.909,"finishTime":36.599}],"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-11T02:40:31.906Z","dateCreated":"2024-02-16T08:22:53.422Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["3ayxvfvqxqXDEaYFL"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"Bn8r4bix5zZmBeLbf":{"_id":"Bn8r4 n","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"font":{"size":20,"bold":false,"underline":false,"italic":false},"fontColor":"koantic(light1, 0, 1)","textAlignment":"center","type":"button","border":{"size":0,"color":"#000000","left":true,"right":true,"top":true,"bottom":true},"fill":{"type":"color","color":"koantic(accent5, 0, 0)"},"padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Button","hover":{"fillColor":"koantic(dark2, 0, 0.41)"},"roundedCorners":{"bottomLeft":100,"bottomRight":100,"topLeft":100,"topRight":100}},"start":2.2,"behaviorType":"continue","rotationAngle":0,"clickAction":{"goToPage":{"type":"tableOfContentPage","pageId":"bHmyjGvPspAR9pwgu"},"type":"goToPage"}}]},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-02-20T03:04:41.546Z","dateCreated":"2024-02-20T02:58:20.004Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["EE8Km2MBruHuy9Rqc"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"GcbAKAREaD4P6Pd7C":{"_id":"GcbAKAREaD4P6Pd7C","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"The K2 Journey Explained","template":"resourceVideo","locale":"en","upload":"pJpwWjPjb9bp2wNqs"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Yay. So all this talk about K2, right? We've been hinting at it for a while","startTime":5.82,"finishTime":10.31},{"text":"for months and we've been working on it for, you know, for a quite a long time.","startTime":10.479,"finishTime":15.5},{"text":"And I'm so excited to be able to share this with everyone.","startTime":15.51,"finishTime":17.889},{"text":"Now, we worked through some of the refinements, just sort of checked it","startTime":17.899,"finishTime":21.729},{"text":"to make sure it's the right thing to do. So what is K2?","startTime":22.079,"finishTime":25},{"startTime":25.379,"finishTime":25.809},{"text":"So for, if you haven't googled it,","startTime":26.01,"finishTime":27.819},{"text":"K2 is the second highest mountain on earth.","startTime":27.969,"finishTime":31.93},{"text":"Everest gets all the fame, all the glory, all the excitement, all the attention.","startTime":32.029,"finishTime":36.34},{"text":"The K2 amongst the climbers is regarded as the hardest,","startTime":36.819,"finishTime":39.83},{"text":"most challenging climb out there.","startTime":39.84,"finishTime":41.409},{"text":"So in Everest, I, you know, I was googling it. Over 4000 people have summited it.","startTime":41.979,"finishTime":46.47},{"text":"But in K2, there's only been 367 summits.","startTime":47.209,"finishTime":49.819},{"text":" It's the biggest challenge of them. All right.","startTime":50.669,"finishTime":53.009},{"text":"And there's actually a different approaches of K2 that have never been climbed.","startTime":53.15,"finishTime":56.939},{"text":"So the eastern approach has never been climbed yet.","startTime":56.95,"finishTime":59.069},{"text":"And the fun fact I learned too is","startTime":59.43,"finishTime":62.13},{"text":"more people have been on in space","startTime":62.52,"finishTime":64.86},{"text":"than have been on the summit of K two.","startTime":65.41,"finishTime":67.519},{"text":"And so why would I use this analogy? You know,","startTime":68.239,"finishTime":71.01},{"startTime":71.43,"finishTime":71.9},{"text":"I really feel that we've chosen to make OpsWerks. The way we've chosen, it","startTime":72.089,"finishTime":76.419},{"text":"is actually one of the hardest ways to build a business uh","startTime":76.709,"finishTime":79.43},{"text":"to build a company in the world to date with our,","startTime":79.44,"finishTime":81.639},{"text":"our focus on people, our focus on relationships, our focus on the long","startTime":81.65,"finishTime":85.69},{"text":"long term goals. ","startTime":85.879,"finishTime":88.089},{"text":"We chose the beliefs that we stand by.","startTime":88.47,"finishTime":90.209},{"text":"We chose the vision of this future we want to create","startTime":90.97,"finishTime":93.489},{"text":"and we've chosen a worthy mission","startTime":93.739,"finishTime":95.37},{"text":"and we chose a set of methods of how we want to accomplish those missions.","startTime":95.819,"finishTime":99.48},{"text":"And that moves us in this shared direction, this","startTime":99.489,"finishTime":102.069},{"text":"which is aligned with what we believe and,","startTime":102.22,"finishTime":103.94},{"text":"you know, that feeds in itself as we've shown.","startTime":104.069,"finishTime":105.959},{"text":"But this is really, really hard,","startTime":106.849,"finishTime":108.26},{"text":"you know, it's really, really, really hard.","startTime":108.809,"finishTime":110.959},{"text":" But through these obstacles, we find that we are creating great opportunities,","startTime":111.139,"finishTime":114.68},{"text":"not only for ourselves, but, you know, for those we care about","startTime":114.69,"finishTime":117.04},{"text":"and those we're next to.","startTime":117.23,"finishTime":118.339},{"startTime":118.959,"finishTime":119.3},{"text":"And so with that, you know,","startTime":119.599,"finishTime":121.18},{"text":"you know,","startTime":121.54,"finishTime":121.889},{"text":"before you try to summon a mountain, something like this, uh you need to actually um","startTime":122.55,"finishTime":126.349},{"text":"you know, create break points so you can approach this in sort of sort of, you know,","startTime":126.87,"finishTime":130.699},{"text":"maybe bite size chunks.","startTime":130.71,"finishTime":132.029},{"text":"And for K2, there are actually natural break points,","startTime":132.039,"finishTime":134.419},{"text":"there are four of them and there are these base camps that exist on the mountain.","startTime":134.429,"finishTime":137.639},{"text":"you know, these, there are natural rest points, checkpoints,","startTime":138.539,"finishTime":142.149},{"text":"there are places that are safe to huddle up if the weather is starting to go bad,","startTime":142.16,"finishTime":145.55},{"text":" you could hang out there a little longer and then resume your climb safe.","startTime":145.85,"finishTime":149.11},{"text":"it's a place that you can,","startTime":149.74,"finishTime":151.55},{"text":"you know, take a breather reassess, you know,","startTime":151.74,"finishTime":153.86},{"text":"and then figure out if you want to continue","startTime":153.869,"finishTime":155.399},{"text":"to climb or if you need to regroup or something","startTime":155.41,"finishTime":157.229},{"text":"and all mountains are climbed this way, all the big ones are climbed this way.","startTime":158.13,"finishTime":161.22},{"text":"They're broken up into sections","startTime":161.229,"finishTime":162.699},{"text":"at the end of the day. You, you're still taking one step at a time.","startTime":162.94,"finishTime":165.619},{"startTime":166.259,"finishTime":166.75},{"text":"And so for us, what that means for us is that we are focusing on what we can do today.","startTime":166.929,"finishTime":171},{"text":" And how will it help us tomorrow?","startTime":171.5,"finishTime":173.69},{"text":"So if you think about K2, it's like so far out there, it's so big.","startTime":173.82,"finishTime":177.55},{"text":"How do you actually get there?","startTime":177.559,"finishTime":178.729},{"text":"If you look back, it's uh it's quite difficult and it could be intimidating.","startTime":178.74,"finishTime":182.25},{"text":" But as people are approaching this climb, I want to actually back up a little bit,","startTime":182.979,"finishTime":186.559},{"text":"you know, before","startTime":186.74,"finishTime":187.94},{"text":"any successful climb or adventure.","startTime":188.07,"finishTime":189.949},{"startTime":190.169,"finishTime":190.71},{"text":"There's actually a lot of thoughtful work done before the first steps are taken,","startTime":190.86,"finishTime":194.119},{"text":"right?","startTime":194.139,"finishTime":194.41},{"text":"It's in the planning phase and in the preparation phase.","startTime":194.419,"finishTime":196.669},{"text":"And I feel like the things that we've been","startTime":197.229,"finishTime":198.619},{"text":"doing these last six years and more specifically,","startTime":198.63,"finishTime":201.059},{"text":"these last probably 12 months or 18 months,","startTime":201.07,"finishTime":204.089},{"text":"we've been doing all this preparation.","startTime":204.399,"finishTime":206.119},{"text":"We have lots of incredible validation from all the work that we've already done.","startTime":206.639,"finishTime":210.13},{"text":"We thank you to everyone for all the reorgs and optimizations.","startTime":210.399,"finishTime":214.169},{"text":"Thank you to the new leads and the leads in training.","startTime":214.32,"finishTime":217.1},{"startTime":217.449,"finishTime":217.869},{"text":"You know,","startTime":218.369,"finishTime":218.869},{"text":"we've been taking on newer opportunities.","startTime":218.97,"finishTime":220.789},{"text":"We've been investing in our people team and growing that","startTime":220.8,"finishTime":222.85},{"text":"we've been investing in our PSG team. As you can see,","startTime":223.22,"finishTime":225.83},{"text":"we've been investing in now our partnership development, which, you know,","startTime":226.119,"finishTime":230.059},{"text":"I think it's a more friendly way. It's like it's sales,","startTime":230.369,"finishTime":233.729},{"text":"but really the way we view sales is more in partnership development.","startTime":234.05,"finishTime":236.729},{"text":"So we're investing in that space as well.","startTime":236.74,"finishTime":238.47},{"text":"We've done a lot of work, you know,","startTime":239.509,"finishTime":241.139},{"text":"PSG everyone's done a lot of work to clarify","startTime":241.149,"finishTime":243.11},{"text":"roles and responsibilities and we've updated our BVMMs","startTime":243.119,"finishTime":246.46},{"text":"So,","startTime":246.96,"finishTime":247.46},{"text":"you know, we're investing in ourselves too,","startTime":247.589,"finishTime":249.009},{"text":"like all the leadership training that we've been developing.","startTime":249.02,"finishTime":251.289},{"text":"all the plural site, technical stuff. We've been doing all the tftf Leo","startTime":251.38,"finishTime":256.32},{"text":"identity, all these different components. Um","startTime":256.839,"finishTime":259.298},{"text":"And they've all been in preparation for help us to climb, you know, so what is our K two","startTime":259.738,"finishTime":264.32},{"text":"before actually giving that away yet?","startTime":265.66,"finishTime":267.48},{"text":"Uh It's always good to have, you know,","startTime":267.85,"finishTime":269.489},{"text":"when you're setting like goal setting, you know,","startTime":269.85,"finishTime":271.589},{"text":"the smart framework is actually really good, right?","startTime":271.6,"finishTime":273.459},{"text":"So smart is specific measurable, attainable, relevant and time based.","startTime":273.47,"finishTime":278.25},{"text":"So","startTime":278.899,"finishTime":279.63},{"text":"I'll skip the s for a second here,","startTime":279.869,"finishTime":281.829},{"text":"but for measurable, we count teammates, we count relationships,","startTime":282.059,"finishTime":285.66},{"text":"right? Those are the things that matter to us","startTime":286.04,"finishTime":288.16},{"text":"for obtainable.","startTime":288.47,"finishTime":290.179},{"text":"You know, I believe we put our hearts and our minds to things like we will amaze like,","startTime":290.47,"finishTime":294.63},{"text":"you know,","startTime":294.64,"finishTime":295.079},{"text":"what we can do in a long period over a longer period of time,","startTime":295.32,"finishTime":298.959},{"text":"not just like today or tomorrow or next week, but","startTime":299.059,"finishTime":301.41},{"text":"we think in terms of,","startTime":301.559,"finishTime":302.85},{"text":"you know, years","startTime":303.01,"finishTime":303.97},{"text":"um","startTime":304.39,"finishTime":304.869},{"text":"for relevance, you know,","startTime":305.39,"finishTime":306.579},{"text":"we care about being the best selves, our best selves, right?","startTime":306.79,"finishTime":309.519},{"text":"We care about helping others and we want to make, you know,","startTime":309.529,"finishTime":312.119},{"text":"this work, our workshop,","startTime":312.39,"finishTime":314.059},{"text":"right?","startTime":314.32,"finishTime":314.73},{"text":"And we know that relationships are the foundation and for time,","startTime":315.16,"finishTime":317.7},{"text":"we really want to set a long goal,","startTime":317.709,"finishTime":319.059},{"text":"right? So that at the little","startTime":319.45,"finishTime":321.049},{"text":"I guess, ups and downs,","startTime":321.48,"finishTime":323.309},{"text":"we can look at over a long period of time and see","startTime":323.39,"finishTime":325.76},{"text":"actually the progress that we're making something that's actually K two worthy.","startTime":325.769,"finishTime":329.38},{"text":"So for me, I wanted to set something way out there,","startTime":329.619,"finishTime":332.44},{"text":"which would be like 10 years from now.","startTime":332.45,"finishTime":334.519},{"text":"And so","startTime":335.549,"finishTime":336.16},{"text":"I think","startTime":337.01,"finishTime":337.67},{"text":"to answer the specific question, what is our summit? What is our K two","startTime":337.97,"finishTime":341.22},{"text":"by the end of 2031? We want","startTime":342.299,"finishTime":344.32},{"text":"to be 1000 people strong,","startTime":344.76,"finishTime":346.38},{"text":"all living out our BVMM MS,","startTime":347.22,"finishTime":349.049},{"text":"you know,","startTime":349.75,"finishTime":349.94},{"text":"impacting our own worlds and the worlds that","startTime":349.95,"finishTime":352.38},{"text":"we touch in a meaningful and impactful way.","startTime":352.39,"finishTime":354.63},{"text":"Um We've made great progress already.","startTime":355.54,"finishTime":358.089},{"text":"And because of everything we've done to this point,","startTime":358.1,"finishTime":359.97},{"text":"it's giving us a shot at trying to go after this.","startTime":359.98,"finishTime":362.85},{"text":"So in the short term, by the end of this year, we intend to be 100 people.","startTime":363.739,"finishTime":366.869},{"text":"Um And the reasons for the base camps that I have over here, it's like","startTime":367.7,"finishTime":371.269},{"text":"when we look at how organizations evolve over time","startTime":371.589,"finishTime":374.45},{"text":"as they grow over time and as over size,","startTime":374.459,"finishTime":376.76},{"text":"there are these sort of","startTime":376.85,"finishTime":377.869},{"text":"seasons right, that you will actually change and reorganize again.","startTime":378.73,"finishTime":383.01},{"text":"Um There are natural break points to that. And so we're planning for those to happen.","startTime":383.269,"finishTime":386.76},{"text":"They are when you look at the patterns of other companies who have grown really well,","startTime":386.769,"finishTime":389.98},{"text":"uh and not just grown well or fast, but like sustainably","startTime":390.26,"finishTime":393.63},{"text":"in a healthy manner.","startTime":393.869,"finishTime":394.94},{"text":"Um There are some natural places where","startTime":395.269,"finishTime":397.23},{"text":"we should actually consider maybe a shift, right?","startTime":397.489,"finishTime":400.39},{"text":"You know, dividing and conquering.","startTime":400.519,"finishTime":401.959},{"startTime":402.44,"finishTime":402.859},{"text":"And so","startTime":403.5,"finishTime":404.109},{"text":"I think we are really well organized to go to the second base camp","startTime":404.39,"finishTime":407.92},{"text":"over the next three years and all the work that everyone has done today","startTime":407.929,"finishTime":410.97},{"text":"has set us up well","startTime":411.109,"finishTime":412.35},{"text":"for the next two or three years.","startTime":413.019,"finishTime":414.95},{"text":"So,","startTime":416.04,"finishTime":416.529},{"text":"you know, if we kind of map out what we've been doing,","startTime":416.85,"finishTime":419.5},{"text":"you know, 2015, we're growing, we're learning 16, 17, 18,","startTime":419.779,"finishTime":423.42},{"text":"19 and 2020 is where we're at right now","startTime":423.429,"finishTime":425.559},{"text":"and we're at,","startTime":425.98,"finishTime":426.859},{"text":"you know, even the slide is now out out of date since 65.","startTime":427,"finishTime":430.17},{"text":"But we're in the seventies now.","startTime":430.179,"finishTime":431.69},{"startTime":432.19,"finishTime":432.63},{"text":"And so we have a really clear line of approach","startTime":433.32,"finishTime":435.5},{"text":"for where we wanna go in the next few years.","startTime":435.51,"finishTime":437.329},{"text":"So in this next year,","startTime":437.339,"finishTime":438.399},{"text":"I mentioned that we should be going after base cafe where we will be 100 people.","startTime":438.41,"finishTime":442.69},{"text":"Next year, we made a goal right to climb is next year, end of next year,","startTime":443.92,"finishTime":447.869},{"text":"it will be about 100 and 50 people","startTime":447.88,"finishTime":449.359},{"text":"after that","startTime":449.51,"finishTime":450.339},{"text":"200","startTime":450.45,"finishTime":451.309},{"text":"after that, about","startTime":451.579,"finishTime":452.549},{"text":"250 people. And that's where our base camp be is.","startTime":452.839,"finishTime":455.429},{"text":"And when you look at when organizations,","startTime":455.6,"finishTime":457.41},{"text":"what they'll do is they'll end up kind of dividing around them,","startTime":457.42,"finishTime":459.89},{"text":"right?","startTime":460.38,"finishTime":460.679},{"text":"So then you can specialize, you can have focus,","startTime":460.69,"finishTime":462.91},{"text":"you can create new opportunities for new people.","startTime":462.92,"finishTime":464.869},{"startTime":465.559,"finishTime":465.98},{"text":"And so the next phase, the next leg to base camp c actually follows a path,","startTime":466.329,"finishTime":470.13},{"text":"you know, 10 to 25","startTime":470.839,"finishTime":472.369},{"text":"you know, 325 to 400 people.","startTime":472.519,"finishTime":474.82},{"text":"And as we kind of grow up and going to the summit,","startTime":475.149,"finishTime":477.779},{"text":"our goal is to by like 2029 be able to sort of hit or 2030 be able to hit about 850 people.","startTime":477.79,"finishTime":483.69},{"text":"So we can make a run for the summit.","startTime":483.7,"finishTime":485.07},{"text":"Um","startTime":485.989,"finishTime":486.44},{"text":"Like why would you actually have such, you know,","startTime":486.63,"finishTime":489.269},{"text":"crazy big goals? Right? They're kind of scary.","startTime":490.01,"finishTime":492.279},{"text":"We're only, we're not even 100 people yet, but how can we imagine, you know,","startTime":492.29,"finishTime":495.559},{"text":"going out to that, that place.","startTime":495.57,"finishTime":497.5},{"text":"Um","startTime":497.51,"finishTime":497.929},{"text":"And so kind of like how we've broken it down","startTime":498.29,"finishTime":500.269},{"text":"over here and just these different stages and phases,","startTime":500.279,"finishTime":502.64},{"text":"we have a year to figure out the next stage","startTime":502.649,"finishTime":505.279},{"text":"and another year to figure out the next stage.","startTime":505.29,"finishTime":507.369},{"startTime":507.489,"finishTime":507.959},{"text":"So if you break it out and just look","startTime":508.529,"finishTime":510.049},{"text":"at linear league because we're all technical people,","startTime":510.059,"finishTime":511.959},{"text":"you kind of break it out.","startTime":511.97,"finishTime":512.76},{"text":"Like what does that really mean?","startTime":512.77,"finishTime":514.02},{"text":"You know, where will those 100 people go","startTime":514.21,"finishTime":516.02},{"text":"uh for us?","startTime":516.239,"finishTime":517.03},{"text":"And so when we kind of break it down, you know,","startTime":517.229,"finishTime":519.27},{"text":"there are some natural patterns and ratios for other","startTime":519.28,"finishTime":522.058},{"text":"consultant companies that, you know, how many people are in sales and,","startTime":522.44,"finishTime":526.039},{"text":"and hr and actually in the product teams,","startTime":526.46,"finishTime":528.89},{"text":"there are some ratios that are, you know, repeating patterns out there.","startTime":529.34,"finishTime":532.82},{"text":"So when we look at like 2021 how would we break up this,","startTime":533.14,"finishTime":536.359},{"text":"you know, Alfie says 99","startTime":536.669,"finishTime":538.25},{"text":"right? And that's on our pace to kind of get there.","startTime":538.46,"finishTime":541.09},{"startTime":541.44,"finishTime":541.9},{"text":"You know, how would we divide it up?","startTime":542.45,"finishTime":543.989},{"text":"And these are all flexible,","startTime":544.14,"finishTime":545.25},{"text":"right? These are just guidelines, you know, are we tracking well,","startTime":545.539,"finishTime":549.65},{"text":"you know,","startTime":549.979,"finishTime":550.44},{"text":"there's no fear, there's no penalty, there's no negative things like, oh,","startTime":550.63,"finishTime":553.869},{"text":"let's say we only hit 90 people this year or 80 people this year.","startTime":554.21,"finishTime":557.369},{"text":"That's ok.","startTime":558.159,"finishTime":558.929},{"text":"Right,","startTime":559.429,"finishTime":559.69},{"text":"because maybe in the following year we'll catch up even","startTime":559.7,"finishTime":561.849},{"text":"faster or maybe it takes a few years for us,","startTime":561.859,"finishTime":563.619},{"text":"but we know the path in which we want to get there.","startTime":563.63,"finishTime":566.13},{"startTime":566.82,"finishTime":567.239},{"text":"And so,","startTime":567.549,"finishTime":568.239},{"text":"you know, as we have this detail plan, now, it is actually looser the far route.","startTime":568.539,"finishTime":572.25},{"text":"The year nine plan is quite loose,","startTime":572.26,"finishTime":574.53},{"text":"right?","startTime":574.739,"finishTime":575.15},{"text":"But next year's plan is actually really tight. This year's plan is the spot on.","startTime":575.609,"finishTime":579.469},{"text":" And so to know that like we have the flexibility to get there,","startTime":580.119,"finishTime":582.89},{"text":"it's not just about the numbers,","startTime":582.9,"finishTime":584.099},{"text":"we also care about the quality of like our relationships and how we're doing things.","startTime":584.109,"finishTime":588.09},{"text":"So as our numbers grow, we believe our alignment will grow and tighten up as well,","startTime":588.38,"finishTime":592.71},{"text":"that","startTime":592.719,"finishTime":593.099},{"text":"we will start to specialize the,","startTime":593.369,"finishTime":595.13},{"text":"you know, the field teams will actually, as PSG gets bigger,","startTime":595.39,"finishTime":598.57},{"text":"there's just no way we're gonna know everybody,","startTime":598.58,"finishTime":600.349},{"text":"but we want to be able to make sure that people have care, right?","startTime":601,"finishTime":603.63},{"text":"And they have safety nets","startTime":603.64,"finishTime":604.57},{"text":"and so be able to kind of divide and conquer","startTime":604.78,"finishTime":606.76},{"text":"that maybe some members of the field team will then","startTime":606.77,"finishTime":608.94},{"text":"be focused only on certain PSG teams as the PSG teams get over.","startTime":609.15,"finishTime":613.229},{"text":"Same thing for the people team.","startTime":613.239,"finishTime":614.549},{"text":"There was no way the people team will know,","startTime":615.299,"finishTime":616.989},{"text":"you know, in 10 years, we will know 1000 people,","startTime":617.25,"finishTime":619.33},{"text":"there's just no way an individual because they know 50","startTime":619.7,"finishTime":622.299},{"text":"really well","startTime":622.809,"finishTime":623.63},{"text":"over a longer period of time.","startTime":624.27,"finishTime":626.109},{"startTime":626.46,"finishTime":626.929},{"text":"And so,","startTime":627.159,"finishTime":627.77},{"text":"you know, as we break that out and you can kind of see how things break out, you know,","startTime":628,"finishTime":632.27},{"text":"between like how, how many I CS how many team leads, how many team owners and then","startTime":632.28,"finishTime":635.7},{"text":"really what that is, is just I view it as like it's an opportunity.","startTime":635.88,"finishTime":638.979},{"text":"So if it's right, you know, you want to become a lead, a tech lead, a team lead,","startTime":639.82,"finishTime":643.789},{"text":"a team owner,","startTime":643.799,"finishTime":644.559},{"text":"there is a path that there is opportunity for you.","startTime":644.82,"finishTime":646.989},{"text":" If it isn't right now,","startTime":647.489,"finishTime":649.289},{"text":"it's coming","startTime":649.739,"finishTime":650.489},{"text":"right. And if you're not ready for it now, that's ok.","startTime":650.679,"finishTime":653.46},{"text":"You know, know that it, it will be on its way.","startTime":653.969,"finishTime":656},{"text":"So as you map out across the different years,","startTime":656.479,"finishTime"
