ishTime":1131.02},{"text":"And so when we get to the summit,","startTime":1131.27,"finishTime":1132.609},{"text":"right,","startTime":1133.449,"finishTime":1133.65},{"text":"we wanna show what is possible, right?","startTime":1134.29,"finishTime":1136.569},{"text":"That,","startTime":1136.739,"finishTime":1137.28},{"text":"you know, we and no one else can deny our impact.","startTime":1137.479,"finishTime":1140.349},{"text":"Right. And that we can inspire others to find and climb their own K2.","startTime":1140.569,"finishTime":1143.9},{"startTime":1144.839,"finishTime":1145.29},{"text":"and if we want to make a real impact, it has to be big, it has to be seen.","startTime":1145.729,"finishTime":1148.719},{"text":"It has to be deep and it has to last a long time.","startTime":1149.13,"finishTime":1151.13},{"startTime":1151.76,"finishTime":1152.17},{"text":"and has to be applied to things that actually matter.","startTime":1152.319,"finishTime":1154.579},{"text":"Right. And those are people and those are relationships.","startTime":1154.81,"finishTime":1157.01},{"startTime":1157.739,"finishTime":1158.15},{"text":"do we have it all figured out?","startTime":1158.469,"finishTime":1159.77},{"text":"Right. No,","startTime":1159.939,"finishTime":1160.829},{"text":"but we have tomorrow figured out,","startTime":1162.26,"finishTime":1164.01},{"text":"we know what we're gonna do tomorrow,","startTime":1164.3,"finishTime":1165.589},{"text":"you know, do we have next month? Figure out. Yeah, we got next month figured out.","startTime":1166.27,"finishTime":1169.119},{"text":"And so I think as we progress,","startTime":1169.13,"finishTime":1171.089},{"text":"things become clearer over time,","startTime":1171.439,"finishTime":1173.17},{"text":"you know,","startTime":1173.55,"finishTime":1173.959},{"text":"are we exposing ourselves to failure? Are we growing too fast?","startTime":1174.75,"finishTime":1177.569},{"text":"Are we growing irresponsibly? Like those are good questions to ask and our","startTime":1177.579,"finishTime":1181.079},{"text":"BVMMs help us out. So maybe as we're approaching things, we do slow down, right?","startTime":1181.219,"finishTime":1186},{"text":"New information, new data, new insights from everybody,","startTime":1186.65,"finishTime":1189.13},{"text":"right? It's not something I will build.","startTime":1189.25,"finishTime":1191.28},{"text":"There's just no way, it's something that we have to build together","startTime":1191.38,"finishTime":1194.079},{"text":"and that the people we have today is not even enough,","startTime":1194.329,"finishTime":1197.339},{"text":"right? We're really busy","startTime":1197.709,"finishTime":1199.26},{"text":"and there are new members that we need to bring on.","startTime":1199.39,"finishTime":1201.619},{"text":"Um","startTime":1201.949,"finishTime":1202.42},{"text":"Does everyone have to sign up for 10 years? And the answer is no,","startTime":1203.369,"finishTime":1206.26},{"text":"your journey. And we always talk about everything.","startTime":1207.449,"finishTime":1209.459},{"text":"It's a season, our season together.","startTime":1209.469,"finishTime":1211.42},{"text":"So there'll be some people who want to go some","startTime":1212.209,"finishTime":1214.66},{"text":"answer their own questions,","startTime":1215.01,"finishTime":1216.16},{"text":"discover the new K2 and then want to move towards that.","startTime":1216.17,"finishTime":1218.39},{"text":"We want to wish them well,","startTime":1218.569,"finishTime":1219.739},{"text":"right? We wanna help them on their journey.","startTime":1220.359,"finishTime":1222.219},{"startTime":1222.599,"finishTime":1223.06},{"text":"But it doesn't mean that we don't climb our journey too,","startTime":1223.27,"finishTime":1225.369},{"text":"you know, and then no question like what is my role in this future? Right?","startTime":1226.829,"finishTime":1230.05},{"text":"It's to be determined right by you.","startTime":1230.56,"finishTime":1232.839},{"text":"So maybe you have a great season, you wanna grow and you want to take on new things,","startTime":1233.9,"finishTime":1236.569},{"text":"or maybe you want to take a rest season too.","startTime":1236.579,"finishTime":1238.229},{"text":"But knowing which, where we're going and why we're going,","startTime":1238.579,"finishTime":1240.67},{"text":"there is really important.","startTime":1240.68,"finishTime":1241.609},{"text":"And we will run to more questions","startTime":1242.369,"finishTime":1244.02},{"text":"and more doubts and more uncertainty.","startTime":1244.26,"finishTime":1245.839},{"text":"If you think if we can approach it the way we've approached sort","startTime":1246.14,"finishTime":1248.719},{"text":"of the all the tech challenges and property challenges that we have,","startTime":1248.729,"finishTime":1251.719},{"text":"we do it together,","startTime":1252.18,"finishTime":1253.079},{"text":"we break it apart,","startTime":1253.4,"finishTime":1254.449},{"text":"you know, look at it, we find a solution","startTime":1254.75,"finishTime":1256.39},{"text":"and then we move on and we find the next thing.","startTime":1256.619,"finishTime":1258.31},{"text":"And I think if we just, you know,","startTime":1258.77,"finishTime":1260.5},{"text":"stick to the process in which we have done and found success,","startTime":1261.43,"finishTime":1264.78},{"text":"I don't","startTime":1264.979,"finishTime":1265.66},{"text":"doubt that it would not be able to provide us success going forward as well.","startTime":1266.069,"finishTime":1269.459},{"text":"And we're always growing and we're always learning.","startTime":1269.869,"finishTime":1271.68},{"text":"So we'll make it better every single time.","startTime":1271.689,"finishTime":1273.449},{"text":"So we'll grow in our awareness, we'll grow in our creativity,","startTime":1273.829,"finishTime":1276.65},{"text":"we'll grow in our innovation and we'll grow in our grip through this thing,","startTime":1276.709,"finishTime":1279.5},{"text":"I would say, like, you know,","startTime":1282.219,"finishTime":1283.63},{"text":"that's it. Yep.","startTime":1285.119,"finishTime":1285.829},{"text":"There you","startTime":1286.739,"finishTime":1287.3},{"text":"go.","startTime":1287.439,"finishTime":1287.989},{"text":"I would say that um I guess I like to close this way. Um","startTime":1290.489,"finishTime":1293.469},{"text":"I believe this is a really, really special time in, in our history that","startTime":1295.089,"finishTime":1298.949},{"text":"the founding was","startTime":1299.43,"finishTime":1300.67},{"text":"instrumental.","startTime":1300.849,"finishTime":1301.579},{"text":"It was sort of the first, but this feels like the next chapter,","startTime":1301.589,"finishTime":1304.449},{"text":"sort of clarity of what we're trying to do and build.","startTime":1304.459,"finishTime":1306.78},{"text":"This is what we're up to.","startTime":1307.28,"finishTime":1308.78},{"text":"I know many of you who interviewed me sort of as the last person,","startTime":1309.199,"finishTime":1312.849},{"text":"I think the most common question I got was like, where do you see","startTime":1313.099,"finishTime":1315.719},{"text":"works in five years","startTime":1315.93,"finishTime":1317.069},{"text":"or two years or,","startTime":1317.41,"finishTime":1319.06},{"text":"you know,","startTime":1320.17,"finishTime":1320.739},{"text":"I never had an answer for you.","startTime":1320.859,"finishTime":1322.119},{"text":"I always answered, I know, I don't know where we're going,","startTime":1322.27,"finishTime":1325},{"text":"but I know how we're gonna get there.","startTime":1325.01,"finishTime":1326.439},{"text":"I think now,","startTime":1326.979,"finishTime":1327.93},{"text":"you know, sharing with you the BBM MS, the K two,","startTime":1328.119,"finishTime":1331.26},{"text":"you actually have that answer and you can","startTime":1331.459,"finishTime":1332.64},{"text":"provide the answer for yourself and for others,","startTime":1332.65,"finishTime":1334.4},{"text":"this is how we're gonna get there with the BBM MS.","startTime":1335.329,"finishTime":1337.329},{"text":"This is where we're going with K two.","startTime":1337.609,"finishTime":1339.3},{"text":"Um And so whenever you're in doubt, whenever you get confused, right?","startTime":1339.92,"finishTime":1343.219},{"text":"There's a saying like when in doubt, you know, zoom back out,","startTime":1343.359,"finishTime":1346.209},{"text":"remember, look at the big picture, the big picture,","startTime":1346.619,"finishTime":1349.209},{"text":"the long term, what we're after","startTime":1349.369,"finishTime":1351.339},{"text":"and that should give you guidance and that should give you freedom","startTime":1351.699,"finishTime":1355.04},{"text":"into deciding and those decisions that you're making on your own,","startTime":1355.05,"finishTime":1358.63},{"text":"helping steering you in the right direction.","startTime":1358.939,"finishTime":1360.709},{"text":"So I know there's a lot of to absorb. I've been yammering this whole time.","startTime":1362.25,"finishTime":1365.619},{"text":"Um,","startTime":1365.76,"finishTime":1366.359},{"text":"there will be questions, ask them.","startTime":1366.739,"finishTime":1368.619},{"text":"Right.","startTime":1369.599,"finishTime":1369.959},{"text":"That's how we would approach a technical problem.","startTime":1370.229,"finishTime":1372.209},{"text":"This is a","startTime":1372.52,"finishTime":1373.449},{"text":"technical problem as well on the business side.","startTime":1373.819,"finishTime":1376.209},{"text":"Right.","startTime":1376.8,"finishTime":1377.209},{"text":"And","startTime":1377.31,"finishTime":1377.93},{"text":"if you're worried or scared, that's ok. That's normal. That's natural. I am too.","startTime":1378.41,"finishTime":1382.25},{"text":"Right. But it doesn't stop us from going after it.","startTime":1383.13,"finishTime":1385.51},{"text":"If you look at all everything we've done in the past","startTime":1385.52,"finishTime":1387.42},{"text":"and look at your past history before you're even outward.","startTime":1387.43,"finishTime":1389.709},{"text":"What has led to your most growth and your most success and your","startTime":1390.369,"finishTime":1393.099},{"text":"most impact that's probably taking on something hard and scary and unknown,","startTime":1393.109,"finishTime":1397.579},{"text":"but you still push past it","startTime":1398.05,"finishTime":1399.38},{"text":"because you had something bigger in mind.","startTime":1399.569,"finishTime":1401.099},{"text":"We do two together.","startTime":1401.77,"finishTime":1403.209},{"text":"So","startTime":1403.38,"finishTime":1403.92},{"text":"with that being said, I will, uh","startTime":1404.349,"finishTime":1406.26},{"text":"open up the questions","startTime":1408,"finishTime":1409.56},{"text":"so we can find in the chat here.","startTime":1409.979,"finishTime":1411.609},{"text":"Let's see.","startTime":1413.75,"finishTime":1414.869},{"text":"So I would say, as you're processing it all, um,","startTime":1420.449,"finishTime":1423.199},{"text":"feel free to hit me up a ma ask your leads,","startTime":1423.209,"finishTime":1426.219},{"text":"right? Go challenge them a little, ask your team owners, ask Alfie, ask Janine,","startTime":1426.38,"finishTime":1430.64},{"text":"right?","startTime":1431.119,"finishTime":1431.52},{"text":"This story that we are building together,","startTime":1431.729,"finishTime":1433.63},{"text":"you will have to know for yourself and it's ok to ask questions,","startTime":1433.76,"finishTime":1436.28},{"text":"right? We've been working on,","startTime":1436.78,"finishTime":1438.459},{"text":"you know,","startTime":1439.339,"finishTime":1439.52},{"text":"many of us sort of the older the marinated folks have been working on this for years,","startTime":1439.53,"finishTime":1443.469},{"text":"right?","startTime":1444.099,"finishTime":1444.39},{"text":"And we don't have it all figured out,","startTime":1444.4,"finishTime":1445.66},{"text":"but we know that we will figure it out and I think together it's an eventuality,","startTime":1445.67,"finishTime":1448.77},{"text":"right? If it takes 11 years, would we be sad?","startTime":1449.13,"finishTime":1451.67},{"text":"Right? Or in 10 years, we only helped only help 500 people or 400 people,","startTime":1452.369,"finishTime":1457.16},{"text":"we won't cry but we're going after something big.","startTime":1457.489,"finishTime":1459.8},{"startTime":1460.239,"finishTime":1460.79},{"text":"And I think things guide us along the way.","startTime":1461.329,"finishTime":1463.239},{"text":"So","startTime":1463.709,"finishTime":1464.359},{"text":"I just wanna say thank you everyone for joining us on this journey, for being","startTime":1464.479,"finishTime":1467.53},{"text":"and coming here this thus far.","startTime":1467.819,"finishTime":1469.729},{"text":"I love for you guys to","startTime":1470.099,"finishTime":1471.349},{"text":"see what's going to happen in the next year, two years, three years.","startTime":1471.839,"finishTime":1475.079},{"startTime":1475.41,"finishTime":1475.939},{"text":"And I'm looking forward to, you know, all of our growth. So thank you everyone.","startTime":1476.489,"finishTime":1480.239}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T07:50:09.542Z","dateCreated":"2024-02-16T08:22:53.422Z"}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["pJpwWjPjb9bp2wNqs"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"M38nrA9tmi3HQ3Lpf":{"_id":"M38nrA9tmi3HQ3Lpf","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"History of OpsWerks","template":"resourceVideo","locale":"en","upload":"fYEiTmre4r9HxzC86"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T07:47:54.466Z","dateCreated":"2024-02-20T01:32:53.781Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["fYEiTmre4r9HxzC86"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"Ts3c9qb6Pq2bMdt22":{"_id":"Ts3c9qb6Pq2bMdt22","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"OpsWerks Business Model - Video","template":"resourceVideo","locale":"en","upload":"nqAJupCQbRg3atbXk"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here.","startTime":0.05,"finishTime":1.22},{"text":"Just want to give a little bit more,","startTime":1.48,"finishTime":3.5},{"text":"I guess context or details about how our business model actually works.","startTime":3.509,"finishTime":7.139},{"text":"As we talked about before, in some of my other videos, um we basically","startTime":7.469,"finishTime":11.51},{"text":"is focused on taking care of its people","startTime":11.81,"finishTime":13.619},{"text":"and then when it's people are, you know, healthy and thriving,","startTime":13.779,"finishTime":16.129},{"text":"then they're able to build amazing teams and help each other out","startTime":16.139,"finishTime":18.92},{"text":"and when that is done,","startTime":19.2,"finishTime":20.709},{"text":"um then we're able to be our best for our partners that are out there.","startTime":20.95,"finishTime":24.379},{"text":"Um But a little bit more details about like, you know,","startTime":24.809,"finishTime":26.739},{"text":"are we building by the hour or are we building by the project?","startTime":26.75,"finishTime":30.26},{"text":"Are we, you know, what's our approach to things and","startTime":30.27,"finishTime":32.549},{"text":"really, it's around um building towards becoming a managed service?","startTime":32.659,"finishTime":37.31},{"text":"Now, the reason why we don't build towards the hour um is that we really, you know,","startTime":37.319,"finishTime":42.4},{"text":"there's some competitors out there","startTime":42.409,"finishTime":44.005},{"text":"that it actually would be playing to their strengths,","startTime":44.275,"finishTime":47.384},{"text":"they will be coming in from a different maybe","startTime":47.395,"finishTime":49.165},{"text":"like Cost Center like India where it would be","startTime":49.174,"finishTime":51.044},{"text":"a fraction of the cost.","startTime":51.165,"finishTime":52.444},{"text":"So we're actually trying to focus towards how we play the game the best,","startTime":52.595,"finishTime":55.654},{"text":"which is really taking care of our people,","startTime":55.665,"finishTime":57.224},{"text":"building great teams and the team coming as a whole unit","startTime":57.235,"finishTime":60.845},{"text":"to solve problems for the customers.","startTime":61.115,"finishTime":62.755},{"text":"And really at the end of the day, the customers really want some sort of outcome.","startTime":62.764,"finishTime":65.815},{"text":"So when we write our contracts, we write our proposals,","startTime":65.824,"finishTime":68.864},{"text":"we typically write towards an outcome.","startTime":68.875,"finishTime":70.625},{"text":"We don't really say how many people it will be.","startTime":70.635,"finishTime":72.705},{"text":"Um But behind the scenes,","startTime":72.959,"finishTime":74.16},{"text":"we are doing some calculation about like what will make it sustainable for us.","startTime":74.169,"finishTime":77.849},{"text":"Um There are different people on night shift,","startTime":77.86,"finishTime":79.989},{"text":"how many people do we need to shift from night shift to day shift to afternoon shift","startTime":80,"finishTime":83.68},{"text":"to make sure it's sustainable because living out our BVMM","startTime":83.86,"finishTime":86.69},{"text":"taking care of each other is actually our priority.","startTime":86.699,"finishTime":89.169},{"text":"And so in all of the proposals that we write,","startTime":89.76,"finishTime":91.839},{"text":"uh we're looking for sustainability of our team","startTime":92.01,"finishTime":94.41},{"text":"um is an interesting projects that we have.","startTime":94.54,"finishTime":97.01},{"text":"Um And so for the most part, you know, eventually it does kind of, you know,","startTime":97.019,"finishTime":100.51},{"text":"when we work with our customers, I will eventually sort of drill down towards like","startTime":100.519,"finishTime":104.339},{"text":"how much does the head count cost for them.","startTime":104.65,"finishTime":107.029},{"text":"Uh But we are always working hard to, you know,","startTime":107.23,"finishTime":109.809},{"text":"you know, sort of highlight the values of what we provide","startTime":110.08,"finishTime":112.629},{"text":"um and really looking towards outcomes and building it towards more of","startTime":112.959,"finishTime":116.5},{"text":"a managed services so that we can rotate people in and out.","startTime":116.51,"finishTime":119.669},{"text":"Um Just to give variety to our own teammates uh bring new team members in.","startTime":119.68,"finishTime":123.529},{"text":"Uh But at the end of the day providing the same amazing outcomes that we do. So,","startTime":123.669,"finishTime":126.949},{"text":"uh if you have any questions, feel free to ask.","startTime":127.23,"finishTime":129.089},{"text":"Um but that's a little bit more detail about how our business actually operates.","startTime":129.1,"finishTime":131.929},{"text":"Take care. Bye bye.","startTime":131.94,"finishTime":132.97}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T07:48:58.332Z","dateCreated":"2024-02-16T08:22:53.422Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["nqAJupCQbRg3atbXk"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"cLmNnPEfNDgbDLY6M":{"_id":"cLmNnPEfNDgbDLY6M","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Welcome to OpsWerks!","template":"resourceVideo","locale":"en","upload":"aTu2Q7Jp4TkTfxPCw"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":false,"needToCompleteSlideForPageCompletion":false,"background":{"backgroundColor":"koantic(light1, 0, 1)"},"overlays":[{"identifier":"Pjr2g5g4nxxorf3Wg","kind":"overlay","type":"button","width":253.00000000000003,"height":55,"x":90,"y":475,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"font":{"size":20,"bold":false,"underline":false,"italic":false},"fontColor":"koantic(dark2, 0, 1)","textAlignment":"center","type":"button","border":{"size":2,"color":"koantic(dark2, 0, 1)","left":true,"right":true,"top":true,"bottom":true},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Button","hover":{"fillColor":"koantic(dark2, 0, 0.01)","fontColor":"koantic(light1, 0, 1)","borderColor":"koantic(dark2, 0, 1)"},"roundedCorners":{"bottomLeft":100,"bottomRight":100,"topLeft":100,"topRight":100}},"start":1.3,"behaviorType":"continue","rotationAngle":0,"clickAction":{"goToPage":{"type":"tableOfContentPage","pageId":"Jt3bm4mNyYDhqPinT"},"type":"goToPage"}}]},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T07:45:57.606Z","dateCreated":"2024-02-16T08:22:53.423Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["aTu2Q7Jp4TkTfxPCw"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"hideMediaControls":false},"e87C7ZZZ8YZRz5WtK":{"_id":"e87C7ZZZ8YZRz5WtK","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"The K2 Journey","template":"resourceVideo","locale":"en","upload":"M4LaAX3wfhHsGS9Nm"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"background":{"backgroundColor":"koantic(light1, 0, 1)"},"isTranscribingCaptions":false,"captions":[{"text":"K2 is the second highest mountain on Earth after Mount Everest,","startTime":0.319,"finishTime":4.699},{"text":"K2 amongst the climbers is regarded as the hardest,","startTime":5.59,"finishTime":9.069},{"text":"most challenging climb out there","startTime":9.079,"finishTime":11.06},{"text":"with Everest, over 4000 people summited it.","startTime":11.899000000000001,"finishTime":15.119},{"text":"But in K2, there's only been 367 summits.","startTime":15.27,"finishTime":19.51},{"text":"It's the biggest challenge of them all.","startTime":20.399,"finishTime":22.37},{"text":"And there's actually different approaches of K2 that have never been climbed.","startTime":22.379,"finishTime":26.18},{"text":"Like the Eastern approach,","startTime":26.19,"finishTime":27.489},{"text":"SK chooses K2 as a representation of how challenging it is to build a company as","startTime":28.37,"finishTime":33.68},{"text":"we want to preserve the culture or our BVMMs","startTime":33.689,"finishTime":36.439},{"text":"in achieving our goal and reaching the summit.","startTime":36.45,"finishTime":38.86}]},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T07:49:42.423Z","dateCreated":"2024-02-16T08:22:53.422Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["M4LaAX3wfhHsGS9Nm"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"nTfoCwJtN6bHvHX4R":{"_id":"nTfoCwJtN6bHvHX4R","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"OpsWerks' Business Model","template":"resourceVideo","locale":"en","upload":"NinwTcQiDEtY2ncCH"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"overlays":[{"identifier":"6mH8QGpEPrPwa6Qi9","kind":"overlay","type":"button","width":230,"height":55,"x":157,"y":467,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"font":{"size":20,"bold":false,"underline":false,"italic":false},"fontColor":"koantic(light1, 0, 1)","textAlignment":"center","type":"button","border":{"size":0,"color":"#000000","left":true,"right":true,"top":true,"bottom":true},"fill":{"type":"color","color":"koantic(accent5, 0, 0)"},"padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Button","hover":{"fillColor":"koantic(dark2, 0, 0.41)"},"roundedCorners":{"bottomLeft":100,"bottomRight":100,"topLeft":100,"topRight":100}},"start":1,"behaviorType":"continue","rotationAngle":0,"clickAction":{"goToPage":{"type":"tableOfContentPage","pageId":"wWCGEGFuvEEzCNDrW"},"type":"goToPage"}}]},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-02-20T02:16:23.347Z","dateCreated":"2024-02-20T02:13:15.155Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["NinwTcQiDEtY2ncCH"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"rMeyZBgjGTfYTqFbw":{"_id":"rMeyZBgjGTfYTqFbw","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceVideo","locale":"en","upload":"ka4dJvHnyqMEfyPsW"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T07:44:28.321Z","dateCreated":"2024-03-06T07:44:03.431Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["ka4dJvHnyqMEfyPsW"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"t5kyCSz3Hkwcww6Nq":{"_id":"t5kyCSz3Hkwcww6Nq","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Branding Video","template":"resourceVideo","locale":"en","upload":"REmfriZHL6CXShizM"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here. We're gonna try this in a one take.","startTime":0.009,"finishTime":2.819},{"text":"I'm excited to share our updated uh branding, ","startTime":3.75,"finishTime":7.079},{"text":"content assets and everything else that's out here.","startTime":7.82,"finishTime":10.55},{"text":"So if you want to walk through it with me, um I'm covering it in this video,","startTime":10.579,"finishTime":13.77},{"text":"but I will post all these slides up there and","startTime":13.779,"finishTime":16.559},{"text":"then we'll talk about a little bit in our town hall.","startTime":16.569,"finishTime":18.309},{"text":"So kind of just going right through this whole thing of, you know,","startTime":18.319,"finishTime":21.889},{"text":"I think the first question we want to ask is like,","startTime":21.899,"finishTime":23.709},{"text":"why and how did we come up with a new branding and, and everything?","startTime":23.719,"finishTime":27.19},{"text":"And","startTime":27.2,"finishTime":27.45},{"text":"really, you know, why do we, you know, I think, you know,","startTime":27.889,"finishTime":31.11},{"text":"why do we want to change what's working right now and what we love","startTime":31.12,"finishTime":34.529},{"text":"and I think I just want to share with you the story of our,","startTime":34.56,"finishTime":37.13},{"text":"you know, you know, when we think about branding, we think about maybe like the name,","startTime":37.189,"finishTime":40.939},{"text":"how it's spelled and maybe the logos that come along with it.","startTime":41.02,"finishTime":44.11},{"text":"So the original","startTime":44.349,"finishTime":44.979},{"text":"logo was actually done by","startTime":45.31,"finishTime":47.099},{"text":"um five different fibers that I","startTime":47.389,"finishTime":49.38},{"text":"had paid out there to kind of come with the logos and I actually didn't like anything","startTime":49.56,"finishTime":53.389},{"text":"and I told one of them just like, hey,","startTime":53.56,"finishTime":55.15},{"text":"gear,","startTime":55.349,"finishTime":56.189},{"text":"put some people in it.","startTime":56.549,"finishTime":57.58},{"text":"And really,","startTime":58.229,"finishTime":59.189},{"text":"what that was about was like,","startTime":59.419,"finishTime":60.95},{"text":"you know, when we first started OpsWerks, it was really about, you know,","startTime":61.15,"finishTime":63.59},{"text":"what we really believe, which is,","startTime":63.599,"finishTime":64.72},{"text":"it's not just the machine that's on the outside that you see,","startTime":64.73,"finishTime":67.26},{"text":"it's actually the people on the inside that make it possible.","startTime":67.269,"finishTime":69.569},{"text":"But when we kind of look up, think about like, you know,","startTime":70.55,"finishTime":72.76},{"text":"how we evolve and how we want to grow.","startTime":72.769,"finishTime":75.22},{"text":"It's really important that we, you know,","startTime":75.66,"finishTime":77.569},{"text":"make some changes so that we can continue growing.","startTime":77.58,"finishTime":80.22},{"text":"And so one of those changes we had was,","startTime":80.349,"finishTime":82.279},{"text":"and then we started to learn about ourselves and as OpsWerks is","startTime":82.29,"finishTime":85.669},{"text":"it wasn't just about the people inside the machine.","startTime":85.819,"finishTime":88.739},{"text":"It's about what we want to be able to do and how we want to be able to","startTime":88.9,"finishTime":92.62},{"text":"you know, sort of transform as well.","startTime":92.98,"finishTime":94.62},{"text":"So","startTime":94.889,"finishTime":95.739},{"text":"we are looking at, you know,","startTime":95.86,"finishTime":97.22},{"text":"it going through this whole process if it didn't work out, if it didn't feel right,","startTime":97.23,"finishTime":100.66},{"text":"we would just go back to the original thing.","startTime":100.669,"finishTime":101.879},{"text":"So that was sort of the process. And,","startTime":101.889,"finishTime":103.79},{"text":"you know, I think one thing we also found was that people really love","startTime":104.209,"finishTime":106.949},{"text":"works itself, but","startTime":107.139,"finishTime":108.22},{"text":"OpsWerks -- the name, the logo,","startTime":108.519,"finishTime":110.97},{"text":"you know, when we boil it down and actually those don't matter.","startTime":111.36,"finishTime":114.33},{"text":"It's about the people and what we are doing inside. So","startTime":114.339,"finishTime":116.839},{"text":"that was the key thing we want to be able to represent on the outside because","startTime":117.459,"finishTime":120.699},{"text":"people on the outside can't see anything that we're doing and, and we need to do,","startTime":120.9,"finishTime":124.76},{"text":"you know, a better job about um representing ourselves well,","startTime":124.83,"finishTime":127.93},{"text":"representing each other.","startTime":127.94,"finishTime":129.169},{"text":"Well, so others outside can find us.","startTime":129.179,"finishTime":130.869},{"text":"So sort of this process that we went through is we brought in experts and","startTime":131.229,"finishTime":134.85},{"text":"outsiders really to give us an ability to look objectively at what we're doing,","startTime":134.86,"finishTime":139.96},{"text":"to try to explain what we're doing, how we're doing it and then","startTime":139.97,"finishTime":143.32},{"text":"getting their feedback on what's the best way to be able to say that to express that","startTime":143.669,"finishTime":147.61},{"text":"we also wanted to, you know,","startTime":147.97,"finishTime":149.57},{"text":"not just do this with me or just sort of the leadership team,","startTime":149.58,"finishTime":152.72},{"text":"it was very important that we got other people involved.","startTime":152.75,"finishTime":155.96},{"text":"So we try to go as wide and as broad as possible.","startTime":155.97,"finishTime":158.58},{"text":"So we collaborate with new members,","startTime":158.789,"finishTime":161.25},{"text":"some season members um all across different functions. leaders,","startTime":161.5,"finishTime":165.509},{"text":"leads, ICs","startTime":165.61,"finishTime":167.339},{"text":"people team; kind of all over the place and we really want it to be","startTime":167.57,"finishTime":171.02},{"text":"cross functional so we can get the feedback in so we can make really good decisions","startTime":171.029,"finishTime":174.58},{"text":"and really at the end of the day,","startTime":174.869,"finishTime":175.809},{"text":"check it against our BVMMs to see if this aligns with how","startTime":175.82,"finishTime":179.559},{"text":"we think and believe and how we actually are operating in the day.","startTime":179.57,"finishTime":182.6},{"text":"Uh So many thanks to Jenn Romney, JJ, and Nicole,","startTime":183.699,"finishTime":187.649},{"text":"they were our guys on the outside and this was actually quite a long process.","startTime":187.66,"finishTime":191.27},{"text":"I would say our first initial discussion started in September","startTime":191.279,"finishTime":194.949},{"text":"and we finished everything up um sometime in May.","startTime":195.089,"finishTime":198.02},{"text":"So literally,","startTime":198.11,"finishTime":198.83},{"text":"it took us nine months of just kind of playing with it","startTime":198.839,"finishTime":201.039},{"text":"back and forth and to be able to see with it.","startTime":201.05,"finishTime":202.729},{"text":"I want to say a lot of thanks to our internal team","startTime":203.089,"finishTime":205.47},{"text":"who have been really hard to give us feedback to represent us.","startTime":205.479,"finishTime":209.529},{"text":"Well, so thanks again to uh","startTime":209.539,"finishTime":211.13},{"text":"I think this is, this is actually in alphabetical order. ","startTime":211.589,"finishTime":214.639},{"text":"Aby,","startTime":214.88,"finishTime":215.88},{"text":"Adrian, Alfie, Angelo, Chris, Eric, Floyd, Gelore","startTime":215.99,"finishTime":220.11},{"text":"Gen, Giselle,","startTime":220.38,"finishTime":221.16},{"text":"Lee, Jacy, Jona, Kat, MJ,","startTime":221.429,"finishTime":224.69},{"text":"Bay, Mark Lee, Nena,","startTime":224.85,"finishTime":227.139},{"text":"Paul, Rolin, and Tom - thank you so much for your feedback on things.","startTime":227.36,"finishTime":230.99},{"text":"It was really helpful to get","startTime":231,"finishTime":232.63},{"text":"your guidance and it,","startTime":232.77,"finishTime":234.36},{"text":"it was interesting to see us kind of triangulate to kind of the same space.","startTime":234.369,"finishTime":237.899},{"text":"So, first and foremost, how do we spell our name?","startTime":238.6,"finishTime":241.69},{"text":"I think we've seen everything on the sort of,","startTime":241.919,"finishTime":244.05},{"text":"I think maybe it's on the left on the screen here for you all","startTime":244.059,"finishTime":246.419},{"text":"is different ways that we spelled it. I originally spelled","startTime":247.41,"finishTime":249.729},{"text":"and I originally wanted it to just be all lower case","startTime":250.02,"finishTime":252.71},{"text":"mainly because","startTime":253.38,"finishTime":254.449},{"text":"I'm always thinking about efficiencies of like save key strokes,","startTime":254.72,"finishTime":258.01},{"text":"save that shift, you know, effort on the, you know,","startTime":258.04,"finishTime":261.238},{"text":"on your left hand from having to capitalize different things.","startTime":261.25,"finishTime":263.799},{"text":"and then like, well, what do you do? When","startTime":264.13,"finishTime":265.989},{"text":"is the beginning of a sentence? Those people start capitalizing it.","startTime":266.22,"finishTime":268.67},{"text":"People capitalize the werks.","startTime":268.829,"finishTime":270.42},{"text":"and we saw our customers kind of do a little bit of everything","startTime":270.91,"finishTime":274.529},{"text":"for us because we weren't clear because we were using different things too.","startTime":274.54,"finishTime":277.47},{"text":"Um, I think one thing going through the exercise, which was really important is","startTime":277.95,"finishTime":281.26},{"text":"the word","startTime":281.589,"finishTime":282.119},{"text":"OpsWerks actually gets lost in a lot of paragraphs because if it's all lower case,","startTime":282.23,"finishTime":285.619},{"text":"it just sort of blends all the way in and it was","startTime":285.63,"finishTime":287.779},{"text":"important,","startTime":288.679,"finishTime":289.609},{"text":"it was brought to our attention.","startTime":289.799,"finishTime":291.059},{"text":"It's really important for us to actually show up and show out there. So","startTime":291.07,"finishTime":294.369},{"text":"the new way or the,","startTime":294.75,"finishTime":296.019},{"text":"the way that we're gonna to standardize spelling off works is with a capital O and","startTime":296.029,"finishTime":299.399},{"text":"the capital W and it will make more sense as we go down these other slides","startTime":299.41,"finishTime":303.459},{"text":"about why and how do we make it pop","startTime":303.779,"finishTime":306.32},{"text":"now going to our logo are, I guess,","startTime":307.38,"finishTime":310.239},{"text":"you know, very recognizable. We've had it since day zero","startTime":310.859,"finishTime":313.739},{"text":"logo and I want,","startTime":314.13,"finishTime":315.709},{"text":"I'm happy to share with you the logo that we","startTime":315.72,"finishTime":317.47},{"text":"have that we are gonna be moving forward with today.","startTime":317.48,"finishTime":320.57},{"text":"And so","startTime":321.049,"finishTime":321.709},{"text":"it pays a little bit of a tribute to our Green OpsWerks that we've always had.","startTime":321.91,"finishTime":326.089},{"text":"But if you look at it from a couple of different angles,","startTime":326.369,"finishTime":328.609},{"text":"it looks like it's actually four different areas,","startTime":328.619,"finishTime":331.529},{"text":"right? But then also if you look at it from another angle, it looks like the,","startTime":331.799,"finishTime":334.92},{"text":"the boxer one way versus the other way.","startTime":335.029,"finishTime":336.85},{"text":"But really, it's actually a butterfly in here.","startTime":336.859,"finishTime":339.109},{"text":"And I think it's really more representative of how","startTime":339.339,"finishTime":341.82},{"text":"we see ourselves and how we see ourselves today.","startTime":341.829,"finishTime":344.41},{"text":"And it's more aligned with our BVMMs, not just the people inside the machine,","startTime":344.42,"finishTime":347.899},{"text":"but this transformation that we're all trying to become, right,","startTime":348.19,"finishTime":350.64},{"text":"becoming our best selves and how we want to do it","startTime":350.649,"finishTime":352.859},{"text":"and how we want to show up for each other.","startTime":352.869,"finishTime":354.47},{"text":"And so this is more of a outward expression of what we really believe on the inside","startTime":354.91,"finishTime":359.109},{"text":"without, with it, with it being sort of understood and sort of seen on the outside.","startTime":360.329,"finishTime":364.69},{"text":"But as you dig in a little bit deeper, it becomes more representative of who we are.","startTime":364.75,"finishTime":369.26},{"text":"The other thing we do is taking this logo is to actually flip the colors around","startTime":370.32,"finishTime":374.41},{"text":"before we had the ops side uh was the focus point which was, you know, greened out.","startTime":374.67,"finishTime":380.01},{"text":"And then","startTime":380.019,"finishTime":380.39},{"text":"as we talked through,","startTime":380.82,"finishTime":381.769},{"text":"it became much more apparent and important that it's actually the work side.","startTime":381.779,"finishTime":385.39},{"text":"And","startTime":385.75,"finishTime":386.69},{"text":"we'll explain more about the works,","startTime":386.809,"finishTime":388.19},{"text":"but we wanted to emphasize the work side and our differentiation on it.","startTime":388.2,"finishTime":392.529},{"text":"being the e","startTime":392.54,"finishTime":393.579},{"text":"the o","startTime":393.79,"finishTime":394.369},{"text":"um something that we're also be moving forward on.","startTime":395.049,"finishTime":397.489},{"text":"And really, I think um want to emphasize I'm playing up on is","startTime":397.5,"finishTime":400.7},{"text":"there's a difference between work, the W er K, which is what we do","startTime":400.88,"finishTime":404.589},{"text":"and there's the difference of Wrrk, which is what we all have to do. Right.","startTime":404.85,"finishTime":408.779},{"text":"And everybody in the world has to do","startTime":408.79,"finishTime":410.2},{"text":"and the opportunity that's available to transform work of what it could be","startTime":410.489,"finishTime":414.549},{"text":"from what it is today, um to where we want it to be,","startTime":414.799,"finishTime":418.04},{"text":"we want to be able to come in with our wholesales and","startTime":418.309,"finishTime":421.399},{"text":"um be able to be our full selves and help","startTime":421.619,"finishTime":423.839},{"text":"others to bring their full selves into work too.","startTime":423.85,"finishTime":425.98},{"text":"But","startTime":425.989,"finishTime":426.269},{"text":"in a lot of other places, it may not be so welcomed,","startTime":426.399,"finishTime":429.44},{"text":"it may not be appreciated. It may not actually be the focus of what they want to do.","startTime":429.7,"finishTime":433.04},{"text":"And so we are working really hard to","startTime":433.38,"finishTime":435.619},{"text":"play up on the, the W E R K","startTime":435.73,"finishTime":438.589},{"text":"and so any word with the word work in it, we will our,","startTime":439.399,"finishTime":442.29},{"text":"our version of it, our twist of it","startTime":442.619,"finishTime":444.299},{"text":"is really what we want to emphasize on it. So there's the work that people do and,","startTime":444.45,"finishTime":448.82},{"text":"and then there's like homework and there, there's homework, right?","startTime":449.079,"finishTime":452.049},{"text":"Maybe for what we would be doing.","startTime":452.059,"finishTime":453.7},{"text":"So,","startTime":454.029,"finishTime":454.489},{"text":"some of the things we're gonna lock in on is","startTime":454.5,"finishTime":456.75},{"text":"we're gonna be locking in the works being our blog.","startTime":456.76,"finishTime":459.869},{"text":"And how we demonstrate what work really is like and how we see the world","startTime":460.1,"finishTime":464.299},{"text":"and how we want to show up in the world and how we express what we,","startTime":464.309,"finishTime":466.72},{"text":"what we do,","startTime":466.73,"finishTime":467.5},{"startTime":467.869,"finishTime":468.38},{"text":"we've always had the BVMMs and it was the M&Ms before that. But, you know, we've,","startTime":468.769,"finishTime":474.109},{"text":"you know,","startTime":474.39,"finishTime":474.859},{"text":"tried to find a way to put it in something","startTime":475.45,"finishTime":478.179},{"text":"that is more understandable on the outside as well.","startTime":478.19,"finishTime":481.339},{"text":"So,","startTime":481.35,"finishTime":481.76},{"text":"you know, the BVMM is the foundation of who we are and we want to actually call,","startTime":482.51,"finishTime":486.42},{"text":"start calling it the ground werk.","startTime":486.429,"finishTime":488.07},{"text":"And then when we want to represent like there's people who are","startTime":488.329,"finishTime":490.309},{"text":"doing the work and then there's us who are doing the work,","startTime":490.32,"finishTime":492.7},{"text":"which is actually living out the ground work, which is living out the BVMMs","startTime":492.709,"finishTime":496.2},{"text":"as a collective. How do we represent?","startTime":497.809,"finishTime":499.529},{"text":"How do we call ourselves ops works, you know,","startTime":499.54,"finishTime":501.579},{"text":"what do we call the whole collective of people?","startTime":501.589,"finishTime":503.67},{"text":"Well, we can call ourselves OpsWerks as well, but","startTime":503.69,"finishTime":505.79},{"text":"there's another way that we were playing with","startTime":505.97,"finishTime":508.079},{"text":"and end up being the workforce because of,","startTime":508.089,"finishTime":510.41},{"text":"you know, our twist of what work is","startTime":510.42,"finishTime":512.469},{"text":"and what, how we show up together.","startTime":512.719,"finishTime":515.33},{"text":"Um And the last but not least, and this sort of this journey of it is, you know,","startTime":515.719,"finishTime":519.5},{"text":"we've always","startTime":519.51,"finishTime":520.32},{"text":"never had a word of who are we as individuals, individual members of ops,","startTime":520.429,"finishTime":524.179},{"text":"what do you call yourselves?","startTime":524.299,"finishTime":525.52},{"text":" I thought it was really appropriate and I forgot","startTime":526.03,"finishTime":528.869},{"text":"who mentioned it and I was really thankful for it,","startTime":528.88,"finishTime":532.159},{"text":"which is like we're all works in progress, right? There's","startTime":532.45,"finishTime":535.19},{"text":"the work in progress of what everyone else is doing,","startTime":535.32,"finishTime":537.659},{"text":"but there's also the W E R K version of what we are trying to do for ourselves","startTime":537.669,"finishTime":541.559},{"text":"um living out the BVMMs. And","startTime":541.94,"finishTime":544.32},{"text":"I think just seeing ourselves as","startTime":544.599,"finishTime":546.33},{"text":"and reminding ourselves,","startTime":546.44,"finishTime":547.78},{"text":"which is really important that we are all a work","startTime":547.789,"finishTime":549.64},{"text":"in progress that we haven't hit our final form yet,","startTime":549.65,"finishTime":552.33},{"text":"that we have hope that we can become bigger, better, more","startTime":552.51,"finishTime":556.96},{"text":"differentiated than what we are today and that","startTime":557.109,"finishTime":559.599},{"text":"the future is hopeful because of that.","startTime":559.609,"finishTime":561.39},{"text":"And so with that being said, we are going to start working on trademarking","startTime":562.4,"finishTime":565.799},{"text":"OpsWerks, uh the werk and werks and our version of it,","startTime":566.02,"finishTime":570.65},{"startTime":570.929,"finishTime":571.53},{"text":"you know, with the, you know,","startTime":571.739,"finishTime":573.19},{"text":"all the different places. So we have lawyers kind of going after that right now.","startTime":573.599,"finishTime":576.549},{"text":"So our new public face, so which is really important because I don't, you know,","startTime":576.95,"finishTime":581.609},{"text":"our website,","startTime":581.619,"finishTime":582.59},{"text":"I'm embarrassed to say it was","startTime":583.239,"finishTime":584.7},{"text":"built in 2015, has been untouched since 2015.","startTime":584.89,"finishTime":588.419},{"text":"It was necessary, uh because we were required to have it,","startTime":588.789,"finishTime":592.39},{"text":"but we didn't really put any effort into it.","startTime":592.4,"finishTime":594.419},{"text":"And it was, you know, I, you know, looking back now, it's a,","startTime":594.909,"finishTime":597.75},{"text":"it was a missed opportunity because","startTime":597.76,"finishTime":600.159},{"text":"it is the public face of what others will see of us,","startTime":600.7,"finishTime":603.469},{"text":"whether it's our partners or people that we are trying to","startTime":603.479,"finishTime":606.76},{"text":"you know, hire and bring in.","startTime":606.95,"finishTime":608.429},{"text":"It doesn't represent us well at all.","startTime":608.669,"finishTime":611.539},{"text":"And so","startTime":611.739,"finishTime":612.489},{"text":"it was a missed opportunity and So what we're working on now,","startTime":612.64,"finishTime":615.309},{"text":"And it should be launching in the next couple of weeks is really,","startTime":615.32,"finishTime":618.799},{"text":"you know, there's really four core elements of just like how we work, you know, who,","startTime":619.01,"finishTime":622.419},{"text":"who works here,","startTime":622.429,"finishTime":623.539},{"text":"you know, seeing the work that we do and then helping lure people in to,","startTime":623.7,"finishTime":627.69},{"text":"if they understand what we're doing, how we're doing it,","startTime":627.809,"finishTime":631.08},{"text":"they would self select in versus","startTime":631.28,"finishTime":633.03},{"text":"self select out.","startTime":633.169,"finishTime":634.26},{"text":"So my hope is that it would actually help us in our","startTime":634.549,"finishTime":637.369},{"text":"recruiting efforts that we would find more people who are like us","startTime":637.38,"finishTime":640.32},{"text":"and they would be able to find us that way.","startTime":640.489,"finishTime":643.01},{"text":"And likewise, those that we would not have to interview in the future,","startTime":643.739,"finishTime":647.719},{"text":"they would self select out if they don't believe in anything that we're doing,","startTime":647.729,"finishTime":650.82},{"text":"we can save everyone some time and some effort around","startTime":650.969,"finishTime":653.669},{"text":"there if they weren't going to be a match.","startTime":653.679,"finishTime":655.359},{"text":"And so we,","startTime":655.78,"finishTime":657.309},{"text":"everything that we're doing right now in this","startTime":657.32,"finishTime":659.02},{"text":"current phase of our website is really around","startTime":659.03,"finishTime":662.01},{"text":"showcasing and highlighting what we're doing","startTime":662.159,"finishTime":664.65},{"text":"as a demonstration of what we believe inside on the outside so that people can,","startTime":664.9,"finishTime":669.849},{"text":"you know, self select in","startTime":669.859,"finishTime":670.909},{"text":"and it's geared towards, you know, recruiting and bringing people in.","startTime":671.15,"finishTime":674.57},{"text":"Uh It's not necessarily geared towards finding partners outside or, you know,","startTime":674.739,"finishTime":678.409},{"text":"to do um you know, new partnerships, new business with,","startTime":678.419,"finishTime":681.59},{"text":"um it's about finding new members of our team.","startTime":681.859,"finishTime":684.83},{"text":"So lining up with our BVMMs where it's about","startTime":684.84,"finishTime":687.549},{"text":"taking care of those people next to us first.","startTime":687.559,"finishTime":690.09},{"startTime":690.409,"finishTime":690.84},{"text":"And that's really the emphasis on this.","startTime":691.34,"finishTime":693.09},{"text":"It may change, we may add on there's room for it.","startTime":693.27,"finishTime":695.71},{"text":"But right now,","startTime":695.719,"finishTime":696.409},{"text":"the current state and phase of things is we want to be able to bring people in","startTime":696.419,"finishTime":699.599},{"text":"and showcase and highlight what we're doing.","startTime":699.71,"finishTime":701.33},{"text":"So","startTime":702.15,"finishTime":702.669},{"text":"some other goodies that we're working on.","startTime":702.799,"finishTime":704.299},{"text":"So there are some updated BVMM logos that I'll be sharing shortly.","startTime":704.309,"finishTime":707.71},{"text":" email templates, badges, pins different things that we're trying to align with,","startTime":707.739,"finishTime":711.719},{"text":"so that we have a consistency across everything that we're doing","startTime":711.729,"finishTime":714.179},{"text":"and a beautiful new presentation template which you're getting a view of,","startTime":714.369,"finishTime":717.349},{"text":"of just some of the goodies in here.","startTime":717.359,"finishTime":718.83},{"text":" So within our, you know, our new logo and our butterfly,","startTime":719.39,"finishTime":722.619},{"text":" we have a new um sort of icon uh for our being the anteambulo","startTime":722.739,"finishTime":726.71},{"text":"growing and going building healthy communities and making it meaningful","startTime":727.109,"finishTime":730.52},{"text":"and they're not necessarily sized, you know,","startTime":730.83,"finishTime":732.76},{"text":"which is more important than the other, but really,","startTime":732.77,"finishTime":734.7},{"text":"it's just around fitting in into logos.","startTime":734.71,"finishTime":737.14},{"text":"If you actually look at them, they're actually the same sort of size actually.","startTime":737.15,"finishTime":740.659},{"text":"So","startTime":740.859,"finishTime":741.369},{"text":"we will be making these assets available for you.","startTime":741.489,"finishTime":744.08},{"text":"So you can use them wherever you like.","startTime":744.09,"finishTime":746.08},{"text":" But really, that's really, we want to be able to express, you know,","startTime":746.15,"finishTime":748.94},{"text":"how we're feeling and how we're thinking and","startTime":748.95,"finishTime":750.88},{"text":"align it with everything that we're doing.","startTime":750.89,"finishTime":752.419},{"text":"This is the email template that we will be uh helping","startTime":753.159,"finishTime":756.78},{"text":"everyone build and generate and they'll be out there for everyone.","startTime":756.789,"finishTime":760.19},{"text":"My role is head of insanity.","startTime":760.2,"finishTime":762.21},{"text":"If we haven't figured that out,","startTime":762.38,"finishTime":764},{"text":"I'm driving people crazy occasionally. So,","startTime":764.539,"finishTime":766.549},{"startTime":766.89,"finishTime":767.179},{"text":"and then this is,","startTime":767.599,"finishTime":768.39},{"text":"I'm gonna walk through really quickly about the presentation template.","startTime":768.4,"finishTime":770.65},{"text":"There are so many options that everyone came up with.","startTime":770.659,"finishTime":773.239},{"text":" And really, I think fits our, our model. So,","startTime":773.27,"finishTime":776.099},{"text":"you know, there's overviews and there's template dividers. But","startTime":776.679,"finishTime":779.2},{"text":"I think as I like slide through these really quickly,","startTime":779.309,"finishTime":782.049},{"text":"you'll get a sense and a feel that there are many different ways you can express,","startTime":782.33,"finishTime":786.479},{"text":"you know,","startTime":786.69,"finishTime":786.909},{"text":"the information that we have or the sharing","startTime":786.919,"finishTime":788.96},{"text":"that you'll be going through or the learnings that","startTime":788.969,"finishTime":790.729},{"text":"we have um in so many different ways that it will hopefully fit all your styles.","startTime":790.739,"finishTime":795.52},{"text":"And then within these, this way that we can have this consistent","startTime":795.53,"finishTime":798.989},{"text":"sort of way of speaking and communicating with each other.","startTime":799.09,"finishTime":802.2},{"text":"And so if you're more numbers focused or","startTime":802.409,"finishTime":804.63},{"text":"graph focused or text focused or picture focused,","startTime":804.64,"finishTime":807.9},{"text":"I think there's something in here for everyone","startTime":808.159,"finishTime":810.679},{"text":" so that you'll be able to express it and","startTime":810.95,"finishTime":812.289},{"text":"then we'll have a consistent consistency in how we're doing things","startTime":812.299,"finishTime":815.479},{"text":"which will lead to a way that we can become","startTime":815.729,"finishTime":818.239},{"text":"more sort of scalable and when things become more repeatable,","startTime":818.25,"finishTime":821.83},{"text":"so","startTime":821.84,"finishTime":822.21},{"text":"I will probably tend more towards these imagery slides.","startTime":822.32,"finishTime":825.33},{"text":"But that's, you know,","startTime":825.57,"finishTime":827.02},{"text":"everything that we have here is kind of going that direction.","startTime":827.03,"finishTime":829.88},{"text":"I think, 01 more piece that we have is a how to use guide.","startTime":831.13,"finishTime":834.559},{"text":"So, like, how do we use all these different elements in here?","startTime":834.57,"finishTime":836.84},{"text":"And you know, how do we refer to ourselves? Um We'll be posting up on our wiki,","startTime":836.849,"finishTime":841.88},{"text":"just sort of a sort of a branding usage guide.","startTime":842,"finishTime":844.84},{"text":" And so like, what is the language we use,","startTime":845.63,"finishTime":848.159},{"text":"you know,","startTime":848.46,"finishTime":849.2},{"text":"and just kind of identifying the different things that we kind of mentioned here.","startTime":849.21,"finishTime":852.239},{"text":"But also in this other column that we have here,","startTime":852.38,"finishTime":854.179},{"text":"there's a lot of different ways that we can start playing with the word works, right?","startTime":854.19,"finishTime":856.909},{"text":"It's around like,","startTime":856.919,"finishTime":857.57},{"text":"you know, what's a workshop, uh what's extra work, clock work, team work, right?","startTime":857.719,"finishTime":862.2},{"text":"And you know,","startTime":862.21,"finishTime":862.9},{"startTime":863.219,"finishTime":863.729},{"text":"I, I invite you guys and gals to all play with this and","startTime":864.03,"finishTime":867.64},{"text":"and then over time things will stick and then we'll bring them in,","startTime":868.08,"finishTime":871.45},{"text":"into our vernacular into our sort of dictionary of things and then allow, you know,","startTime":871.46,"finishTime":875.15},{"text":"help people as they come and join us to understand where do we use certain things.","startTime":875.159,"finishTime":879.599},{"text":"So that helps guide them into the right direction.","startTime":879.659,"finishTime":882.09},{"text":"So last, thank you again for holding on for looks like 15 minutes here.","startTime":883.32,"finishTime":887.76},{"text":" Last but not least I have a really big ask of everyone here.","startTime":888.14,"finishTime":892.45},{"text":"Really, it's around.","startTime":892.69,"finishTime":894.21},{"text":"We need stories, right?","startTime":894.859,"finishTime":897.09},{"text":"And so we are investing in this place, just not only have we invested in sort of the","startTime":897.099,"finishTime":900.859},{"text":"outside branding stuff, we will be hiring, you know,","startTime":901.07,"finishTime":904.039},{"text":"a person and hopefully maybe like a team","startTime":904.049,"finishTime":906.059},{"text":"to help us uh share our content, our information that's out there. So","startTime":906.159,"finishTime":910.609},{"text":"what I really need help on is,","startTime":911.409,"finishTime":913.03},{"text":"you know, for us to see the stories that we want to share, right,","startTime":913.45,"finishTime":916.84},{"text":"things that exhibit like growth or even how we overcome","startTime":916.849,"finishTime":919.83},{"text":"challenges or maybe the challenges that we're living in right now","startTime":919.84,"finishTime":922.58},{"text":"because it's about being real and it's about real life, right?","startTime":922.78,"finishTime":925.859},{"text":"It's not everything is always pretty,","startTime":925.869,"finishTime":927.64},{"text":"but they end up that way and showing that progress","startTime":927.799,"finishTime":930.4},{"text":"of how we get there is actually really important.","startTime":930.409,"finishTime":932.099},{"text":"So it demystifies, it actually speaks truthfully about how things are done.","startTime":932.109,"finishTime":935.929},{"text":"So if you see stories that are out there,","startTime":936.239,"finishTime":938.159},{"text":"highlight them, point them out,","startTime":938.429,"finishTime":940.4},{"text":"let us know so we can showcase and honor of those people and those member,","startTime":940.409,"finishTime":944.119},{"text":"our team members out there and then so that","startTime":944.13,"finishTime":945.77},{"text":"we can actually share the stories out publicly.","startTime":945.78,"finishTime":947.78},{"startTime":948.299,"finishTime":948.7},{"text":"And","startTime":948.9,"finishTime":949.38},{"text":"you know,","startTime":949.7,"finishTime":949.909},{"text":"my hope is that we'll be able to get these stories in place so that","startTime":949.919,"finishTime":952.349},{"text":"we can then kind of continually tell like maybe like a year book or like,","startTime":952.359,"finishTime":956.19},{"text":"you know, maybe like, I guess like a social media news feed","startTime":956.2,"finishTime":958.82},{"text":"that we are constantly putting things out there that are real, that are relevant,","startTime":959.03,"finishTime":962.669},{"text":"that can reach people where they're at.","startTime":962.679,"finishTime":964.38},{"text":"And then, but through that we're just highlighting,","startTime":964.809,"finishTime":967.359},{"text":"showcasing our members here.","startTime":967.369,"finishTime":969.039},{"text":"And so I think everything is actually aligned really well,","startTime":969.049,"finishTime":971.46},{"text":"I'm gonna need your help here.","startTime":972.07,"finishTime":973.38},{"text":"And so if you have them point them out, if you don't know how to create the story,","startTime":973.78,"finishTime":977.13},{"text":"that's OK.","startTime":977.14,"finishTime":977.88},{"text":"I think just point it out and then we will find a way to craft the story,","startTime":977.989,"finishTime":980.869},{"text":"but sometimes we need to see the good and we don't get to see","startTime":980.88,"finishTime":983.419},{"text":"everything because we're so big and we're all spread out on different teams now.","startTime":983.429,"finishTime":987.349},{"text":"It's more important now than ever to be able to see","startTime":987.57,"finishTime":990.859},{"text":"those and share them with each other so that we can,","startTime":990.869,"finishTime":993.09},{"text":"you know,","startTime":993.169,"finishTime":993.4},{"text":"celebrate each other and then celebrate others that","startTime":993.409,"finishTime":995.58},{"text":"will be joining us in the future.","startTime":995.59,"finishTime":996.65},{"text":"So that being said, that's the updated presentation. One take, hot take.","startTime":997.2,"finishTime":1001.09},{"text":"Thanks again for listening to the whole thing.","startTime":1001.099,"finishTime":1003.53},{"text":"And I'm looking forward to seeing how everyone uses everything and help us to","startTime":1003.539,"finishTime":1007.7},{"startTime":1007.96,"finishTime":1008.469},{"text":"you know, lock in our next chapter in the next phase of","startTime":1009.02,"finishTime":1011.729},{"text":"work. Thanks everyone. Take care. Bye
