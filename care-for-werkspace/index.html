ing from wearing articles of","startTime":34.47,"finishTime":36.849},{"text":"clothing or using accessories which promote other companies in the same industry.","startTime":36.86,"finishTime":41.45},{"text":"Clothing that works well for the beach yard, work, dance clubs,","startTime":42.27,"finishTime":45.939},{"text":"exercise sessions and sports contests may not be","startTime":45.95,"finishTime":49.25},{"text":"appropriate for a professional casual appearance at work","startTime":49.259,"finishTime":52.659},{"text":"clothing that reveals too much cleavage back, your chest,","startTime":53.45,"finishTime":57.069},{"text":"your stomach or your underwear is not appropriate for a place of business.","startTime":57.08,"finishTime":60.959},{"text":"General guidelines,","startTime":61.95,"finishTime":63.419},{"text":"all opsworks members are expected to wear the appropriate","startTime":64.208,"finishTime":67.359},{"text":"attire and observe general good grooming at all times.","startTime":67.369,"finishTime":70.478},{"text":"If for safety or other reasons,","startTime":71.33,"finishTime":73.36},{"text":"a member cannot wear the designated dress code while traveling to work.","startTime":73.37,"finishTime":77.099},{"text":"The member should have a change of clothes that is adhered to the dress code policy,","startTime":77.11,"finishTime":81.139},{"text":"members will be requested to wear a jacket or blazer over revealing outfits.","startTime":81.98,"finishTime":86.51},{"text":"Members attending virtual zoom meetings from home are still","startTime":87.36,"finishTime":90.589},{"text":"required to be in an appropriate smart casual attire.","startTime":90.599,"finishTime":94.05},{"text":"On Thursdays, all members are encouraged to wear any","startTime":94.8,"finishTime":97.93},{"text":"OpsWerks shirt to showcase our branding.","startTime":98.16,"finishTime":100.169},{"text":"Acceptable attire for women are the following.","startTime":101.11,"finishTime":104.08},{"text":"Here are the women's clothing that are inappropriate for work","startTime":111.089,"finishTime":114.54},{"text":"and here's acceptable attire for men.","startTime":121.15,"finishTime":123.669},{"text":"Inappropriate attire for men are as follows","startTime":131.139,"finishTime":134.19},{"text":"for questions and clarifications.","startTime":141.13,"finishTime":143.32},{"text":"You may reach out to your respective people business partners.","startTime":143.33,"finishTime":146.649}],"overlays":[{"identifier":"2R2NhZMYaTBKvuZdC","kind":"overlay","type":"button","width":56,"height":55,"x":339,"y":151,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"font":{"size":20,"bold":false,"underline":false,"italic":false},"fontColor":"koantic(light1, 0, 1)","textAlignment":"center","type":"button","border":{"size":0,"color":"#000000","left":true,"right":true,"top":true,"bottom":true},"fill":{"type":"color","color":"koantic(accent1, 0, 0)"},"padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Button","hover":{"fillColor":"rgba(174,221,66,1)"},"roundedCorners":{"bottomLeft":100,"bottomRight":100,"topLeft":100,"topRight":100},"isCircle":false},"isRatioFixed":false,"imageAsset":"Hz3RGgodj7hocCLwq","start":13.2,"behaviorType":"continue","rotationAngle":0,"clickAction":{"tooltip":{"width":259,"height":202,"type":"text","position":"bottom","customStyle":{"logicalName":"tooltipRectangle","type":"rectangle","border":{"size":1,"color":"koantic(light1, 3, 1)","left":true,"right":true,"top":true,"bottom":true},"font":{"bold":false,"underline":false,"italic":false,"size":18,"family":"fidwQgqwPsyLenCcXsNb"},"fontColor":"#000000","padding":{"top":10,"bottom":10,"left":10,"right":10},"shadow":{"angle":270,"distance":3,"size":0,"blur":12,"color":"rgba(0,0,0, 0.53)"},"lineHeight":1.2,"textAlignment":"left","fill":{"type":"color","color":"koantic(light1, 1, 1)"},"roundedCorners":{"topLeft":5,"topRight":5,"bot
