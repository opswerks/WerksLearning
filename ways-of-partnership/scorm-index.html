 leads.","startTime":48.83,"finishTime":52.24},{"text":"It is designed to give members an understanding of how","startTime":53.18,"finishTime":56.229},{"text":"their work aligns with the company's goals and objectives,","startTime":56.229,"finishTime":59.619},{"text":"and to provide feedback on areas in which they excel or could improve.","startTime":59.909,"finishTime":64.449},{"text":"In Opsworks,","startTime":65.269,"finishTime":66.339},{"text":"the performance review process involves setting goals,","startTime":66.47,"finishTime":69.97},{"text":"tracking progress,","startTime":70.15,"finishTime":71.349},{"text":"gathering feedback from multiple sources,","startTime":71.61,"finishTime":74.349},{"text":"and providing constructive feedback to the employee.","startTime":74.589,"finishTime":77.75},{"text":"Performance reviews take place semiannually and may be","startTime":78.709,"finishTime":82.269},{"text":"tied to compensation decisions such as bonuses.","startTime":82.269,"finishTime":85.629},{"text":"A successful performance review helps members","startTime":86.55,"finishTime":89.959},{"text":"understand their strengths and areas for development","startTime":89.959,"finishTime":92.66},{"text":"and encourages open communication between the member and their supervisor.","startTime":92.879,"finishTime":97.54}]}},"e2Dq8gNHRJ6AJsoJe":{"_id":"e2Dq8gNHRJ6AJsoJe","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"audio","mimetype":"audio/mp4","status":"online","fileSizeInBytes":230842,"uploadedFileName":"Converge.MP3","duration":14.000998,"uploadedFileNameExtension":".m4a"},"dates":{"dateCreated":"2024-01-31T05:10:00.383Z","dateModified":"2024-01-31T05:10:00.383Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","captionData":{"status":"success","captions":[{"text":"Come 2nd quarter,","startTime":0.389, Time":44.659},{"text":"As mentioned above,","startTime":45.459,"finishTime":46.45},{"text":"Opsworks value confidentiality and integrity,","startTime":46.58,"finishTime":49.189},{"text":"so it's essential to mention that we take moonlighting seriously if left","startTime":49.459,"finishTime":52.619},{"text":"undisclosed or if you have breached the terms of the NDA.","startTime":52.619,"finishTime":55.349},{"text":"In having other work,","startTime":56.189,"finishTime":57.38},{"text":"make sure that it is not conflicting with your primary job","startTime":57.59,"finishTime":60.389},{"text":"and doesn't have an effect to your professionalism and values.","startTime":60.389,"finishTime":63.61}]}},"squtoXgW2EmbDL8rN":{"_id":"squtoXgW2EmbDL8rN","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/jpeg","status":"online","fileSizeInBytes":11986269,"uploadedFileName":"ISS_3387.JPG","height":1120,"uploadedFileNameExtension":".JPG","width":1680},"dates":{"dateCreated":"2024-01-31T05:42:38.342Z","dateModified":"2024-01-31T05:42:38.342Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"BsjiLMbb6MNQr3XJT"},"wcAbdzQiqXWWFaMKL":{"_id":"wcAbdzQiqXWWFaMKL","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":1674194,"uploadedFileName":"Confidential Agreement","height":1080,"uploadedFileNameExtension":".png","width":914},"dates":{"dateCreated":"2024-01-30T00:44:50.132Z","dateModified":"2024-01-30T00:45:04.561Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"Q6GaDcueX8eJKpB5m"},"yBgmZkE2dWvL8GACK":{"_id":"yBgmZkE2dWvL8GACK","_siteID":"a7
