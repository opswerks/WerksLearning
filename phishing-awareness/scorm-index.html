hTime":15.02},{"text":"As phishing schemes become increasingly sophisticated and harder to detect,","startTime":15.63,"finishTime":19.829},{"text":"it's crucial to stay informed and vigilant.","startTime":19.989,"finishTime":22.27},{"text":"Fishing scams are constantly evolving with attackers using more","startTime":23.649,"finishTime":27.77},{"text":"advanced tricks to catch unsuspecting victims off guard.","startTime":27.77,"finishTime":30.959},{"text":"However,","startTime":31.53,"finishTime":32.119},{"text":"by recognizing the signs of a potential fishing attempt in staying alert,","startTime":32.369,"finishTime":36.279},{"text":"you can significantly reduce your chances of being targeted.","startTime":36.459,"finishTime":39.49},{"text":"Let's explore some common fishing scenarios you may encounter.","startTime":40.61,"finishTime":44.049}]}},"MpSCukLuQGoZPyXu6":{"_id":"MpSCukLuQGoZPyXu6","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":12678756,"uploadedFileName":"Phishing Awareness Recap.mp4","duration":68.651,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-10-11T08:42:35.162Z","dateModified":"2024-10-11T08:42:35.162Z"},"users":{"_userCreatorID":"5bwyDm87W3Nfiax8C","_userModifierID":"5bwyDm87W3Nfiax8C"}},"isBuiltin":false,"isSampleData":false,"jobId":"jNnJs7ea7ym3biNuM","isVisible":true,"categoryId":"R28rMr9jHgBbncsiE","workspaceId":"mLBhT8TFLjgYBrgjo","thumbnail":"4AgXQzSiq77vET8br","videoSD":"uci2oG9Jd6aScXsd2","captionData":{"status":"success","captions":[{"text":"Phishing scams are deceptive attempts by cyber criminals to","startTime":0.009,"finishTime":3.359},{"text":"trick you into providing sensitive information such as passwords,","startTime":3.359,"finishTime":6.84},{"text":"financial details,","startTime":7.119,"finishTime":8.119},{"text":"or personal data.","startTime":8.199,"finishTime":9.35},{"text":"These scams often come in the form of fake emails,","startTime":10,"finishTime":13.159},{"text":"messages or websites that appear legitimate.","startTime":13.239,"finishTime":15.88},{"text":"To protect yourself,","startTime":16.639,"finishTime":17.67},{"text":"it's crucial to stay vigilant and follow simple precautions.","startTime":17.879,"finishTime":21.229},{"text":"Always verify the authenticity of any request for sensitive information,","startTime":21.879,"finishTime":25.95},{"text":"whether it comes through email,","startTime":26.2,"finishTime":27.59},{"text":"text,","startTime":27.799,"finishTime":28.19},{"text":"or phone.","startTime":28.319,"finishTime":28.92},{"text":"Avoid clicking on suspicious links or","startTime":30.219,"finishTime":32.61},{"text":"downloading attachments from unknown sources.","startTime":32.61,"finishTime":35.13},{"text":"Don't scan the QR code if you don't recognize the sender or the message.","startTime":35.529,"finishTime":39.439},{"text":"Be cautious of urgent messages that pressure you to act quickly.","startTime":42,"finishTime":45.47},{"text":"Cyber criminals use this tactic to catch you off guard.","startTime":45.799,"finishTime":49.069},{"text":"By staying alert,","startTime":49.56,"finishTime":50.59},{"text":"questioning unexpected requests,","startTime":50.88,"finishTime":52.79},{"text":"and thinking twice before sharing any personal information.","startTime":52.919,"finishTime":56.069},{"text":"You can significantly reduce the risk of falling victim to phishing scams.","startTime":56.319,"finishTime":60.529},{"text":"For any IT security concerns or any IT related issues,","startTime":60.88,"finishTime":64.449},{"text":"please don't hesitate to reach out to any member of ITSG.","startTime":64.69,"finishTime":67.959}]}},"TF8hwquhwETjodeuq":{"_id":"TF8hwquhwETjodeuq","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":2227865,"uploadedFileName":"Fraud Department Scams.mp4","duration":18.142,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-09-19T07:59:59.098Z","dateModified":"2024-09-19T07:59:59.098Z"},"users":{"_userCreatorID":"5bwyDm87W3Nfiax8C","_userModifierID":"5bwyDm87W3Nfiax8C"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"R28rMr9jHgBbncsiE","workspaceId":"mLBhT8TFLjgYBrgjo","thumbnail":"cvTSBkER46thQAYKD","videoSD":"nB2SN6pzmD9a5WjhS","captionData":{"status":"success","captions":[{"text":"Fraud department scams.","startTime":0.119,"finishTime":1.8090000000000002},{"text":"An email claims to be from the fraud department of a","startTime":2.039,"finishTime":4.559},{"text":"well-known company and warns that your identity may have been stolen.","startTime":4.559,"finishTime":7.989},{"text":"To verify your details,","startTime":8.6,"finishTime":10.18},{"text":"you're asked to provide personal information.","startTime":10.3,"finishTime":12.729},{"text":"This is a classic ploy designed to make you panic and respond without thinking.","startTime":13.06,"finishTime":17.26}]}},"i6rgRrmGvF87BdQkG":{"_id":"i6rgRrmGvF87BdQkG","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":36569326,"uploadedFileName":"Phishing Awareness (1).mp4","duration":96.505,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-10-11T08:08:08.732Z","dateModified":"2024-10-11T08:08:08.732Z"},"users":{"_userCreatorID":"5bwyDm87W3Nfiax8C","_userModifierID":"5bwyDm87W3Nfiax8C"}},"isBuiltin":false,"isSampleData":false,"jobId":"ZpcsTzoRdBmP8bWcm","isVisible":true,"categoryId":"R28rMr9jHgBbncsiE","workspaceId":"mLBhT8TFLjgYBrgjo","thumbnail":"vjszkyBFxve55NLr8","videoSD":"b58zFzSRtRMk3B4Ny","captionData":{"status":"success","captions":[{"text":"Here are practical tips to stay safe.","startTime":3.7,"finishTime":5.889},{"text":"Never send sensitive information via email.","startTime":6.98,"finishTime":9.81},{"text":"Legitimate organizations will never ask you to","startTime":10.1, ybackCompletionAction":{"type":"nextPage"},"needToCompleteSlideForPageCompletion":true,"disableForwardSeeking":true,"isTranscribingCaptions":false,"captions":[{"text":"Clone Phishing,","startTime":0.009,"finishTime":1.059},{"text":"An attacker sends an email that appears to be from a legitimate source,","startTime":1.129,"finishTime":5.03},{"text":"but contains a link to a fake website designed to look exactly like the real one.","startTime":5.21,"finishTime":9.59},{"text":"Once you enter your log in credentials on this clone site, the attacker steals them.","startTime":10.14,"finishTime":15.149}]},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"5bwyDm87W3Nfiax8C","_userCreatorID":"5bwyDm87W3Nfiax8C"},"dates":{"dateModified":"2024-09-20T10:10:39.642Z","dateCreated":"2024-09-20T08:49:47.343Z"}},"workspaceId":"mLBhT8TFLjgYBrgjo","assets":["553pW8sSjrP9uCctx"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"utq8jPZNYeyr3fXFn":{"_id":"utq8jPZNYeyr3fXFn","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Email Management","template":"resourceVideo","locale":"en","upload":"i6rgRrmGvF87BdQkG"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 1, 0.08)"},"playbackCompletionAction":{"type":"nextPage"},"needToCompleteSlideForPageCompletion":true,"disableForwardSeeking":true,"isTranscribingCaptions":false,"captions":[{"text":"Here are practical tips to stay safe.","startTime":3.5789999999999997,"finishTime":5.849},{"text":"Never send sensitive information via email.","startTime":6.88,"finishTime":9.77},{"text":"Legitimate organizations will never ask you to","startTime":9.779,"finishTime":12.568999999999999},{"text":"share personal or financial information via email.","startTime":12.579,"finishTime":15.529},{"text":"Always be skeptical of unsolicited requests","startTime":16.129,"finishTime":19.09},{"text":"type web addresses manually.","startTime":19.819,"finishTime":21.93},{"text":"If you receive an email with a link to your bank or financial institution,","startTime":22.17,"finishTime":26},{"text":"don't click it","startTime":26.01,"finishTime":26.909},{"text":"instead manually,","startTime":27.459,"finishTime":28.959},{"text":"type the web address into your browser to ensure you're visiting the correct site.","startTime":28.969,"finishTime":32.88},{"text":"Verify suspicious emails.","startTime":35.11,"finishTime":37.049},{"text":"If something feels off about an email,","startTime":38.479,"finishTime":40.61},{"text":"verify it by contacting the organization directly.","startTime":40.619,"finishTime":43.86},{"text":"Use official contact information from their website,","startTime":44.459,"finishTime":47.54},{"text":"not the details provided in the suspicious message.","startTime":47.549,"finishTime":50.38},{"text":"Be cautious with social media,","startTime":53.549,"finishTime":55.47},{"text":"cyber criminals often use personal information shared","startTime":56.18,"finishTime":59.38},{"text":"on social media to craft convincing phishing emails","startTime":59.389,"finishTime":62.47},{"text":"limit the amount of personal information you share","startTime":62.979,"finishTime":65.61},{"text":"online and review your privacy settings regularly.","startTime":65.62,"finishTime":68.58},{"text":"Avoid scanning unknown QR codes","startTime":69.75,"finishTime":72.23},{"text":"only scan QR codes from trusted sources such as official","startTime":72.339,"finishTime":76.36},{"text":"websites or apps and avoid scanning random codes from emails,","startTime":76.37,"finishTime":80.389},{"text":"social media or public places.","startTime":80.4,"finishTime":82.48},{"text":"If you receive a phishing email in outlook,","startTime":83.93,"finishTime":86.47},{"text":"simply select report and then choose report phishing.","startTime":86.48,"finishTime":89.47},{"text":"This will send the message to Microsoft helping","startTime":90.11,"finishTime":92.989},{"text":"t
