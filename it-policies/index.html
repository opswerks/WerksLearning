a(0,146,103,1)","accent3":"rgba(185,213,58,1)","accent4":"rgba(73,78,86,1)","accent5":"rgba(94,199,205,1)","accent6":"rgba(8,129,146,1)"},"accentColor":"rgba(0,146,103,1)","headerLogo":"ZhuPjs9Nc9kSex4Ls"},"assetsById":{"AD3YSSFtv28QbHkya":{"_id":"AD3YSSFtv28QbHkya","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":24870402,"uploadedFileName":"ITSG Wireless Access Policy.mp4","duration":239.485,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-06-05T03:23:10.445Z","dateModified":"2026-06-05T03:23:10.445Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"tCgSuSxrPNGosGo3H","thumbnail":"zR2h8ie8YfHNTnXpX","videoSD":"8vxSkyzDs8sTCmQTC","captionData":{"status":"success","captions":[{"text":"The company's Wi Fi policy establishes guidelines","startTime":4.3,"finishTime":7.3},{"text":"for the secure use of wireless networks","startTime":7.3,"finishTime":9.52},{"text":"both within the lab","startTime":9.739,"finishTime":10.909},{"text":"and in external locations.","startTime":11.1,"finishTime":13.119},{"text":"All members are expected to connect only to trusted password-protected networks,","startTime":13.579,"finishTime":18.34},{"text":"safeguard login credentials,","startTime":18.739,"finishTime":20.399},{"text":"and follow security best practices","startTime":20.62,"finishTime":22.76},{"text":"to prevent unauthorized access or data exposure.","startTime":22.94,"finishTime":26.159},{"text":"OpsWorks Wi Fi network.","startTime":26.819,"finishTime":28.469},{"text":"Our company's Wi Fi network and connection","startTime":29.09,"finishTime":31.35},{"text":"are secured with a password and encryption.","startTime":31.579,"finishTime":33.74},{"text":"In accordance with current industry practice,","startTime":34.029,"finishTime":36.509},{"text":"passwords will be of appropriate complexity","startTime":36.869,"finishTime":39.25},{"text":"and may be changed at appropriate intervals,","startTime":39.389,"finishTime":41.729},{"text":"balancing security practice","startTime":41.869,"finishTime":43.61},{"text":"with the intended convenient business use of the Wi Fi.","startTime":43.83,"finishTime":46.33},{"text":"Wi Fi passwords shall be kept confidential","startTime":47.169,"finishTime":49.75},{"text":"and shall not be shared outside of the company.","startTime":49.93,"finishTime":52.15},{"text":"Our Wi Fi network is segmented into different SSIDs","startTime":52.919,"finishTime":56.509},{"text":"based on user roles within the company.","startTime":56.729,"finishTime":58.75},{"text":"ITSG has configured your laptop to connect to the appropriate SSID","startTime":59.61,"finishTime":64.36},{"text":"and designated ISP.","startTime":64.54,"finishTime":66.199},{"text":"If any local changes are made by a user,","startTime":66.919,"finishTime":69.44},{"text":"ITSG reserves the right to revert the connection to the correct network.","startTime":69.68,"finishTime":73.93},{"text":"The guest network is available with limited","startTime":74.279,"finishTime":76.36},{"text":"bandwidth and is accessible to everyone.","startTime":76.36,"finishTime":78.8},{"text":"It must not be used for activities such as online gaming,","startTime":79.379,"finishTime":82.69},{"text":"video streaming,","startTime":82.98,"finishTime":83.819},{"text":"or excessive social media usage.","startTime":84.019,"finishTime":85.98},{"text":"ITSG team reserves the right to restrict or block","startTime":86.669,"finishTime":90.349},{"text":"devices from the guest network in cases of misuse.","startTime":90.349,"finishTime":93.41},{"text":"Here are the things to do when using public Wi Fi.","startTime":93.709,"finishTime":96.169},{"text":"As with any internet connected device,","startTime":97.08,"finishTime":99.309},{"text":"defend your laptop,","startTime":99.65,"finishTime":100.73},{"text":"tablet,","startTime":100.889,"finishTime":101.33},{"text":"and your phone against internet threats.","startTime":101.449,"finishTime":103.51},{"text":"Make sure you never perform a download on a public internet connection","startTime":104.319,"finishTime":107.879},{"text":"and use strong passwords.","startTime":108.08,"finishTime":109.91},{"text":"Look around before selecting a place to sit.","startTime":110.36,"finishTime":112.699},{"text":"Consider a seat with your back to a wall","startTime":112.959,"finishTime":114.98},{"text":"and position your device so that someone nearby cannot easily see the screen.","startTime":115.16,"finishTime":119.779},{"text":"Assume all Wi Fi links are suspicious,","startTime":120.199,"finishTime":122.639},{"text":"so choose a connection carefully.","startTime":122.919,"finishTime":124.62},{"text":"A rogue wireless link may have been set up by a hacker.","startTime":125.25,"finishTime":128.669},{"text":"Actively choose the one that is known to be the network you expect","startTime":129.169,"finishTime":132.509},{"text":"and have reason to trust.","startTime":132.649,"finishTime":134.19},{"text":"Try to confirm that a given Wi Fi link is legitimate.","startTime":134.679,"finishTime":137.83},{"text":"Check the security level of the network by choosing the most secure connection,","startTime":138.25,"finishTime":142.369},{"text":"even if you have to pay for access.","startTime":142.649,"finishTime":144.57},{"text":"A password protected connection,","startTime":145.279,"finishTime":147.229},{"text":"one that is unique for your use,","startTime":147.55,"finishTime":149.059},{"text":"is better than one with a widely shared password","startTime":149.559,"finishTime":152.369},{"text":"and infinitely better than one without a password.","startTime":152.52,"finishTime":155.52},{"text":"Consider that one of two similar appearing SSIDs or connection names may be rogue","startTime":156.039,"finishTime":161.419},{"text":"and could have been set up by a hacker.","startTime":161.6,"finishTime":163.619},{"text":"Inquire of the manager of the establishment for","startTime":164.08,"finishTime":166.96},{"text":"information about their official Wi Fi access point.","startTime":166.96,"finishTime":169.52},{"text":"Avoid free Wi Fi with no encryption.","startTime":169.929,"finishTime":172.279},{"text":"Even if your website or other activity is using HTTPS","startTime":173.009,"finishTime":177.089},{"text":"with a lock symbol in your browser","startTime":177.41,"finishTime":179.08},{"text":"or other secure protocols,","startTime":179.289,"finishTime":180.88},{"text":"you are at much greater risk of snooping,","startTime":181.21,"finishTime":183.49},{"text":"eavesdropping,","startTime":183.649,"finishTime":184.449},{"text":"and hacking when on an open Wi Fi connection,","startTime":184.49,"finishTime":187.399},{"text":"such as at Starbucks,","startTime":187.77,"finishTime":188.919},{"text":"McDonald's,","startTime":189.009,"finishTime":189.679},{"text":"some hotels,","startTime":189.889,"finishTime":190.49},{"text":"etc.","startTime":190.57,"finishTime":191.3},{"text":"Seek out Wi Fi connections that use current industry accepted encryption methods","startTime":192.009,"finishTime":196.49},{"text":"and that generally will require the obtaining","startTime":196.77,"finishTime":198.69},{"text":"of a passphrase from the establishment.","startTime":198.69,"finishTime":200.61},{"text":"Better use your cell phone data plan for sensitive activities","startTime":201.41,"finishTime":204.589},{"text":"rather than untrusted Wi Fi","startTime":204.85,"finishTime":206.449},{"text":"or your own mobile hotspot if you have one or have been provided with one.","startTime":206.809,"finishTime":210.75},{"text":"Avoid visiting sites that can make it easier or","startTime":211.21,"finishTime":213.889},{"text":"more tempting for hackers to steal your data,","startTime":213.889,"finishTime":216.32},{"text":"for example,","startTime":216.649,"finishTime":217.36},{"text":"banking,","startTime":217.61,"finishTime":218.16},{"text":"social media,","startTime":218.33,"finishTime":219.19},{"text":"and any site where your credit card information is stored.","startTime":219.449,"finishTime":222.229},{"text":"Turn off your wireless network on your laptop","startTime":223.11,"finishTime":225.539},{"text":"when you are not using it to prevent automatic connection,","startTime":225.71,"finishTime":228.619},{"text":"to open and possibly dangerous access points.","startTime":228.91,"finishTime":231.75},{"text":"Set your device to not connect automatically","startTime":232.559,"finishTime":235.139},{"text":"to public or unknown and untrusted networks.","startTime":235.139,"finishTime":238}]}},"AWiQnaMHpsEFC9e35":{"_id":"AWiQnaMHpsEFC9e35","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":3124148,"uploadedFileName":"ITSG Summary.mp4","duration":22.841995,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-06-08T01:19:52.374Z","dateModified":"2026-06-08T01:19:52.374Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"syDxfqeFXT2bxSLfu","thumbnail":"NGKqa5i7tjrNn7nYM","videoSD":"f63Y3Cpxg5LzvhGks","captionData":{"status":"success","captions":[{"text":"Thanks for going through this course.","startTime":1.07,"finishTime":2.8689999999999998},{"text":"In summary,","startTime":3.16,"finishTime":3.859},{"text":"we have discussed key policies covering laptops,","startTime":4,"finishTime":6.82},{"text":"email,","startTime":7.239,"finishTime":7.46},{"text":"Wi Fi,","startTime":7.849,"finishTime":8.439},{"text":"networks,","startTime":8.92,"finishTime":9.359},{"text":"passwords,","startTime":9.64,"finishTime":10.38},{"text":"and internet usage.","startTime":10.52,"finishTime":11.64},{"text":"Check out our internet for other policies not covered in this course.","startTime":12.489,"finishTime":16.229},{"text":"For any questions or clarifications,","startTime":16.809,"finishTime":18.969},{"text":"please contact the ITSG.","startTime":19.29,"finishTime":21}]}},"JczaMTdhYJ2joPQAa":{"_id":"JczaMTdhYJ2joPQAa","data":{"attributes":{"status":"online","type":"video","mimetype":"video/quicktime","fileSizeInBytes":314219,"uploadedFileName":"Outro.mov","duration":9.7,"uploadedFileNameExtension":".mov"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"kNAApMq87PNSnqYMb"},"dates":{"dateCreated":"2023-11-24T05:42:00.050Z","dateModified":"2023-11-24T05:42:00.978Z"}},"isVisible":true,"categoryId":"k3X7SYDNCvyntYNpv","workspaceId":"AdPorMyw28Jp7Q9cy","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"BehZXNdQaYJ7cwG7A","videoSD":"9MLAzB7CYFdodzGPy","captionData":{"status":"success","captions":[]}},"PqLytMmKJh9PsBbF5":{"_id":"PqLytMmKJh9PsBbF5","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":12758505,"uploadedFileName":"ITSG Overview.mp4","duration":104.12,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-06-10T10:04:19.515Z","dateModified":"2026-06-10T10:04:19.515Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"RZnwsqanz4bEcpYPj","thumbnail":"XgXSHMR866wk6Zy3W","videoSD":"oeF8o3cWas7E6e2uS","captionData":{"status":"success","captions":[{"text":"Hi Ops works.","startTime":3.839,"finishTime":4.53},{"text":"Thank you for taking the time to watch this video on our IT policies.","startTime":4.769,"finishTime":8.189},{"text":"The IT policies discussed here are designed to protect our people,","startTime":8.689,"finishTime":12.5},{"text":"our data,","startTime":12.649000000000001,"finishTime":13.31},{"text":"and our systems","startTime":13.489,"finishTime":14.51},{"text":"from risks that could disrupt operations,","startTime":14.77,"finishTime":17.04},{"text":"compromise security,","startTime":17.37,"finishTime":18.479},{"text":"or cause financial and reputational harm.","startTime":18.69,"finishTime":21.049},{"text":"These are not mere suggestions.","startTime":21.85,"finishTime":23.7},{"text":"They are mandatory standards that safeguard the company's resources","startTime":24.049,"finishTime":27.549},{"text":"and ensure each of us can work safely,","startTime":27.77,"finishTime":30.01},{"text":"efficiently and securely.","startTime":30.09,"finishTime":32.04},{"text":"Every member of the organization is","startTime":32.49,"finishTime":34.33},{"text":"entrusted with access to technology and information","startTime":34.33,"finishTime":37.47},{"text":"that are vital to our success.","startTime":37.61,"finishTime":39.549},{"text":"Misuse,","startTime":40.049,"finishTime":40.61},{"text":"neglect,","startTime":40.68,"finishTime":41.209},{"text":"or careless behavior","startTime":41.29,"finishTime":42.59},{"text":"can lead to data breaches,","startTime":42.919,"finishTime":44.08},{"text":"system downtime,","startTime":44.25,"finishTime":45.31},{"text":"legal liabilities,","startTime":45.49,"finishTime":46.669},{"text":"and loss of client trust.","startTime":46.77,"finishTime":48.29},{"text":"By following these policies,","startTime":49.06,"finishTime":50.77},{"text":"we ensure that company devices and networks remain secure from threats and misuse.","startTime":51.02,"finishTime":55.84},{"text":"Sensitive data is protected from unauthorized access or disclosure.","startTime":56.669,"finishTime":60.799},{"text":"Communication channels,","startTime":61.189,"finishTime":62.43},{"text":"email,","startTime":62.909,"finishTime":63.15},{"text":"internet,","startTime":63.509,"finishTime":63.75},{"text":"Wi Fi","startTime":63.869,"finishTime":64.51},{"text":"are used appropriately and lawfully.","startTime":64.87,"finishTime":67.309},{"text":"Resources are available,","startTime":67.75,"finishTime":69.29},{"text":"reliable,","startTime":69.389,"finishTime":70.25},{"text":"and functioning for all employees.","startTime":70.389,"finishTime":72.33},{"text":"Compliance with these policies is a shared responsibility","startTime":73.18,"finishTime":76.519},{"text":"and a professional obligation.","startTime":76.699,"finishTime":78.3},{"text":"Every employee must not only understand and follow the rules,","startTime":79.069,"finishTime":82.58},{"text":"but also make them part of their daily work habits.","startTime":82.87,"finishTime":85.43},{"text":"Living these policies means practicing security awareness,","startTime":86.19,"finishTime":89.529},{"text":"exercising caution,","startTime":89.83,"finishTime":91.22},{"text":"and always respecting organizational resources.","startTime":91.47,"finishTime":94.23},{"text":"Together,","startTime":95.16,"finishTime":95.73},{"text":"this commitment creates a safe,","startTime":95.919,"finishTime":97.62},{"text":"productive,","startTime":98.12,"finishTime":98.68},{"text":"and trusted digital environment for everyone.","startTime":98.879,"finishTime":100.9}]}},"ZhuPjs9Nc9kSex4Ls":{"_id":"ZhuPjs9Nc9kSex4Ls","data":{"attributes":{"status":"online","type":"image","mimetype":"image/jpeg","fileSizeInBytes":179320,"uploadedFileName":"OpsWerksLogo_FullColor@3x-100.jpg","height":296,"uploadedFileNameExtension":".jpg","width":1680},"users":{"_userCreatorID":"fC4kb7RBFBRfNWPQp","_userModifierID":"fC4kb7RBFBRfNWPQp"},"dates":{"dateCreated":"2023-05-12T07:53:49.139Z","dateModified":"2023-05-12T15:23:41.624Z"}},"isVisible":true,"categoryId":"9kKr3aGggMqrEuvov","workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"ShWhw2prKJ8dRgjpK","isArchived":false},"bhvScYyAjqHt552BD":{"_id":"bhvScYyAjqHt552BD","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":28169011,"uploadedFileName":"ITSG Network Policy.mp4","duration":208.335011,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-06-08T00:46:07.075Z","dateModified":"2026-06-08T00:46:07.075Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"bY2Z2TyZQmL4b3z3D","thumbnail":"ffwMTmohRfefKgDY4","videoSD":"RejRs7y4xQQwJh59x","captionData":{"status":"success","captions":[{"text":"To maintain a stable,","startTime":4.38,"finishTime":5.71},{"text":"reliable,","startTime":5.869,"finishTime":6.619},{"text":"and secure network,","startTime":6.829,"finishTime":8.13},{"text":"all members must strictly follow established usage rules.","startTime":8.43,"finishTime":12.02},{"text":"This includes using only authorized devices and software,","startTime":12.47,"finishTime":15.949},{"text":"avoiding unauthorized hardware installations,","startTime":16.389,"finishTime":18.95},{"text":"and refraining from activities that could compromise security,","startTime":19.27,"finishTime":22.37},{"text":"performance,","startTime":22.79,"finishTime":23.329},{"text":"or data integrity.","startTime":23.549,"finishTime":24.709},{"text":"Adhering to these guidelines ensures the Opsworks network remains protected,","startTime":25.309,"finishTime":29.93},{"text":"efficient,","startTime":30.149,"finishTime":30.829},{"text":"and available for everyone's use.","startTime":30.95,"finishTime":33.009},{"text":"Members must not extend or retransmit network services in any way.","startTime":33.549,"finishTime":37.729},{"text":"This means a user must not install a router,","startTime":38.52,"finishTime":41.04},{"text":"switch,","startTime":41.36,"finishTime":41.72},{"text":"hub,","startTime":41.88,"finishTime":42.389},{"text":"or wireless access point to the OpsWorks network","startTime":42.639,"finishTime":45.419},{"text":"without ITSG's approval.","startTime":45.729,"finishTime":47.72},{"text":"Members must not install network hardware,","startTime":48.2,"finishTime":50.56},{"text":"connect to non-company issued device or software application","startTime":50.799,"finishTime":54.38},{"text":"without ITSG's approval.","startTime":54.68,"finishTime":56.38},{"text":"Members must be aware that the company network creates an audit log","startTime":57.159,"finishTime":60.779},{"text":"reflecting request for service,","startTime":61.119,"finishTime":62.68},{"text":"both inbound and outbound addresses,","startTime":63,"finishTime":65.29},{"text":"and is periodically reviewed.","startTime":65.48,"finishTime":67.379},{"text":"Members must not download,","startTime":67.76,"finishTime":69.309},{"text":"install,","startTime":69.41,"finishTime":70.04},{"text":"or run security programs or utilities","startTime":70.16,"finishTime":72.699},{"text":"that reveal weaknesses in the security of a system.","startTime":72.879,"finishTime":75.48},{"text":"For example,","startTime":76.279,"finishTime":77.16},{"text":"a member must not run password cracking programs,","startTime":77.36,"finishTime":80.15},{"text":"packet sniffers,","startTime":80.5,"finishTime":81.47},{"text":"network mapping tools,","startTime":81.959,"finishTime":82.989},{"text":"or port scanners while connected in any manner","startTime":83.199,"finishTime":85.62},{"text":"to the opsWorks network infrastructure.","startTime":85.959,"finishTime":88.059},{"text":"Only the ITSG is permitted to perform these actions.","startTime":88.839,"finishTime":92.199},{"text":"Never connect to any other network while you are connected to your customer's VPN.","startTime":92.97,"finishTime":97.169},{"text":"Cyber criminals may exploit this to gain control of your computer","startTime":97.949,"finishTime":101.379},{"text":"and access any networks you are connected to.","startTime":101.519,"finishTime":103.86},{"text":"Members must not introduce any form of","startTime":104.599,"finishTime":106.8},{"text":"malicious programs into the company's network or devices","startTime":106.8,"finishTime":110.379},{"text":"such as viruses,","startTime":110.519,"finishTime":111.55},{"text":"worms,","startTime":111.72,"finishTime":112.349},{"text":"Trojan horses,","startTime":112.55,"finishTime":113.599},{"text":"email bombs,","startTime":114,"finishTime":114.669},{"text":"or any other form of malware.","startTime":114.919,"finishTime":116.599},{"text":"Members must not reveal account passwords to others","startTime":116.919,"finishTime":119.76},{"text":"or allow the use of individual accounts by others.","startTime":119.919,"finishTime":122.91},{"text":"This includes friends,","startTime":123.279,"finishTime":124.589},{"text":"family,","startTime":124.779,"finishTime":125.309},{"text":"and other household members","startTime":125.47,"finishTime":126.959},{"text":"when work is being done at home or elsewhere away from the lab.","startTime":127.12,"finishTime":130.479},{"text":"Members must not make fraudulent offers of products,","startTime":130.949,"finishTime":134.229},{"text":"items,","startTime":134.35,"finishTime":134.789},{"text":"or services originating from any OpsWorks account.","startTime":134.869,"finishTime":138.449},{"text":"Members must not circumvent user authentication or security of any host,","startTime":138.91,"finishTime":143.5},{"text":"network,","startTime":144.02,"finishTime":144.27},{"text":"or account.","startTime":144.38,"finishTime":145.029},{"text":"Members must not introduce honey pots,","startTime":145.789,"finishTime":148.02},{"text":"honey nets,","startTime":148.22,"finishTime":148.979},{"text":"or similar technology on the Opsworks network.","startTime":149.19,"finishTime":151.85},{"text":"Members must not use any program,","startTime":152.559,"finishTime":154.74},{"text":"script,","startTime":154.88,"finishTime":155.479},{"text":"command,","startTime":155.6,"finishTime":156.229},{"text":"or send messages of any kind","startTime":156.449,"finishTime":158.38},{"text":"with the intent to interfere with","startTime":158.669,"finishTime":160.259},{"text":"or disable","startTime":160.38,"finishTime":161.3},{"text":"a user's terminal session","startTime":161.479,"finishTime":163.08},{"text":"by any means,","startTime":163.199,"finishTime":164.08},{"text":"locally or via the internet.","startTime":164.509,"finishTime":166.38},{"text":"Intranet,","startTime":166.6,"finishTime":167.25},{"text":"Extranet.","startTime":167.52,"finishTime":168.16},{"text":"Members must not share any end user information,","startTime":169.139,"finishTime":172.24},{"text":"including email addresses,","startTime":172.649,"finishTime":173.979},{"text":"phone numbers,","startTime":174.259,"finishTime":175.009},{"text":"department details,","startTime":175.339,"finishTime":176.33},{"text":"or other personal or company related data","startTime":176.58,"finishTime":179.149},{"text":"with any individual or organization outside the company.","startTime":179.539,"finishTime":182.899},{"text":"Members must not engage in activities that result in security breaches","startTime":183.619,"finishTime":187.639},{"text":"or disrupt network communication is forbidden.","startTime":187.94,"finishTime":190.5},{"text":"These activities include,","startTime":191.27,"finishTime":192.5},{"text":"but are not limited to","startTime":192.919,"finishTime":194.419},{"text":"unauthorized data access,","startTime":194.759,"finishTime":196.619},{"text":"logging into unauthorized servers or accounts,","startTime":196.83,"finishTime":199.75},{"text":"network sniffing,","startTime":200.36,"finishTime":201.339},{"text":"ping floods,","startTime":201.52,"finishTime":202.36},{"text":"or denial of service attacks,","startTime":202.6,"finishTime":204.539},{"text":"packet .529},{"text":"disabilities,","startTime":43.819,"finishTime":44.7},{"text":"age,","startTime":44.979,"finishTime":45.669},{"text":"sexual orientation,","startTime":45.939,"finishTime":47.52},{"text":"pornography,","startTime":47.799,"finishTime":48.74},{"text":"religious beliefs and practice,","startTime":49.02,"finishTime":50.639},{"text":"political beliefs,","startTime":51.139,"finishTime":52.02},{"text":"or national origin.","startTime":52.22,"finishTime":53.34},{"text":"Members receiving emails with this content from any employee","startTime":54.08,"finishTime":57.419},{"text":"should report the matter to their team leads or owner immediately.","startTime":57.599,"finishTime":61.139},{"text":"Email received in our systems must stay in our systems","startTime":61.639,"finishTime":65.099},{"text":"and must not be forwarded elsewhere","startTime":65.239,"finishTime":67.22},{"text":"unless there is a business need.","startTime":67.36,"finishTime":68.959},{"text":"Members are prohibited from using third-party email systems such as Gmail,","startTime":70.279,"finishTime":74.68},{"text":"Yahoo,","startTime":75,"finishTime":75.599},{"text":"and MSN Hotmail","startTime":75.8,"finishTime":77.239},{"text":"to conduct OpsWorks business,","startTime":77.519,"finishTime":79.36},{"text":"create or memorialize any binding transactions,","startTime":79.68,"finishTime":82.699},{"text":"or store or retain email on behalf of OpsWorks.","startTime":83.01,"finishTime":86.16},{"text":"Members must use extreme caution when opening","startTime":86.839,"finishTime":89.639},{"text":"email attachments received from unknown senders,","startTime":89.639,"finishTime":92.449},{"text":"which may contain malware that could lead to a hack or data breach.","startTime":92.839,"finishTime":96.4},{"text":"Sharing OpsWors confidential or sensitive information","startTime":97.809,"finishTime":101.449},{"text":"outside of Opsworks is strictly prohibited","startTime":101.449,"finishTime":103.989},{"text":"unless upper management approves.","startTime":104.129,"finishTime":105.93},{"text":"Confidential information","startTime":106.699,"finishTime":108.16},{"text":"includes all non-public information that might be useful to competitors","startTime":108.339,"finishTime":112.3},{"text":"or harmful to the company or our customers if disclosed.","startTime":112.48,"finishTime":115.879},{"text":"Sending or forwarding chain letters,","startTime":116.3,"finishTime":118.05},{"text":"hoax letters,","startTime":118.209,"finishTime":119.05},{"text":"or joke emails from Opswork's email account","startTime":119.26,"finishTime":121.68},{"text":"is strictly prohibited.","startTime":121.86,"finishTime":123.12},{"text":"Lastly,","startTime":123.91,"finishTime":124.54},{"text":"sending or forwarding emails with computer viruses is strictly prohibited.","startTime":124.83,"finishTime":128.74},{"text":"You can be liable if you send an email","startTime":129.07,"finishTime":131.07},{"text":"containing a virus using your personal or company email.","startTime":131.07,"finishTime":134.309}]}},"d22pwpShqboyuA2Aq":{"_id":"d22pwpShqboyuA2Aq","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":1582098,"uploadedFileName":"ITSG Title Page.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-06-07T21:31:38.811Z","dateModified":"2026-06-07T21:31:38.811Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"jmtbfNi9SMu3mEKrD","thumbnail":"dMXxEzivCbiiTBPgi"},"dvjNNtKE73aNFcWFk":{"_id":"dvjNNtKE73aNFcWFk","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":18180402,"uploadedFileName":"ITSG Internet Policy.mp4","duration":162.631,"uploadedFileNameEx Time":48.209,"finishTime":50.9},{"text":"or non-work related sites.","startTime":51.04,"finishTime":52.68},{"text":"Users are prohibited from using company internet access for malicious activities","startTime":53.59,"finishTime":58.209},{"text":"such as unauthorized access to local and remote computer systems,","startTime":58.63,"finishTime":62.38},{"text":"transmitting or sending of any form of malware,","startTime":62.869,"finishTime":65.58},{"text":"software piracy,","startTime":65.87,"finishTime":67.029},{"text":"the transmission of threatening,","startTime":67.349,"finishTime":68.75},{"text":"obscene,","startTime":68.83,"finishTime":69.519},{"text":"or harassing materials","startTime":69.709,"finishTime":71.129},{"text":"or personal solicitations,","startTime":71.309,"finishTime":73.089},{"text":"monitoring of computer and internet usage.","startTime":73.389,"finishTime":76.209},{"text":"All user activity on company IT assets is subject to logging and review.","startTime":76.68,"finishTime":81.51},{"text":"OpsWorks has the right to monitor and log all aspects of its systems,","startTime":82.08,"finishTime":86.66},{"text":"including,","startTime":87.12,"finishTime":87.419},{"text":"but not limited to","startTime":87.559,"finishTime":88.819},{"text":"monitoring internet sites visited by members","startTime":89.04,"finishTime":91.819},{"text":"and monitoring file downloads.","startTime":92,"finishTime":93.68},{"text":"It is also important to note that computer resources are not unlimited.","startTime":94.349,"finishTime":98.51},{"text":"Network bandwidth and storage capacity have finite limits,","startTime":99.3,"finishTime":102.86},{"text":"and all users connected to the network","startTime":103.18,"finishTime":105.239},{"text":"have a responsibility to conserve these resources.","startTime":105.379,"finishTime":108.059},{"text":"As such,","startTime":108.86,"finishTime":109.58},{"text":"member must not deliberately perform acts that waste computer resources","startTime":109.98,"finishTime":114},{"text":"or unfairly monopolize resources to the exclusion of others.","startTime":114.279,"finishTime":117.779},{"text":"These acts include,","startTime":118.55,"finishTime":119.61},{"text":"but are not limited to,","startTime":120.069,"finishTime":121.4},{"text":"spending excessive amounts of time on the internet,","startTime":121.79,"finishTime":124.19},{"text":"playing games,","startTime":124.47,"finishTime":125.37},{"text":"engaging in online chat groups,","startTime":125.589,"finishTime":127.629},{"text":"uploading or downloading large files,","startTime":127.87,"finishTime":130.169},{"text":"accessing streaming audio and or video files,","startTime":130.75,"finishTime":133.539},{"text":"or otherwise creating unnecessary loads on network traffic","startTime":133.91,"finishTime":137.389},{"text":"associated with non-business related uses of the internet.","startTime":137.589,"finishTime":140.71},{"text":"ITSG utilizes software that makes it possible","startTime":141.5,"finishTime":144.77},{"text":"to identify and block access to internet sites","startTime":144.77,"finishTime":147.85},{"text":"containing sexually explicit material","startTime":148.07,"finishTime":150.279},{"text":"or other material deemed inappropriate in the workplace.","startTime":150.479,"finishTime":153.389},{"text":"The display,","startTime":154,"finishTime":154.759},{"text":"storing,","startTime":154.839,"finishTime":155.36},{"text":"archiving,","startTime":155.47,"finishTime":156.039},{"text":"or editing of such content on any Opsworks devices is prohibited.","startTime":156.08,"finishTime":159.94}]}},"fjcb5ikYoEWPm2moK":{"_id":"fjcb5ikYoEWPm2moK","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":44733868,"uploadedFileName":"ITSG Laptop Usage Policy.mp4","duration":276.318005,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-06-10T08:53:52.120Z","dateModified":"2026-06-10T08:53:52.120Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"Sb5HAbeoiiLZP5dKj","thumbnail":"2fjeza9z7Rcn47oqb","videoSD":"pHcjQ9AACKepsyBgz","captionData":{"status":"success","captions":[{"text":"Laptop usage policy.","startTime":2.17,"finishTime":3.91},{"text":"This policy outlines the proper use,","startTime":4.409,"finishTime":6.61},{"text":"care,","startTime":6.9,"finishTime":7.369},{"text":"and responsibility associated with company-issued laptops.","startTime":7.53,"finishTime":11.09},{"text":"All members must follow the guidelines below to ensure device security,","startTime":11.989,"finishTime":15.949},{"text":"minimize risks,","startTime":16.158,"finishTime":17.329},{"text":"and avoid unnecessary costs due to damage or loss.","startTime":17.459,"finishTime":20.79},{"text":"Set a strong password on your laptop.","startTime":21.27,"finishTime":23.43},{"text":"Use a strong,","startTime":23.87,"finishTime":24.59},{"text":"long and complex password","startTime":24.709,"finishTime":26.309},{"text":"that combines uppercase and lowercase letters,","startTime":26.479,"finishTime":28.899},{"text":"numbers,","startTime":29.159,"finishTime":29.77},{"text":"and special symbols,","startTime":29.87,"finishTime":31.09},{"text":"making it harder to guess.","startTime":31.28,"finishTime":32.63},{"text":"When your laptop is not in use,","startTime":33.43,"finishTime":35.229},{"text":"store it in a locked cabinet or desk.","startTime":35.56,"finishTime":37.68},{"text":"All computing devices must be secured","startTime":38.2,"finishTime":40.819},{"text":"with a password-protected screen saver","startTime":40.959,"finishTime":43.04},{"text":"or lock screen","startTime":43.24,"finishTime":44.27},{"text":"that automatically activates in 10 minutes or less.","startTime":44.439,"finishTime":47.419},{"text":"Lock the screen or log off when leaving the device unattended.","startTime":47.959,"finishTime":51.74},{"text":"When you are in public places,","startTime":52.08,"finishTime":53.59},{"text":"do not leave the laptop unattended.","startTime":53.84,"finishTime":55.68},{"text":"Do not remove ITSG's local admin account on your laptop","startTime":56.299,"finishTime":59.97},{"text":"and do not disconnect your laptop from the mobile device management system","startTime":60.259,"finishTime":63.88},{"text":"without ITSG's approval.","startTime":64.18,"finishTime":66.08},{"text":"Do not put stickers on your laptop.","startTime":66.54,"finishTime":68.559},{"text":"Personalizing a work laptop provided to you is a big no no","startTime":68.94,"finishTime":72.4},{"text":"because it's considered company property.","startTime":72.66,"finishTime":74.44},{"text":"If you still want stickers,","startTime":75.199,"finishTime":76.629},{"text":"put the sticker on the laptop skin.","startTime":76.879,"finishTime":78.639},{"text":"Attaching stickers directly to the laptop may leave a","startTime":79.37,"finishTime":82.37},{"text":"permanent mark on the laptop even if it's removed.","startTime":82.37,"finishTime":85.23},{"text":"Installing unauthorized software applications or tools","startTime":85.61,"finishTime":88.809},{"text":"on your laptop is not allowed.","startTime":88.809,"finishTime":90.739},{"text":"Always refer to the approved applications list provided by ITSG","startTime":91.25,"finishTime":95.529},{"text":"before proceeding with any installation.","startTime":96.04,"finishTime":97.97},{"text":"If the application you require is not included in the approved list,","startTime":98.69,"finishTime":102.569},{"text":"you must secure prior approval from your technical manager","startTime":102.9,"finishTime":106.08},{"text":"and ITSG","startTime":106.26,"finishTime":107.66},{"text":"before installing it.","startTime":107.98,"finishTime":108.9},{"text":"Installation of pirated or unlicensed software on company-issued laptops","startTime":110.22,"finishTime":115.26},{"text":"is strictly prohibited,","startTime":115.419,"finishTime":116.86},{"text":"as such software may introduce malware and pose significant security risks.","startTime":117.18,"finishTime":121.459},{"text":"Additionally,","startTime":122.15,"finishTime":122.97},{"text":"company-issued laptops are strictly intended for work-related purposes only","startTime":123.3,"finishTime":127.73},{"text":"and are not to be used for any form of computer gaming.","startTime":127.949,"finishTime":130.75},{"text":"Installing or using games is prohibited","startTime":131.419,"finishTime":134.119},{"text":"as it may negatively impact system performance,","startTime":134.339,"finishTime":137.119},{"text":"consume unnecessary resources,","startTime":137.38,"finishTime":139.479},{"text":"and introduce potential security risks.","startTime":139.729,"finishTime":141.979},{"text":"Laptop repair costs hundreds of dollars,","startTime":142.83,"finishTime":145.389},{"text":"and repair time may take weeks to months,","startTime":145.669,"finishTime":147.929},{"text":"depending on the availability of the parts.","startTime":148.429,"finishTime":150.49},{"text":"Here are some tips to make your laptop safe.","startTime":150.83,"finishTime":153.369},{"text":"Keep food and drink away from the laptop.","startTime":153.75,"finishTime":156.05},{"text":"Water or any liquid spilled on your laptop will damage the laptop's logic boards,","startTime":156.509,"finishTime":161.179},{"text":"making it unusable.","startTime":161.309,"finishTime":162.729},{"text":"Eating near your laptop is also not a good habit,","startTime":163.27,"finishTime":166.1},{"text":"since it could lead to bits of food falling into the laptop's keyboard,","startTime":166.27,"finishTime":169.619},{"text":"and it may attract ants.","startTime":169.91,"finishTime":171.309},{"text":"Ants may also sneak into your laptop to create nests and lay eggs.","startTime":172.07,"finishTime":176.169},{"text":"When that happens,","startTime":176.509,"finishTime":177.429},{"text":"they will cause severe damage to your laptop.","startTime":177.669,"finishTime":180.149},{"text":"Place your laptop out of reach of children and pets.","startTime":180.47,"finishTime":183.5},{"text":"Do not play in front of your laptop like juggling a ball near your laptop,","startTime":183.83,"finishTime":187.899},{"text":"tossing a tumbler or something.","startTime":188.22,"finishTime":190.089},{"text":"A hard or heavy object that falls or","startTime":190.589,"finishTime":193.029},{"text":"hits your laptop will surely destroy your laptop.","startTime":193.029,"finishTime":196.029},{"text":"Be gentle when plugging or unplugging connectors or accessories from the laptop.","startTime":196.429,"finishTime":200.83},{"text":"Make sure there is no object between the","startTime":201.529,"finishTime":203.649},{"text":"screen and the keyboard before closing your laptop.","startTime":203.649,"finishTime":206.33},{"text":"When traveling,","startTime":206.77,"finishTime":207.52},{"text":"never place your laptop in checked baggage.","startTime":207.77,"finishTime":210.19},{"text":"Checked bags are often handled roughly,","startTime":210.63,"finishTime":212.71},{"text":"which can damage sensitive and expensive laptop equipment.","startTime":212.929,"finishTime":215.889},{"text":"There is also an increased risk of theft.","startTime":216.66,"finishTime":219.039},{"text":"Avoid carrying your laptop by hand when traveling.","startTime":219.419,"finishTime":222.24},{"text":"Always use a sturdy padded backpack","startTime":222.779,"finishTime":224.839},{"text":"or laptop bag for commuting.","startTime":225.1,"finishTime":226.74},{"text":"Ensure your bag provides protection against water or spills,","startTime":227.46,"finishTime":230.94},{"text":"especially in case of rain.","startTime":231.339,"finishTime":232.619},{"text":"It is also important to remember","startTime":233.309,"finishTime":235.169},{"text":"that your laptop is not immune from any data corruption,","startTime":235.309,"finishTime":238.539},{"text":"hard disk failure,","startTime":238.83,"finishTime":239.91},{"text":"and hardware failure.","startTime":240.07,"finishTime":241.449},{"text":"We recommend that you do a regular backup of your files.","startTime":241.949,"finishTime":245.25},{"text":"If your laptop gets lost,","startTime":245.63,"finishTime":247.259},{"text":"stolen,","startTime":247.389,"finishTime":247.949},{"text":"or damaged,","startTime":248.029,"finishTime":248.86},{"text":"please report the issue immediately to your leads and ITSG.","startTime":249.309,"finishTime":253.19},{"text":"Upon termination of employment,","startTime":253.949,"finishTime":255.779},{"text":"remember that you must return all issued devices in good condition.","startTime":256.16,"finishTime":259.67},{"text":"ITSG will inspect the devices for any damages in front of the resigning member.","startTime":260.418,"finishTime":265.308},{"text":"Lastly,","startTime":266.2,"finishTime":266.799},{"text":"if a laptop is lost,","startTime":266.92,"finishTime":268.179},{"text":"deliberately damaged,","startTime":268.64,"finishTime":269.79},{"text":"or damaged due to negligence,","startTime":270,"finishTime":271.75},{"text":"the user will be responsible for covering the cost of repair or replacement.","startTime":272.079,"finishTime":276.16}]}},"kht5wEXQZ4tHLhqLe":{"_id":"kht5wEXQZ4tHLhqLe","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":39218134,"uploadedFileName":"ITSG Password Policy.mp4","duration":252.37,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-06-10T09:17:12.161Z","dateModified":"2026-06-10T09:17:12.161Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"JgWhxvysqqyEr255Y","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"YEKY5CxC8s26cxsyg","thumbnail":"JsqYW3Wu2dDytCabs","videoSD":"p8iwdfWm6QsL9QSpd","captionData":{"status":"success","captions":[{"text":"Password policy","startTime":1.669,"finishTime":2.9699999999999998},{"text":"A strong password is one of the keys to keep your account from being hacked.","startTime":4.659,"finishTime":8.59},{"text":"Without up to-date practices,","startTime":9.369,"finishTime":11.079},{"text":"you might be using passwords that cyber criminals can easily guess.","startTime":11.279,"finishTime":14.93},{"text":"In general,","startTime":15.68,"finishTime":16.299},{"text":"good passwords are long,","startTime":16.799,"finishTime":18.12},{"text":"hard to guess,","startTime":18.36,"finishTime":19.02},{"text":"easy to remember,","startTime":19.6,"finishTime":20.62},{"text":"and easy to type.","startTime":20.719,"finishTime":21.889},{"text":"Password recommendations.","startTime":22.44,"finishTime":24.139},{"text":"Number 1,","startTime":24.52,"finishTime":25.159},{"text":"we recommend using at least 16 characters long.","startTime":25.389,"finishTime":28.239},{"text":"Make sure it does not have any personal information like birthdays,","startTime":28.6,"finishTime":32.279},{"text":"anniversaries,","startTime":32.479,"finishTime":33.36},{"text":"or your phone number.","startTime":33.599,"finishTime":34.56},{"text":"It's also best not to include any information that can","startTime":35.189,"finishTime":38.15},{"text":"be found on social media like your child's name,","startTime":38.15,"finishTime":40.83},{"text":"name of a family member,","startTime":41.229,"finishTime":42.389},{"text":"or pet's name.","startTime":42.5,"finishTime":43.529},{"text":"A combination of uppercase letters,","startTime":43.86,"finishTime":45.779},{"text":"lowercase letters,","startTime":46.029,"finishTime":47.02},{"text":"numbers,","startTime":47.27,"finishTime":47.869},{"text":"and adding one or two different symbols will make it harder to crack.","startTime":48.069,"finishTime":51.61},{"text":"You may also use phrase or a sentence,","startTime":51.99,"finishTime":54.349},{"text":"and you may use spaces.","startTime":54.63,"finishTime":56.419},{"text":"Make sure your password is not listed in","startTime":56.79,"finishTime":58.63},{"text":"the breached password lists found in the internet.","startTime":58.63,"finishTime":61.049},{"text":"Your individual passwords must not be shared with anyone.","startTime":61.59,"finishTime":64.75},{"text":"Once you've shared your password with someone,","startTime":65.43,"finishTime":67.29},{"text":"they can use it however they like,","startTime":67.629,"finishTime":69.489},{"text":"and there isn't anything you can do to control or prevent their actions.","startTime":69.709,"finishTime":73.66},{"text":"Don't write passwords down and place them anywhere.","startTime":74.11,"finishTime":77},{"text":"Use a password manager to store your passwords securely","startTime":77.47,"finishTime":80.73},{"text":"so you don't have to worry about remembering them.","startTime":80.989,"finishTime":83.069},{"text":"This allows you to use unique,","startTime":83.73,"finishTime":85.489},{"text":"strong passwords for all important accounts.","startTime":85.73,"finishTime":88.41},{"text":"Passwords must not be inserted into any email messages","startTime":89.029,"finishTime":92.819},{"text":"because emails are sent in clear text.","startTime":92.989,"finishTime":95.29},{"text":"If the email is intercepted,","startTime":95.709,"finishTime":97.37},{"text":"it will be easy to extract your password.","startTime":97.47,"finishTime":99.86},{"text":"Avoid saving passwords in your web browsers,","startTime":100.269,"finishTime":102.389},{"text":"for example,","startTime":102.47,"finishTime":103.22},{"text":"Chrome,","startTime":103.55,"finishTime":103.949},{"text":"Safari,","startTime":104.23,"finishTime":104.75},{"text":"or Edge.","startTime":104.83,"finishTime":105.61},{"text":"While this feature may be convenient,","startTime":106.19,"finishTime":107.98},{"text":"stored browser credentials can be vulnerable to unauthorized access,","startTime":108.349,"finishTime":112.15},{"text":"malware,","startTime":112.3,"finishTime":112.949},{"text":"or device compromise.","startTime":113.15,"finishTime":114.389},{"text":"If you think your password may have been compromised,","startTime":115.139,"finishTime":117.769},{"text":"immediately report the incident to ITSG","startTime":118.269,"finishTime":120.87},{"text":"and change all passwords.","startTime":121,"finishTime":122.389},{"text":"Suppose you are a member of the application development team or software group,","startTime":123.25,"finishTime":127.55},{"text":"or","startTime":128.02,"finishTime":128.5},{"text":"you are an individual contributor from another","startTime":128.699,"finishTime":130.899},{"text":"team doing tasks related to application development.","startTime":130.899,"finishTime":133.899},{"text":"You must ensure that you have considered the following security precautions.","startTime":134.58,"finishTime":138.259},{"text":"You must ensure not to use default passwords.","startTime":138.94,"finishTime":141.63},{"text":"Attackers can quickly identify and access internet-connected systems","startTime":142.259,"finishTime":146.44},{"text":"that use shared default passwords,","startTime":146.619,"finishTime":148.619},{"text":"so changing the default application passwords","startTime":149.059,"finishTime":151.479},{"text":"and restricting access to critical systems is a must.","startTime":151.639,"finishTime":155.02},{"text":"Applications must support the authentication of individual users,","startTime":155.46,"finishTime":159.369},{"text":"not groups.","startTime":159.619,"finishTime":160.339},{"text":"Applications must not store passwords in clear text","startTime":161.029,"finishTime":164.44},{"text":"or any easily reversible form.","startTime":164.6,"finishTime":166.58},{"text":"Applications must not transmit passwords in clear text over the network.","startTime":167.24,"finishTime":171.619},{"text":"Applications should use encryption to protect","startTime":172.08,"finishTime":174.679},{"text":"all sensitive client and server communications.","startTime":174.679,"finishTime":177.24},{"text":"Communications that should be protected include","startTime":178.029,"finishTime":180.52},{"text":"the login mechanism and related functionality","startTime":180.52,"finishTime":183.369},{"text":"and any functions where sensitive data can be accessed","startTime":183.55,"finishTime":186.529},{"text":"or privileged actions can be performed.","startTime":186.75,"finishTime":189.21},{"text":"Applications must provide some sort of role management","startTime":189.63,"finishTime":192.66},{"text":"such that one user can take over the functions of another","startTime":193.029,"finishTime":195.889},{"text":"without having to know the other's password.","startTime":196.07,"finishTime":198.25},{"text":"What is 2FA or two-factor authentication?","startTime":198.789,"finishTime":201.809},{"text":"Two-factor authentication,","startTime":202.669,"finishTime":204.24},{"text":"2FA","startTime":204.279,"finishTime":205.21},{"text":"is a security system that requires two separate","startTime":205.559,"finishTime":208.539},{"text":"distinct forms of identification to access something.","startTime":208.539,"finishTime":211.66},{"text":"The first factor is a password,","startTime":212.49,"finishTime":214.47},{"text":"and the second commonly includes a text with a code","startTime":214.77,"finishTime":217.77},{"text":"sent to your smartphone or biometrics using your fingerprint,","startTime":217.77,"finishTime":221.36},{"text":"face,","startTime":221.669,"finishTime":222.07},{"text":"or retina.","startTime":222.25,"finishTime":222.929},{"text":"So basically,","startTime":223.699,"finishTime":224.61},{"text":"this adds an extra layer of security,","startTime":224.619,"finishTime":226.639},{"text":"a user's account,","startTime":226.74,"finishTime":227.83},{"text":"because the user must go through one more step to log in successfully.","startTime":228.139,"finishTime":232.02},{"text":"Here's the list of two-factor authentication that we use","startTime":233.419,"finishTime":236.75},{"text":"Ubike or any passkey compatible factor","startTime":237.08,"finishTime":239.919},{"text":"like face ID or touch ID,","startTime":240.1,"finishTime":242.199},{"text":"offline time-based one-time PI,","startTime":242.619,"finishTime":244.72},{"text":"also known as code generators.","startTime":245.259,"finishTime":247.139},{"text":"Push notification","startTime":247.889,"finishTime":249.149},{"text":"and call or SMS.","startTime":249.25,"finishTime":250.889}]}}},"questionsById":{"4dFtJd4aiThxksYns":{"_id":"4dFtJd4aiThxksYns","_siteID":"a7vTDrSZc6TSbC7kc","workspaceId":"AdPorMyw28Jp7Q9cy","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>I am currently in the lab. I&#39;m about to step out to the restroom, so should I lock my laptop?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":5,"correctResponses":["qfTFTZMqMaRP5m8Mz"],"multipleAnswers":false,"shuffleAnswers":true},"users":{"_userModifierID":"yQX3zSzBuxtp2nLSY","_userCreatorID":"yQX3zSzBuxtp2nLSY"},"dates":{"dateModified":"2026-06-11T02:08:44.741Z","dateCreated":"2026-06-11T02:08:44.741Z"}},"responses":[{"identifier":"Jpxer77zx7JCzduJ6","description":{"type":"text","html":"\u003cdiv>\u003cspan style=\"font-size:11.0pt\">No. It is a hassle to even remember a password.\u003c/span>\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"qfTFTZMqMaRP5m8Mz","description":{"type":"text","html":"\u003cdiv>\u003cspan style=\"font-size:11.0pt\">Yes. To prevent someone from tampering with my laptop files while I am gone.\u003c/span>\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"ywATYZbBiE3d7nKk7","description":{"type":"text","html":"\u003cdiv>\u003cspan style=\"font-size:11.0pt\">No. I have 99% trust with all my colleagues in the lab.\u003c/span>\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"ApCoA3BLyheShNMpt","description":{"type":"text","html":"\u003cdiv>\u003cspan style=\"font-size:11.0pt\">Yes. I think I should have fun by repeatedly typing in the wrong password, causing my laptop to get locked.\u003c/span>\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"4kZwAoZBobNYNtDSq":{"_id":"4kZwAoZBobNYNtDSq","_siteID":"a7vTDrSZc6TSbC7kc","workspaceId":"AdPorMyw28Jp7Q9cy","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>If your Opswerks email account receives promotional emails that are unrelated to your work, should you reply to them?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["joWMMNxS9nWXwDFoz"],"multipleAnswers":true,"shuffleAnswers":true},"users":{"_userModifierID":"yQX3zSzBuxtp2nLSY","_userCreatorID":"yQX3zSzBuxtp2nLSY"},"dates":{"dateModified":"2026-06-11T02:08:44.741Z","dateCreated":"2026-06-11T02:08:44.741Z"}},"responses":[{"identifier":"chSaJvCokEGWRcG4v","description":{"type":"text","html":"\u003cdiv>\n\u003cdiv>Yes, so I can inquire further about the offers.\u003c/div>\n\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"joWMMNxS9nWXwDFoz","description":{"type":"text","html":"\u003cdiv>No. The email may contain malicious links or attachments that could compromise security.\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"7Pa7zm3BooGKhj7Et":{"_id":"7Pa7zm3BooGKhj7Et","_siteID":"a7vTDrSZc6TSbC7kc","workspaceId":"AdPorMyw28Jp7Q9cy","data":{"attributes":{"locale":"en","template":"questionMatchText","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>\u003cspan s
