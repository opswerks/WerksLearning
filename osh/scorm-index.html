ce environment here in the Philippines,","startTime":36.43,"finishTime":39.06},{"text":"where we also consider risks like earthquakes,","startTime":39.389,"finishTime":41.779},{"text":"power fluctuations,","startTime":42.13,"finishTime":43.31},{"text":"and emergency situations.","startTime":43.54,"finishTime":45.029},{"text":"By the end of this session,","startTime":46.18,"finishTime":47.45},{"text":"you will understand why workplace safety matters,","startTime":47.659,"finishTime":50.45},{"text":"how to recognize hazards in an office environment,","startTime":50.779,"finishTime":53.439},{"text":"your rights and responsibilities under Philippine law,","startTime":53.779,"finishTime":56.689},{"text":"and what actions to take during emergencies.","startTime":56.979,"finishTime":59.459},{"text":"We will also discuss practical examples","startTime":60.27,"finishTime":62.729},{"text":"such as electrical safety at workstations,","startTime":62.909,"finishTime":65.209},{"text":"ergonomics during long hours,","startTime":65.47,"finishTime":67.29},{"text":"and reporting hazards early.","startTime":67.51,"finishTime":69.11}]}}},"questionsById":{},"resourcesById":{"4n2ZhzXMYGmAGHXAs":{"_id":"4n2ZhzXMYGmAGHXAs","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceVideo","locale":"en","title":"Video","upload":"DTcYdCJAwGnmcsknE"},"dates":{"dateCreated":"2026-04-15T23:17:29.522Z","dateModified":"2026-05-22T10:00:51.449Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"yQX3zSzBuxtp2nLSY"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"overlays":[],"needToCompleteSlideForPageCompletion":true,"disableForwardSeeking":true}},"workspaceId":"z7qLsKtPGn3ovAsdJ","assets":["DTcYdCJAwGnmcsknE"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"5BYvmwxNwkAXy5XJR":{"_id":"5BYvmwxNwkAXy5XJR","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{" },{"text":"These are considered unhealthy acts","startTime":34.59,"finishTime":36.97},{"text":"smoking in the workplace,","startTime":37.27,"finishTime":38.759},{"text":"inhaling organic solvents,","startTime":38.95,"finishTime":40.79},{"text":"drinking alcoholic beverages during work hours,","startTime":41.15,"finishTime":43.77},{"text":"and taking illegal drugs inside company premises.","startTime":44.069,"finishTime":47.069},{"text":"An unsafe condition is something in our environment.","startTime":47.7,"finishTime":50.799},{"text":"Examples are","startTime":51.22,"finishTime":52.36},{"text":"defective tools or equipment,","startTime":52.619,"finishTime":54.659},{"text":"blocked exit,","startTime":55.02,"finishTime":56.04},{"text":"inadequate warning signs,","startTime":56.299,"finishTime":57.81},{"text":"slippery floors,","startTime":58.099,"finishTime":59.34},{"text":"hazardous condition.","startTime":59.54,"finishTime":60.84},{"text":"Meanwhile,","startTime":61.599,"finishTime":62.22},{"text":"the following are considered unhealthy conditions","startTime":62.4,"finishTime":65.129},{"text":"excessive noise,","startTime":65.459,"finishTime":66.66},{"text":"inadequate ventilation,","startTime":66.879,"finishTime":68.269},{"text":"extreme temperature.","startTime":68.72,"finishTime":69.569},{"text":"In an office setting,","startTime":70.33,"finishTime":71.48},{"text":"examples include running network cables across walkways,","startTime":71.849,"finishTime":75.19},{"text":"improper workstation set up leading to strain,","startTime":75.37,"finishTime":77.879},{"text":"or leaving equipment overheating without reporting it.","startTime":78.209,"finishTime":80.73}],"disableForwardSeeking":true}},"workspaceId":"z7qLsKtPGn3ovAsdJ","assets":["LbeWX7kuezDPd5j2H"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"mecE8swhN9QteXjSc":{"_id":"mecE8swhN9QteXjSc","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceVideo","locale":"en","title":"V
