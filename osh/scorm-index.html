:25.86,"finishTime":28.1},{"text":"2.","startTime":28.95,"finishTime":29.6},{"text":"Electrical safety.","startTime":29.959,"finishTime":31.069},{"text":"Respect the power","startTime":31.969,"finishTime":33.27},{"text":"As the graphic shows,","startTime":34.319,"finishTime":35.569},{"text":"frayed wires and exposed leads are immediate hazards.","startTime":35.77,"finishTime":39.27},{"text":"Never ignore a damaged cord.","startTime":39.65,"finishTime":41.45},{"text":"Tag it out and report it.","startTime":41.77,"finishTime":43.29},{"text":"Electricity doesn't give second chances.","startTime":44.04,"finishTime":46.619},{"text":"3,","startTime":47.159,"finishTime":47.84},{"text":"material handling.","startTime":48.319,"finishTime":49.319},{"text":"Protect your back when lifting.","startTime":50.099,"finishTime":51.939},{"text":"Always keep your back upright and hold the load close to your body.","startTime":52.259,"finishTime":56.02},{"text":"Let your legs do the heavy lifting,","startTime":56.459,"finishTime":58.209},{"text":"not your spine.","startTime":58.459,"finishTime":59.58},{"text":"If it's too heavy,","startTime":59.9,"finishTime":60.93},{"text":"don't be proud.","startTime":61.169,"finishTime":62.06},{"text":"Ask for help.","startTime":62.31,"finishTime":63.4},{"text":"4","startTime":64.099,"finishTime":64.86},{"text":"fire safety.","startTime":65.22,"finishTime":66.3},{"text":"Prevention is the best fire extinguisher.","startTime":66.61,"finishTime":69.129},{"text":"By maintaining our 5S standards and electrical checks,","startTime":69.419,"finishTime":72.37},{"text":"we eliminate most fire risks.","startTime":72.66,"finishTime":74.61},{"text":"Know your exits,","startTime":74.889,"finishTime":75.919},{"text":"and keep them clear at all times.","startTime":75.94,"finishTime":77.66},{"text":"Safety is a team sport.","startTime":78.5,"finishTime":79.839},{"text":"Stay sharp,","startTime":80.089,"finishTime":80.66},{"text":"follow the rules,","startTime":80.849,"finishTime":81.699},{"text":"and let's keep this workplace accident-free.","startTime":81.86,"finishTime":84.18}]}},"5g7PjwDTMg3AJJiex":{"_id":"5g7PjwDTMg3AJJiex","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":21003841,"uploadedFileName":"HIRAC 1.0-2.mp4","duration":133.417,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-22T09:58:36.806Z","dateModified":"2026-05-22T09:58:36.806Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"qKd5GAxwhGTK5sXaQ","thumbnail":"dMNgRLFaKbLLfA6wa","videoSD":"a9NMMjrzfBY8s5vZp","captionData":{"status":"success","captions":[{"text":"As we grow toward our goal here at Ops Works,","startTime":0.349,"finishTime":2.789},{"text":"keeping our workplace safe is our top priority.","startTime":3.15,"finishTime":6.019},{"text":"Today we're talking about HIIRAC,","startTime":6.55,"finishTime":8.43},{"text":"which stands for Hazard Identification,","startTime":8.63,"finishTime":11.13},{"text":"Risk Assessment and Control.","startTime":11.47,"finishTime":13.449},{"text":"Think of it as our proactive safety radar,","startTime":13.909,"finishTime":16.709},{"text":"finding potential issues before they become accidents.","startTime":16.989,"finishTime":19.93},{"text":"Step one is hazard identification.","startTime":20.379,"finishTime":22.67},{"text":"In an IT setting,","startTime":23.389,"finishTime":24.709},{"text":"hazards aren't always obvious.","startTime":24.909,"finishTime":26.93},{"text":"It could be an unsafe condition","startTime":27.229,"finishTime":29.079},{"text":"like frayed power cables in the server room","startTime":29.229,"finishTime":31.489},{"text":"or a physical hazard","startTime":31.719,"finishTime":33.33},{"text":"like poor workstation ergonomics","startTime":33.509,"finishTime":35.529},{"text":"that causes back strain during a long shift.","startTime":35.669,"finishTime":37.909},{"text":"We look for anything","startTime":38.58,"finishTime":39.79},{"text":"physical,","startTime":39.99,"finishTime":40.5},{"text":"chemical,","startTime":40.58,"finishTime":41.22},{"text":"or even psychological","startTime":41.47,"finishTime":42.93},{"text":"that could cause harm.","startTime":43.189,"finishTime":44.459},{"text":"Once we find a hazard,","startTime":44.869,"finishTime":46.159},{"text":"we perform a risk assessment.","startTime":46.349,"finishTime":48.27},{"text":"We ask two questions.","startTime":48.59,"finishTime":50.11},{"text":"First,","startTime":50.549,"finishTime":51.06},{"text":"how likely is it to happen?","startTime":51.31,"finishTime":52.81},{"text":"And second,","startTime":53.069,"finishTime":53.86},{"text":"if it does happen,","startTime":54.15,"finishTime":55.169},{"text":"how severe is the injury?","startTime":55.31,"finishTime":56.93},{"text":"By multiplying likelihood and severity,","startTime":57.31,"finishTime":59.459},{"text":"we get a risk score.","startTime":59.63,"finishTime":61.049},{"text":"This helps us prioritize.","startTime":61.43,"finishTime":62.81},{"text":"A tripping hazard in a high traffic hallway gets","startTime":63.509,"finishTime":66.23},{"text":"fixed before a dusty shelf in a storage closet.","startTime":66.23,"finishTime":68.8},{"text":"Finally,","startTime":70.66,"finishTime":71.18},{"text":"we implement controls.","startTime":71.3,"finishTime":72.879},{"text":"We always follow the hierarchy of controls.","startTime":73.18,"finishTime":75.839},{"text":"Elimination.","startTime":76.15,"finishTime":77.139},{"text":"Can we remove the hazard entirely?","startTime":77.51,"finishTime":79.599},{"text":"Engineering,","startTime":80.089,"finishTime":80.97},{"text":"can we use standing desks or cable organizers?","startTime":81.379,"finishTime":84.26},{"text":"Administrative.","startTime":84.91,"finishTime":85.949},{"text":"This is where our 8 hour OSH training and 5S housekeeping come in.","startTime":86.349,"finishTime":90.47},{"text":"PPE.","startTime":91.339,"finishTime":92.139},{"text":"While rare in IT,","startTime":92.94,"finishTime":93.98},{"text":"this might include anti-static wristbands for our hardware team.","startTime":94.22,"finishTime":97.72},{"text":"Our goal is always to use the most effective control possible.","startTime":98.26,"finishTime":101.44},{"text":"At Opsworks,","startTime":103.4,"finishTime":104.43},{"text":"we're all about delivering top tier results for our clients,","startTime":104.529,"finishTime":107.879},{"text":"but we can't do that without our most important asset,","startTime":108.209,"finishTime":111.11},{"text":"you.","startTime":111.489,"finishTime":111.849},{"text":"We've identified the risks and set the controls.","startTime":112.569,"finishTime":115.51},{"text":"Now let's put them into practice.","startTime":116.01,"finishTime":117.309},{"text":"Remember,","startTime":118.279,"finishTime":118.949},{"text":"safety isn't just a checklist,","startTime":119.33,"finishTime":121.099},{"text":"it's part of how we scale together.","startTime":121.319,"finishTime":122.779},{"text":"If you see a hazard,","startTime":123.72,"finishTime":124.669},{"text":"don't wait,","startTime":124.879,"finishTime":125.589},{"text":"report it.","startTime":125.889,"finishTime":126.629},{"text":"Let's keep our momentum high and our workplace safe.","startTime":127.01,"finishTime":129.99},{"text":"Thanks for being part of the team.","startTime":130.41,"finishTime":131.97}]}},"7CBta3Fzf6ebcoWma":{"_id":"7CBta3Fzf6ebcoWma","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":25550516,"uploadedFileName":"Course Recap 1.0.mp4","duration":138.45,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-18T03:40:48.330Z","dateModified":"2026-05-18T03:40:48.330Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"3AjccBfQDEeuHZN9h","thumbnail":"thKFr3MXw5WT3qAKJ","videoSD":"Zca4Tezqy3o66RX6G","captionData":{"status":"success","captions":[{"text":"Let's recap what we have learned.","startTime":1.289,"finishTime":2.93},{"text":"Safety is not just a policy,","startTime":5.099,"finishTime":6.769},{"text":"it's a habit.","startTime":6.9,"finishTime":7.659},{"text":"We begin with our housekeeping program,","startTime":8.369,"finishTime":10.449},{"text":"which relies on a partnership between","startTime":10.689,"finishTime":12.568999999999999},{"text":"management commitment and employee support.","startTime":12.568999999999999,"finishTime":14.89},{"text":"We use the 5S methodology","startTime":15.67,"finishTime":17.889},{"text":"sort,","startTime":18.19,"finishTime":18.629},{"text":"set in order,","startTime":18.989,"finishTime":19.77},{"text":"shine,","startTime":19.989,"finishTime":20.62},{"text":"and standardize","startTime":20.79,"finishTime":21.969},{"text":"to eliminate clutter and hazards.","startTime":22.27,"finishTime":24.11},{"text":"Our goal is to sustain these habits through continuous training and evaluation,","startTime":24.86,"finishTime":29.479},{"text":"creating an environment where excellence is the standard.","startTime":29.899,"finishTime":32.639},{"text":"Effective housekeeping directly prevents our most significant risks.","startTime":34.22,"finishTime":38.279},{"text":"In electrical safety,","startTime":38.58,"finishTime":39.9},{"text":"we must stay vigilant for red flags like tripped breakers,","startTime":40.139,"finishTime":43.729},{"text":"warm equipment,","startTime":44.02,"finishTime":44.909},{"text":"or worn insulation.","startTime":45.06,"finishTime":46.22},{"text":"These issues are often the primary heat source in the fire triangle.","startTime":47.18,"finishTime":50.61},{"text":"By understanding that fire requires fuel,","startTime":51.299,"finishTime":53.58},{"text":"oxygen,","startTime":53.729,"finishTime":54.25},{"text":"and heat,","startTime":54.299,"finishTime":55},{"text":"we can break the triangle.","startTime":55.22,"finishTime":56.729},{"text":"Proper housekeeping removes the fuel,","startTime":57.139,"finishTime":59.259},{"text":"clutter,","startTime":59.34,"finishTime":60.09},{"text":"while electrical maintenance removes the heat.","startTime":60.34,"finishTime":62.54},{"text":"If we prevent these elements from meeting,","startTime":63.22,"finishTime":65.29},{"text":"we prevent the outbreak.","startTime":65.529,"finishTime":66.639},{"text":"When moving through our workspace,","startTime":67.989,"finishTime":69.66},{"text":"we apply the art of material handling","startTime":69.91,"finishTime":72.19},{"text":"to protect your back.","startTime":72.51,"finishTime":73.629},{"text":"Always bend at the knees,","startTime":73.79,"finishTime":75.29},{"text":"keep the load close,","startTime":75.55,"finishTime":76.489},{"text":"and avoid twisting.","startTime":76.79,"finishTime":77.91},{"text":"This care extends to our storage rooms.","startTime":78.599,"finishTime":81.139},{"text":"All materials must be properly labeled and ventilated","startTime":81.48,"finishTime":84.54},{"text":"with heavy items stored at safe heights.","startTime":84.9,"finishTime":87.239},{"text":"Most importantly,","startTime":87.989,"finishTime":88.98},{"text":"storage areas must never obstruct emergency equipment or exit paths.","startTime":89.15,"finishTime":93.47},{"text":"Despite our best prevention,","startTime":94.76,"finishTime":96.44},{"text":"readiness is essential.","startTime":96.709,"finishTime":98.26},{"text":"We distinguish between a localized emergency and a large scale disaster","startTime":98.68,"finishTime":102.94},{"text":"such as a natural event.","startTime":103.279,"finishTime":104.47},{"text":"In either case,","startTime":105.19,"finishTime":106.11},{"text":"our evacuation plan is your roadmap.","startTime":106.309,"finishTime":108.5},{"text":"Familiarize yourself with primary routes and the locations of first aid stations.","startTime":109.33,"finishTime":113.73},{"text":"We don't just plan,","startTime":114.449,"finishTime":115.76},{"text":"we prepare through training and practice through drills.","startTime":116.08,"finishTime":118.83},{"text":"Every workplace must be prepared.","startTime":119.169,"finishTime":121.25},{"text":"By participating in our fire and evacuation drills at least twice a year,","startTime":121.94,"finishTime":125.93},{"text":"we ensure that every employee knows exactly how to respond.","startTime":126.29,"finishTime":129.36},{"text":"Safety starts with prevention,","startTime":131.119,"finishTime":132.619},{"text":"but it succeeds through preparation.","startTime":133.08,"finishTime":135.139},{"text":"Thank you for doing your part.","startTime":135.639,"finishTime":136.949}]}},"7heM2yvYXMBLQruNf":{"_id":"7heM2yvYXMBLQruNf","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":8635206,"uploadedFileName":"Safety in Material Handling​ 1.0.mp4","duration":65.123991,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-15T08:47:46.039Z","dateModified":"2026-05-15T08:47:46.039Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"2fRje4zizsnWWbwP9","thumbnail":"kXR9FeZivxPeEbKbx","videoSD":"v4g8jE8psWzvWkYAj","captionData":{"status":"success","captions":[{"text":"Safety and material handling.","startTime":0.72,"finishTime":2.18},{"text":"Material handling is more than just moving boxes.","startTime":3.16,"finishTime":6.53},{"text":"It is the art of lifting,","startTime":6.88,"finishTime":8.189},{"text":"placing,","startTime":8.359,"finishTime":8.96},{"text":"storing,","startTime":9.079,"finishTime":9.739},{"text":"and moving materials with precision.","startTime":9.949,"finishTime":11.92},{"text":"When done incorrectly,","startTime":12.76,"finishTime":14},{"text":"it is a leading cause of musculoskeletal injuries.","startTime":14.25,"finishTime":17.129},{"text":"When done right,","startTime":17.85,"finishTime":18.809},{"text":"it protects your long-term health.","startTime":19.1,"finishTime":20.68},{"text":"To lift safely,","startTime":22.489,"finishTime":23.53},{"text":"follow these fundamental steps to protect your spine.","startTime":23.84,"finishTime":26.45},{"text":"The approach","startTime":27.11,"finishTime":28.11},{"text":"get as close to the load as possible.","startTime":28.549,"finishTime":30.409},{"text":"The bend,","startTime":31.27,"finishTime":32.09},{"text":"sink at the hips and knees,","startTime":32.27,"finishTime":33.869},{"text":"never the waist.","startTime":34.15,"finishTime":35.029},{"text":"The grip","startTime":35.779,"finishTime":36.52},{"text":"ensure a firm,","startTime":37.06,"finishTime":37.709},{"text":"secure hold on the object.","startTime":37.74,"finishTime":39.159},{"text":"The lift,","startTime":40.229,"finishTime":41},{"text":"keep your back upright and the load close to your body.","startTime":41.43,"finishTime":44.45},{"text":"Use the power of your legs to rise in a smooth,","startTime":44.909,"finishTime":47.43},{"text":"controlled motion.","startTime":47.709,"finishTime":48.61},{"text":"The move,","startTime":49.029,"finishTime":49.81},{"text":"avoid twisting your torso.","startTime":50.229,"finishTime":51.889},{"text":"If you need to turn,","startTime":52.189,"finishTime":53.13},{"text":"move your feet.","startTime":53.47,"finishTime":54.189},{"text":"By mastering these techniques,","startTime":55.79,"finishTime":57.43},{"text":"you aren't just moving materials,","startTime":57.669,"finishTime":59.38},{"text":"you're moving safely.","startTime":59.669,"finishTime":61.139},{"text":"Remember,","startTime":61.47,"finishTime":62.11},{"text":"your back has a memory.","startTime":62.43,"finishTime":63.709}]}},"8x39ytKwcQ4uKL3Xb":{"_id":"8x39ytKwcQ4uKL3Xb","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":15465293,"uploadedFileName":"Why OSH Matters 1.0.mp4","duration":66.306,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-19T02:33:46.146Z","dateModified":"2026-05-19T02:33:46.146Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"gHYH7Nh5QbZBLctoP","thumbnail":"N6GYT6NzC9wnwyWRm","videoSD":"MnuxeMGwwBHc5uFen","captionData":{"status":"success","captions":[{"text":"Why occupational safety and health matters.","startTime":0.67,"finishTime":3.19},{"text":"Even though we work in offices and deal mostly with technology,","startTime":3.589,"finishTime":6.98},{"text":"risks still exist","startTime":7.309,"finishTime":8.729},{"text":"electrical overload,","startTime":9.189,"finishTime":10.229},{"text":"poor ergonomics,","startTime":10.51,"finishTime":11.659},{"text":"trip hazards from cables,","startTime":12.029,"finishTime":13.55},{"text":"stress during high pressure incidents,","startTime":14.029,"finishTime":15.818999999999999},{"text":"and emergencies like earthquakes.","startTime":16.11,"finishTime":17.829},{"text":"Every employee has the right to a safe workplace,","startTime":18.639,"finishTime":21.29},{"text":"and every one of us plays a role in maintaining it.","startTime":21.61,"finishTime":23.93},{"text":"What is occupational safety and health?","startTime":25.129,"finishTime":27.29},{"text":"Occupational safety and health","startTime":28.1,"finishTime":29.87},{"text":"focuses on identifying hazards","startTime":30.059,"finishTime":32.159},{"text":"and putting controls in place to prevent injuries,","startTime":32.299,"finishTime":34.849},{"text":"illness,","startTime":35.09,"finishTime":35.599},{"text":"or damage.","startTime":35.659,"finishTime":36.36},{"text":"In our environment,","startTime":37.52,"finishTime":38.59},{"text":"this means ensuring safe workstations,","startTime":38.68,"finishTime":40.99},{"text":"managing electrical risks,","startTime":41.36,"finishTime":42.979},{"text":"maintaining clear walkways,","startTime":43.279,"finishTime":44.709},{"text":"and being prepared for emergencies.","startTime":44.84,"finishTime":46.639},{"text":"In the Philippines,","startTime":47.99,"finishTime":48.939},{"text":"workplace safety is guided by the labor code,","startTime":49.069,"finishTime":51.5},{"text":"the occupational Safety and Health Standards,","startTime":51.83,"finishTime":54.099},{"text":"and Republic Act 11058.","startTime":54.43,"finishTime":56.95},{"text":"These laws require employers to provide safe working conditions","startTime":57.79,"finishTime":61.52},{"text":"and ensure employees are informed,","startTime":61.709,"finishTime":63.509},{"text":"trained,","startTime":63.869,"finishTime":64.36},{"text":"and protected from hazards.","startTime":64.43,"finishTime":65.91}]}},"AW5axDjeWm5mJFrTG":{"_id":"AW5axDjeWm5mJFrTG","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":1756384,"uploadedFileName":"Recap Causes of Accidents 1.0.mp4","duration":19.872993,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-15T01:20:33.467Z","dateModified":"2026-05-15T01:20:33.467Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"CW3czewToH86P3ysN","thumbnail":"7m8MpfAFzodbgyn5n","videoSD":"KZ789fNTxJrteAdkG","captionData":{"status":"success","captions":[{"text":"Let's recap what we have learned.","startTime":0.33,"finishTime":1.97},{"text":"Accidents and injuries result to losses of lives,","startTime":2.839,"finishTime":5.599},{"text":"time,","startTime":5.84,"finishTime":6.05},{"text":"and property.","startTime":6.09,"finishTime":6.829},{"text":"Most accidents at work could have been prevented.","startTime":7.719,"finishTime":10.56},{"text":"Every workplace has different hazards,","startTime":10.92,"finishTime":12.949},{"text":"risk and level of exposure,","startTime":13.199,"finishTime":14.939},{"text":"as well as OSH response to risk classification.","startTime":15.239,"finishTime":18.319}]}},"DTcYdCJAwGnmcsknE":{"_id":"DTcYdCJAwGnmcsknE","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":19221039,"uploadedFileName":"Storage Room Requirements​​ 1.0-2.mp4","duration":64.219002,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-22T09:57:21.652Z","dateModified":"2026-05-22T09:57:21.652Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"oDCuBWvafwZasoqpD","thumbnail":"ZDXQRCLNGcKwrZwQE","videoSD":"4MvnrutxtYZzgrpoD","captionData":{"status":"success","captions":[{"text":"Storage room requirements.","startTime":0.46,"finishTime":1.8599999999999999},{"text":"Our storage areas are the backbone of our inventory,","startTime":2.92,"finishTime":5.86},{"text":"but they must be managed with strict safety standards.","startTime":6.079,"finishTime":9.1},{"text":"Proper storage is where the 5S methodology meets active hazard prevention.","startTime":9.6,"finishTime":13.84},{"text":"We maintain a safe and compliant storage environment","startTime":14.579,"finishTime":17.229},{"text":"by adhering to these 4 core standards.","startTime":17.229,"finishTime":19.469},{"text":"Organization and ventilation","startTime":20.37,"finishTime":22.329},{"text":"materials must be properly arranged and ventilated","startTime":22.95,"finishTime":25.76},{"text":"to prevent heat buildup or chemical fumes.","startTime":25.76,"finishTime":27.92},{"text":"Labeling and signage,","startTime":28.729,"finishTime":30.069},{"text":"every item must be clearly labeled,","startTime":30.389,"finishTime":32.47},{"text":"especially hazards.","startTime":33.09,"finishTime":34.049},{"text":"Warning signs must be visible to everyone entering the area.","startTime":34.9,"finishTime":37.919},{"text":"Equipment and handling.","startTime":39.389,"finishTime":40.849},{"text":"Use the right material handling equipment.","startTime":41.229,"finishTime":43.65},{"text":"Never manually lift items that exceed height or weight safety limits.","startTime":44.069,"finishTime":47.79},{"text":"Housekeeping.","startTime":49.209,"finishTime":50.15},{"text":"The area must stay free of debris that causes tripping,","startTime":50.45,"finishTime":53.209},{"text":"fire,","startTime":53.4,"finishTime":53.659},{"text":"or pest infestation.","startTime":53.77,"finishTime":55.189},{"text":"Materials must never obstruct emergency equipment,","startTime":55.759,"finishTime":58.529},{"text":"fire extinguishers,","startTime":58.779,"finishTime":59.77},{"text":"or exit paths.","startTime":59.869,"finishTime":60.97}]}},"Ed9ncrhv9DnwBTELR":{"_id":"Ed9ncrhv9DnwBTELR","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":15207652,"uploadedFileName":"Fire Safety​ 1.0-2.mp4","duration":135.790998,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-22T09:59:15.822Z","dateModified":"2026-05-22T09:59:15.822Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"rvEuYR24urh47q2cP","thumbnail":"hHgSTrqhEABAwRk6n","videoSD":"ZMsM4Ynp5iBq2w8oq","captionData":{"status":"success","captions":[{"text":"The science of fire safety.","startTime":0.49,"finishTime":2.009},{"text":"While housekeeping and electrical maintenance prevent the conditions for a fire,","startTime":2.99,"finishTime":6.889},{"text":"understanding fire itself is our best defense.","startTime":7.51,"finishTime":10.01},{"text":"Fire is a rapid chemical reaction,","startTime":10.63,"finishTime":12.8},{"text":"oxidation","startTime":12.989,"finishTime":14.05},{"text":"that creates the light and heat we see.","startTime":14.189,"finishTime":16.29},{"text":"To understand how a fire starts and more importantly how to stop it,","startTime":17.34,"finishTime":22.03},{"text":"we look at the fire triangle.","startTime":22.309,"finishTime":23.989},{"text":"For a fire to exist,","startTime":24.389,"finishTime":25.53},{"text":"these three elements must react together.","startTime":25.95,"finishTime":28.53},{"text":"Fuel.","startTime":29.11,"finishTime":29.909},{"text":"This is any combustible material","startTime":30.27,"finishTime":32.27},{"text":"from paper and wood to chemicals and gasses.","startTime":32.549,"finishTime":35.27},{"text":"Oxygen.","startTime":36.189,"finishTime":37.22},{"text":"This supports the chemical process.","startTime":37.659,"finishTime":39.619},{"text":"It combines with the fuel to allow combustion to occur.","startTime":39.86,"finishTime":42.979},{"text":"Heat,","startTime":43.54,"finishTime":44.11},{"text":"this is the energy required to raise the","startTime":44.419,"finishTime":46.419},{"text":"temperature of the fuel to its ignition point.","startTime":46.419,"finishTime":48.47},{"text":"In an OSH context,","startTime":49.569,"finishTime":51.439},{"text":"our goal is simple","startTime":51.61,"finishTime":52.77},{"text":"break the triangle.","startTime":53.29,"finishTime":54.47},{"text":"If you remove just one of these elements","startTime":54.88,"finishTime":57.069},{"text":"by cooling the heat,","startTime":57.25,"finishTime":58.36},{"text":"smothering the oxygen,","startTime":58.569,"finishTime":59.81},{"text":"or removing the fuel,","startTime":59.97,"finishTime":61.31},{"text":"the fire cannot survive.","startTime":61.689,"finishTime":63.479},{"text":"Prevention means keeping these three components far apart.","startTime":63.849,"finishTime":66.889},{"text":"Knowing the triangle helps you choose the right response in an emergency.","startTime":67.779,"finishTime":71.489},{"text":"Stay alert,","startTime":71.9,"finishTime":72.589},{"text":"respect the science.","startTime":72.94,"finishTime":73.79},{"text":"Understanding fire classifications and fuel sources.","startTime":74.72,"finishTime":77.68},{"text":"Class A.","startTime":77.989,"finishTime":78.849},{"text":"Common combustibles","startTime":79.199,"finishTime":80.5},{"text":"wood,","startTime":80.72,"finishTime":81.199},{"text":"fabric,","startTime":81.36,"finishTime":81.959},{"text":"paper,","startTime":82.169,"finishTime":82.61},{"text":"plastic,","startTime":82.79,"finishTime":83.4},{"text":"and rubber.","startTime":83.48,"finishTime":84.389},{"text":"Class B","startTime":84.79,"finishTime":85.599},{"text":"flammable liquids and gasses,","startTime":85.989,"finishTime":87.879},{"text":"propane,","startTime":88.269,"finishTime":88.79},{"text":"solvents,","startTime":89,"finishTime":89.589},{"text":"oils,","startTime":89.72,"finishTime":90.12},{"text":"and alcohol.","startTime":90.16,"finishTime":91.22},{"text":"Class C,","startTime":91.629,"finishTime":92.599},{"text":"electrical equipment,","startTime":93,"finishTime":93.839},{"text":"computers,","startTime":94.16,"finishTime":94.639},{"text":"printers,","startTime":94.8,"finishTime":95.44},{"text":"and live appliances.","startTime":95.599,"finishTime":97.129},{"text":"Class D,","startTime":97.51,"finishTime":98.319},{"text":"combustible metals,","startTime":98.48,"finishTime":99.629},{"text":"magnesium,","startTime":99.839,"finishTime":100.55},{"text":"titanium,","startTime":100.72,"finishTime":101.519},{"text":"sodium,","startTime":101.839,"finishTime":102.419},{"text":"lithium,","startTime":102.599,"finishTime":103.199},{"text":"and potassium.","startTime":103.4,"finishTime":104.239},{"text":"Class K","startTime":105.04,"finishTime":105.879},{"text":"cooking media,","startTime":106.239,"finishTime":106.989},{"text":"cooking oils,","startTime":107.16,"finishTime":108},{"text":"animal fats,","startTime":108.199,"finishTime":108.989},{"text":"and vegetable fats.","startTime":109.16,"finishTime":110.239},{"text":"Importance of fire safety.","startTime":111.569,"finishTime":113.269},{"text":"Life safety.","startTime":114.139,"finishTime":115.12},{"text":"The primary goal of fire safety is to protect people from injury","startTime":115.54,"finishTime":119.279},{"text":"and to prevent loss of life.","startTime":119.379,"finishTime":120.959},{"text":"Property protection","startTime":122.37,"finishTime":123.519},{"text":"The secondary goal is to prevent property damage.","startTime":124.279,"finishTime":126.98},{"text":"Protection of operations.","startTime":128.559,"finishTime":130.119},{"text":"Preventing fires can assure that operations will continue.","startTime":131.22,"finishTime":134.41}]}},"JWyaPg7sDQxj2yBpn":{"_id":"JWyaPg7sDQxj2yBpn","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":15775178,"uploadedFileName":"Understanding Workplace Hazards​ 1.0-2.mp4","duration":97.978,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-18T02:35:41.987Z","dateModified":"2026-05-18T02:35:41.987Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"YypH8MGbPf8EK7u2W","thumbnail":"47d9zi9Q436FGwwv9","videoSD":"sGqctxK9eqfqLDRZv","captionData":{"status":"success","captions":[{"text":"Understanding workplace hazards.","startTime":1.47,"finishTime":3.269},{"text":"To master our basic safety rules and measures,","startTime":5.949,"finishTime":8.699},{"text":"we must first understand exactly what we are protecting ourselves against.","startTime":8.989,"finishTime":12.949},{"text":"Hazards in the workplace generally fall into two main groups","startTime":13.789,"finishTime":17.299},{"text":"safety hazards","startTime":17.719,"finishTime":18.659},{"text":"and health hazards.","startTime":18.84,"finishTime":19.879},{"text":"Safety hazards are those that cause immediate physical injury.","startTime":22.18,"finishTime":25.52},{"text":"These directly relate to our core rules","startTime":25.94,"finishTime":28.42},{"text":"poor housekeeping and material handling,","startTime":28.739,"finishTime":30.809},{"text":"leading causes of trips,","startTime":31.139,"finishTime":32.54},{"text":"falls,","startTime":32.819,"finishTime":33.25},{"text":"and back injuries.","startTime":33.34,"finishTime":34.34},{"text":"Electricity and fire,","startTime":35.069,"finishTime":36.599},{"text":"high risk hazards that require constant vigilance,","startTime":36.95,"finishTime":39.93},{"text":"as shown by our frayed wire and fire triangle diagrams.","startTime":40.11,"finishTime":43.43},{"text":"Use of machines.","startTime":43.909,"finishTime":45.13},{"text":"Always ensure guards are in place and proper procedures are followed.","startTime":45.549,"finishTime":49.189},{"text":"Health hazards are often less visible,","startTime":49.99,"finishTime":52.209},{"text":"but just as dangerous,","startTime":52.389,"finishTime":53.729},{"text":"affecting your body over time.","startTime":54.15,"finishTime":55.63},{"text":"Chemical and biological,","startTime":56.43,"finishTime":58.279},{"text":"avoiding harmful vapors,","startTime":58.669,"finishTime":60.11},{"text":"dusts,","startTime":60.25,"finishTime":60.869},{"text":"and viruses.","startTime":61.029,"finishTime":61.9},{"text":"Physical,","startTime":62.689,"finishTime":63.45},{"text":"managing exposure to extreme noise,","startTime":63.77,"finishTime":66.01},{"text":"temperature,","startTime":66.29,"finishTime":66.889},{"text":"or radiation.","startTime":67.069,"finishTime":67.989},{"text":"Ergonomics.","startTime":69.05,"finishTime":70.309},{"text":"This ties back to our lifting technique,","startTime":70.73,"finishTime":72.889},{"text":"avoiding improper procedures and poor visual","startTime":73.37,"finishTime":76.05},{"text":"conditions to prevent long-term strain.","startTime":76.05,"finishTime":77.91},{"text":"Whether it's an immediate safety risk or a long-term health hazard,","startTime":78.83,"finishTime":82.43},{"text":"the goal remains the same","startTime":82.79,"finishTime":84.29},{"text":"identify,","startTime":84.75,"finishTime":85.769},{"text":"control,","startTime":86.309,"finishTime":86.86},{"text":"and sustain.","startTime":87.15,"finishTime":88.01},{"text":"By following the 5S system and our basic safety measures,","startTime":88.989,"finishTime":92.459},{"text":"we neutralize these categories before they can cause harm.","startTime":92.86,"finishTime":95.949}]}},"LbeWX7kuezDPd5j2H":{"_id":"LbeWX7kuezDPd5j2H","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":15029400,"uploadedFileName":"CAUSES OF ACCIDENTS 1.1.mp4","duration":83,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-04-20T23:09:05.002Z","dateModified":"2026-04-20T23:09:05.002Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"pXhxZwXoPYvJBwvnN","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"R4AvuGXc2fXzhHyzm","thumbnail":"WdSrm8qxCohiPDBDe","videoSD":"LEHjs4XB7QqiguJuG","captionData":{"status":"success","captions":[{"text":"Causes of accidents.","startTime":0.579,"finishTime":2.049},{"text":"Accidents rarely happen because of bad luck.","startTime":2.38,"finishTime":4.78},{"text":"They usually result from unsafe conditions,","startTime":5.099,"finishTime":7.489},{"text":"unsafe actions,","startTime":7.579,"finishTime":8.689},{"text":"or gaps in processes.","startTime":8.859,"finishTime":10.56},{"text":"For example,","startTime":11.06,"finishTime":11.77},{"text":"using overloaded extension cords,","startTime":11.979,"finishTime":14.039},{"text":"ignoring warning signs,","startTime":14.26,"finishTime":15.689},{"text":"or working while fatigued can increase risk.","startTime":15.899000000000001,"finishTime":18.52},{"text":"Unsafe acts versus unsafe conditions.","startTime":19.059,"finishTime":21.42},{"text":"An unsafe act is something we do","startTime":22.03,"finishTime":24.209},{"text":"like the following","startTime":24.35,"finishTime":25.53},{"text":"unauthorized use of equipment,","startTime":25.87,"finishTime":27.75},{"text":"removing safety devices,","startTime":27.909,"finishTime":29.53},{"text":"using defective equipment,","startTime":29.709,"finishTime":31.229},{"text":"improper use of PPE,","startTime":31.469,"finishTime":33.069},{"text":"and horseplay.","startTime":33.31,"finishTime":34.069},{"text":"These are considered unhealthy acts","startTime":34.59,"finishTime":36.97},{"text":"smoking in the workplace,","startTime":37.27,"finishTime":38.759},{"text":"inhaling organic solvents,","startTime":38.95,"finishTime":40.79},{"text":"drinking alcoholic beverages during work hours,","startTime":41.15,"finishTime":43.77},{"text":"and taking illegal drugs inside company premises.","startTime":44.069,"finishTime":47.069},{"text":"An unsafe condition is something in our environment.","startTime":47.7,"finishTime":50.799},{"text":"Examples are","startTime":51.22,"finishTime":52.36},{"text":"defective tools or equipment,","startTime":52.619,"finishTime":54.659},{"text":"blocked exit,","startTime":55.02,"finishTime":56.04},{"text":"inadequate warning signs,","startTime":56.299,"finishTime":57.81},{"text":"slippery floors,","startTime":58.099,"finishTime":59.34},{"text":"hazardous condition.","startTime":59.54,"finishTime":60.84},{"text":"Meanwhile,","startTime":61.599,"finishTime":62.22},{"text":"the following are considered unhealthy conditions","startTime":62.4,"finishTime":65.129},{"text":"excessive noise,","startTime":65.459,"finishTime":66.66},{"text":"inadequate ventilation,","startTime":66.879,"finishTime":68.269},{"text":"extreme temperature.","startTime":68.72,"finishTime":69.569},{"text":"In an office setting,","startTime":70.33,"finishTime":71.48},{"text":"examples include running network cables across walkways,","startTime":71.849,"finishTime":75.19},{"text":"improper workstation set up leading to strain,","startTime":75.37,"finishTime":77.879},{"text":"or leaving equipment overheating without reporting it.","startTime":78.209,"finishTime":80.73}]}},"R5qMkbSMZMQT3Hr4W":{"_id":"R5qMkbSMZMQT3Hr4W","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":36163180,"uploadedFileName":"Housekeeping​​ 1.0-2.mp4","duration":162.292,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-22T09:58:03.620Z","dateModified":"2026-05-22T09:58:03.620Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"nZdoYF5bc242frFvx","thumbnail":"yNZqony5R2eMZbyYn","videoSD":"hoaEMC3nFaKpreKdE","captionData":{"status":"success","captions":[{"text":"Signs of poor housekeeping.","startTime":0.009,"finishTime":1.49},{"text":"To maintain a safe environment,","startTime":2.89,"finishTime":4.489},{"text":"we first need to recognize what unsafe looks like.","startTime":4.659,"finishTime":7.519},{"text":"Poor housekeeping isn't just messy,","startTime":7.9399999999999995,"finishTime":9.8},{"text":"it's a major accident waiting to happen.","startTime":9.979,"finishTime":11.979},{"text":"Identifying the risks.","startTime":14.27,"finishTime":15.89},{"text":"Take a look at this storage area.","startTime":16.389,"finishTime":17.969},{"text":"It hits almost every red flag on our list","startTime":18.229,"finishTime":20.809},{"text":"blocked aisleways and poor arrangement.","startTime":21.27,"finishTime":23.54},{"text":"When items are scattered,","startTime":23.86,"finishTime":25.059},{"text":"we lose our evacuation routes and create trip hazards.","startTime":25.19,"finishTime":28.389},{"text":"Dangerous storage.","startTime":29.319,"finishTime":30.52},{"text":"Notice the overflowing shelves and items stacked precariously.","startTime":30.959,"finishTime":34.779},{"text":"This is a high risk for struck by injuries.","startTime":35.2,"finishTime":37.599},{"text":"Dirt and disuse","startTime":38.36,"finishTime":39.63},{"text":"items gathering dust and dirty floors aren't just an eyesore.","startTime":39.909,"finishTime":43.65},{"text":"They hide leaks,","startTime":43.919,"finishTime":44.869},{"text":"spills,","startTime":45.02,"finishTime":45.659},{"text":"and electrical hazards.","startTime":45.83,"finishTime":47.069},{"text":"Unnecessary items.","startTime":47.799,"finishTime":49.259},{"text":"If it isn't needed for the job,","startTime":49.639,"finishTime":51.319},{"text":"it shouldn't be in the work area.","startTime":51.4,"finishTime":53.22},{"text":"Tools left out and a lack of waste bins lead to a chaotic,","startTime":53.77,"finishTime":57.08},{"text":"dangerous flow.","startTime":57.159,"finishTime":58.24},{"text":"The hidden dangers","startTime":58.479,"finishTime":59.819},{"text":"beyond what we see,","startTime":60.2,"finishTime":61.18},{"text":"we must look for what we can't always see at a glance","startTime":61.36,"finishTime":64.36},{"text":"the presence of spills and leaks.","startTime":64.638,"finishTime":66.93},{"text":"A single ignored leak is the fastest way to a slip and fall injury.","startTime":67.239,"finishTime":71.22},{"text":"Housekeeping program","startTime":72.379,"finishTime":73.589},{"text":"Housekeeping is the backbone of occupational safety and health.","startTime":75.91,"finishTime":79.669},{"text":"It's the first line of defense against the most common workplace injuries","startTime":79.989,"finishTime":83.93},{"text":"slips,","startTime":84.11,"finishTime":84.809},{"text":"trips,","startTime":85.029,"finishTime":85.5},{"text":"and falls.","startTime":85.629,"finishTime":86.69},{"text":"A structured program doesn't just clean the floor,","startTime":86.989,"finishTime":89.87},{"text":"it identifies hazards before they become accidents.","startTime":90.069,"finishTime":92.79},{"text":"The program pillars.","startTime":93.79,"finishTime":95.25},{"text":"Our success relies on five critical elements","startTime":95.629,"finishTime":98.61},{"text":"management and employee synergy.","startTime":98.91,"finishTime":100.98},{"text":"Safety is a top-down commitment and a bottom-up execution.","startTime":101.43,"finishTime":105.11},{"text":"5S policies.","startTime":105.629,"finishTime":107.239},{"text":"We don't just tidy up,","startTime":107.589,"finishTime":109.069},{"text":"we follow a documented system,","startTime":109.23,"finishTime":111.089},{"text":"continuous training.","startTime":111.5,"finishTime":112.73},{"text":"We ensure every team member knows the safety standards,","startTime":112.949,"finishTime":116.129},{"text":"evaluation and recognition.","startTime":116.389,"finishTime":118.25},{"text":"We audit for compliance and reward for excellence.","startTime":118.589,"finishTime":121.389},{"text":"The 5S execution.","startTime":122.379,"finishTime":124.04},{"text":"We live by the 5s cycle.","startTime":124.419,"finishTime":126.05},{"text":"Sort.","startTime":126.3,"finishTime":126.93},{"text":"Remove what's unnecessary to clear the path.","startTime":127.3,"finishTime":129.74},{"text":"Set in order.","startTime":130.179,"finishTime":131.169},{"text":"Organize what's left for efficient,","startTime":131.539,"finishTime":133.179},{"text":"safe access.","startTime":133.339,"finishTime":134.399},{"text":"Shine.","startTime":134.82,"finishTime":135.47},{"text":"Clean to inspect.","startTime":135.699,"finishTime":136.71},{"text":"Finding leaks or cracks early.","startTime":136.979,"finishTime":138.8},{"text":"Standardize.","startTime":139.38,"finishTime":140.339},{"text":"Make these rules the new normal.","startTime":140.66,"finishTime":142.429},{"text":"Sustain","startTime":142.699,"finishTime":143.58},{"text":"the most vital step.","startTime":143.82,"finishTime":145.339},{"text":"We maintain the discipline every shift.","startTime":145.74,"finishTime":147.899},{"text":"An organized workplace is a safe workplace.","startTime":149.429,"finishTime":152.25},{"text":"By sustaining our housekeeping program,","startTime":152.589,"finishTime":154.589},{"text":"we protect our health,","startTime":154.789,"finishTime":156.029},{"text":"our equipment,","startTime":156.149,"finishTime":156.949},{"text":"and each other.","startTime":157.11,"finishTime":158.05},{"text":"Safety is a habit.","startTime":158.71,"finishTime":159.839},{"text":"Let's keep it strong.","startTime":160.029,"finishTime":160.929}]}},"Su9o7LDL669Mh2BNE":{"_id":"Su9o7LDL669Mh2BNE","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":11806584,"uploadedFileName":"Emergency Plan​​​​ 1.0.mp4","duration":70.692993,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-18T03:12:02.917Z","dateModified":"2026-05-18T03:12:02.917Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"PZJzDELTjcgbdeLTz","thumbnail":"ZuwFpcTB9y676uiPc","videoSD":"hPaQHyotpQoQEfnkk","captionData":{"status":"success","captions":[{"text":"Emergency plan","startTime":0.73,"finishTime":1.75},{"text":"Having a plan is the difference between organized action and total chaos.","startTime":3.319,"finishTime":7.619},{"text":"Every workplace must have a documented manual","startTime":8.319,"finishTime":11.069},{"text":"that outlines exactly what to do when an emergency strikes.","startTime":11.21,"finishTime":14.72},{"text":"If it isn't written down,","startTime":15.17,"finishTime":16.309},{"text":"it isn't a plan.","startTime":16.649,"finishTime":17.61},{"text":"But a manual is just paper without people.","startTime":18.739,"finishTime":21.12},{"text":"We identify and mobilize a dedicated emergency response team,","startTime":21.489,"finishTime":25.069},{"text":"ERT.","startTime":25.27,"finishTime":26.25},{"text":"These are the leaders on the floor who stay calm when things get loud.","startTime":26.95,"finishTime":30.09},{"text":"Our response is divided into specialized roles to ensure nothing is missed.","startTime":32.06,"finishTime":36.47},{"text":"The fire brigade,","startTime":36.849,"finishTime":37.939},{"text":"our first line of defense for fire suppression and evacuation.","startTime":38.209,"finishTime":41.61},{"text":"The safety committee,","startTime":42.439,"finishTime":43.56},{"text":"the group responsible for auditing risks and keeping our policies up to date,","startTime":43.919,"finishTime":48.02},{"text":"the health and wellness team,","startTime":48.52,"finishTime":50.06},{"text":"our dedicated responders for immediate first aid","startTime":50.36,"finishTime":52.93},{"text":"and the continued well-being of every team member.","startTime":53.319,"finishTime":55.849},{"text":"Finally,","startTime":56.4,"finishTime":56.919},{"text":"we don't just assign titles,","startTime":57.04,"finishTime":58.79},{"text":"we provide specialized training","startTime":59.04,"finishTime":61.119},{"text":"from first aid to crisis management.","startTime":61.52,"finishTime":63.619},{"text":"We ensure our responders have the skills","startTime":63.83,"finishTime":65.839},{"text":"to protect themselves and their colleagues.","startTime":65.839,"finishTime":67.8}]}},"TZR2g8gG2KnLgcmiD":{"_id":"TZR2g8gG2KnLgcmiD","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":9828363,"uploadedFileName":"Evacuation Plan 1.0-2.mp4","duration":75.463991,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-22T09:59:45.927Z","dateModified":"2026-05-22T09:59:45.927Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"WN2c3pPTd3YhSoNDs","thumbnail":"xRRkSEMCqGFNGWtk7","videoSD":"TcgBmhyngzTyHmrLG","captionData":{"status":"success","captions":[{"text":"Evacuation plan","startTime":0.98,"finishTime":2.24},{"text":"Safety is a two-part strategy,","startTime":5.9,"finishTime":7.909},{"text":"prevention and action.","startTime":8.26,"finishTime":9.729},{"text":"We start with prevention by mastering our four core measures.","startTime":10.06,"finishTime":13.38},{"text":"5S,","startTime":13.739,"finishTime":14.119},{"text":"housekeeping,","startTime":15.02,"finishTime":15.88},{"text":"organizing our space to remove hazards.","startTime":16.18,"finishTime":18.42},{"text":"Electrical and fire safety,","startTime":19.17,"finishTime":21.03},{"text":"identifying risks like frayed wires and understanding the fire triangle.","startTime":21.29,"finishTime":25.43},{"text":"Material handling,","startTime":26.139,"finishTime":27.399},{"text":"protecting your body with proper lifting techniques.","startTime":27.899,"finishTime":30.299},{"text":"But when an emergency does occur,","startTime":32.4,"finishTime":33.99},{"text":"prevention shifts to action.","startTime":34.45,"finishTime":36.049},{"text":"Our evacuation plan is designed to ensure a calm,","startTime":36.83,"finishTime":39.56},{"text":"controlled exit.","startTime":39.88,"finishTime":40.599},{"text":"Familiarize yourself with the floor plan shown here.","startTime":41.47,"finishTime":44.25},{"text":"Notice the primary exit routes and the location of first aid stations.","startTime":44.83,"finishTime":48.68},{"text":"Training today ensures that during an actual emergency,","startTime":49.509,"finishTime":52.639},{"text":"you remain in control and move towards safety without hesitation.","startTime":52.869,"finishTime":56.389},{"text":"Know your role,","startTime":57.779,"finishTime":58.79},{"text":"know your route.","startTime":59.11,"finishTime":60.09},{"text":"By combining daily safety habits with a clear exit strategy,","startTime":60.54,"finishTime":63.99},{"text":"we keep ourselves and our colleagues protected.","startTime":64.309,"finishTime":66.589},{"text":"Safety is a habit.","startTime":67.47,"finishTime":68.66},{"text":"Emergency readiness is a must.","startTime":68.989,"finishTime":70.91}]}},"XA8zeFagZTibt5YFj":{"_id":"XA8zeFagZTibt5YFj","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":15182666,"uploadedFileName":"Special Trainings & Drills​ 1.0-2.mp4","duration":95.624,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-21T07:32:16.724Z","dateModified":"2026-05-21T07:32:16.724Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"4DFcDPHzWyKc3FqzC","thumbnail":"fqKP2SQHy39xEofcK","videoSD":"wgTpRRQx4DwapBZhy","captionData":{"status":"success","captions":[{"text":"Special trainings and drills.","startTime":0.91,"finishTime":2.44},{"text":"We've seen the red flags,","startTime":4.05,"finishTime":5.44},{"text":"blocked aisleways,","startTime":5.6899999999999995,"finishTime":6.889},{"text":"overflowing shelves,","startTime":7.01,"finishTime":8.199},{"text":"and tools left in work areas.","startTime":8.409,"finishTime":10.55},{"text":"These signs of poor housekeeping are more than just an eyesore.","startTime":10.949,"finishTime":14.409},{"text":"They are the primary catalysts for workplace accidents.","startTime":14.729,"finishTime":17.61},{"text":"But how do we move from a cluttered workspace to a safe one?","startTime":18.319,"finishTime":21.639},{"text":"Our solution is a structured housekeeping program powered by the 5S methodology.","startTime":22.76,"finishTime":27.77},{"text":"It's a continuous cycle that starts","startTime":28.129,"finishTime":29.93},{"text":"with management commitment and employee support.","startTime":29.93,"finishTime":32.63},{"text":"Sort and set in order.","startTime":33.169,"finishTime":34.669},{"text":"Eliminate what isn't needed and organize what is.","startTime":34.959,"finishTime":37.729},{"text":"Shine and standardize.","startTime":38.52,"finishTime":40.139},{"text":"Clean to inspect and set the new normal.","startTime":40.479,"finishTime":42.939},{"text":"Sustain.","startTime":43.56,"finishTime":44.2},{"text":"This is the most critical phase,","startTime":44.93,"finishTime":46.74},{"text":"turning these actions into daily habits.","startTime":47.159,"finishTime":49.279},{"text":"To ensure we can sustain this safety culture,","startTime":50.439,"finishTime":52.9},{"text":"we invest in special trainings and drills.","startTime":53.08,"finishTime":55.389},{"text":"We don't just talk about safety,","startTime":55.72,"finishTime":57.599},{"text":"we","startTime":58,"finishTime":58.74},{"text":"plan,","startTime":59.24,"finishTime":59.97},{"text":"conduct risk assessments,","startTime":60.4,"finishTime":61.79},{"text":"and define reporting procedures.","startTime":61.84,"finishTime":63.819},{"text":"Prepare,","startTime":64.15,"finishTime":64.8},{"text":"train on fire safety,","startTime":65.279,"finishTime":66.519},{"text":"hazardous materials,","startTime":66.68,"finishTime":67.949},{"text":"and first aid response.","startTime":68.16,"finishTime":69.699},{"text":"Practice.","startTime":70.199,"finishTime":71.139},{"text":"Perform regular fire and evacuation drills","startTime":71.519,"finishTime":74.22},{"text":"so that our response becomes second nature.","startTime":74.36,"finishTime":76.519},{"text":"Training and drills bridge the gap between knowing what a hazard looks like","startTime":77.43,"finishTime":81.11},{"text":"and knowing how to prevent it.","startTime":81.349,"finishTime":82.669},{"text":"When we master the plan,","startTime":83.519,"finishTime":84.849},{"text":"prepare,","startTime":85.169,"finishTime":85.489},{"text":"practice cycle,","startTime":85.69,"finishTime":86.72},{"text":"we ensure that housekeeping stays high and risks stay low.","startTime":87.05,"finishTime":90.87},{"text":"Safety is a skill.","startTime":91.449,"finishTime":92.389},{"text":"Let's keep practicing.","startTime":92.889,"finishTime":94.089}]}},"XESiw6eNGribGN4Wz":{"_id":"XESiw6eNGribGN4Wz","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":21143954,"uploadedFileName":"Legal Framework (PH) 1.1-2.mp4","duration":242.862,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-19T02:39:10.459Z","dateModified":"2026-05-19T02:39:10.459Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"WjbDw2NvJStdD2PxL","thumbnail":"bLGTcWH82He9Z8iMa","videoSD":"TcZdnd8mtufBwGBZz","captionData":{"status":"success","captions":[{"text":"Legal framework","startTime":0.66,"finishTime":1.72},{"text":"In the Philippines,","startTime":2.569,"finishTime":3.529},{"text":"workplace safety is governed by the labor code,","startTime":3.69,"finishTime":6.01},{"text":"OSH standards,","startTime":6.449,"finishTime":7.9399999999999995},{"text":"and Republic Act 11058.","startTime":8.13,"finishTime":10.568999999999999},{"text":"These laws ensure workers are protected","startTime":11.409,"finishTime":13.59},{"text":"and employers provide safe working conditions.","startTime":13.729,"finishTime":16.469},{"text":"RA 11058 reinforces the responsibility of organizations","startTime":17.12,"finishTime":21.95},{"text":"to maintain a safe workplace","startTime":22.17,"finishTime":23.829},{"text":"and gives employees the right to be informed,","startTime":24.01,"finishTime":26.049},{"text":"trained,","startTime":26.45,"finishTime":26.76},{"text":"and protected from hazards.","startTime":26.809,"finishTime":28.209},{"text":"It also emphasizes reporting and prevention.","startTime":29.09,"finishTime":31.45},{"text":"Workers' rights.","startTime":32.49,"finishTime":33.84},{"text":"As employees,","startTime":34.209,"finishTime":35.15},{"text":"you have the right to know workplace hazards,","startTime":35.25,"finishTime":37.56},{"text":"to receive training,","startTime":37.849,"finishTime":38.93},{"text":"to report unsafe conditions,","startTime":39.209,"finishTime":41.049},{"text":"and to refuse unsafe work when there is imminent danger.","startTime":41.409,"finishTime":44.77},{"text":"Workers' responsibilities.","startTime":45.729,"finishTime":47.569},{"text":"With these rights come responsibilities,","startTime":47.97,"finishTime":50.189},{"text":"following safety procedures,","startTime":50.49,"finishTime":52},{"text":"using equipment properly,","startTime":52.25,"finishTime":53.569},{"text":"reporting hazards,","startTime":53.93,"finishTime":54.799},{"text":"and participating in drills.","startTime":54.97,"finishTime":56.509},{"text":"OSH program","startTime":58.709,"finishTime":59.97},{"text":"Our safety program includes hazard identification,","startTime":60.779,"finishTime":63.569},{"text":"training,","startTime":63.86,"finishTime":64.5},{"text":"emergency preparedness,","startTime":64.76,"finishTime":66.139},{"text":"and continuous improvement.","startTime":66.419,"finishTime":67.739},{"text":"Everyone plays a role in making it effective.","startTime":68.66,"finishTime":70.86},{"text":"Health and Safety Committee.","startTime":108.699,"finishTime":109.98},{"text":"The safety officer and committee conducts meeting and training,","startTime":110.68,"finishTime":113.989},{"text":"help monitor safety conditions,","startTime":114.279,"finishTime":116.099},{"text":"investigate incidents,","startTime":116.559,"finishTime":117.75},{"text":"and ensure compliance.","startTime":118.04,"finishTime":119.36},{"text":"For establishments with less than 10 workers and low risk,","startTime":120.169,"finishTime":123.48},{"text":"this can be the composition of the health and safety committee,","startTime":123.809,"finishTime":126.809},{"text":"chairperson,","startTime":127.29,"finishTime":128.08},{"text":"owner or manager,","startTime":128.33,"finishTime":129.529},{"text":"secretary,","startTime":129.929,"finishTime":130.649},{"text":"safety officer in the workplace,","startTime":131.05,"finishTime":132.97},{"text":"member,","startTime":133.49,"finishTime":134.089},{"text":"at least one.","startTime":134.25,"finishTime":135.38},{"text":"The SO in the workplace may also be the owner,","startTime":135.77,"finishTime":138.49},{"text":"manager,","startTime":138.639,"finishTime":139.199},{"text":"or designated representative.","startTime":139.479,"finishTime":140.809},{"text":"Safety officer responsibilities includes","startTime":142.22,"finishTime":144.699},{"text":"oversee OS program management with the committee,","startTime":145.029,"finishTime":147.94},{"text":"monitor and inspect all operational health and safety aspects.","startTime":148.229,"finishTime":151.83},{"text":"Support government inspectors during safety audits.","startTime":152.6,"finishTime":155.169},{"text":"Safety officers should communicate the","startTime":156.22,"finishTime":157.979},{"text":"following during the OSH committee meeting","startTime":157.979,"finishTime":160.399},{"text":"company policies and OSH programs,","startTime":160.979,"finishTime":163.449},{"text":"administrative controls and safety issues.","startTime":163.82,"finishTime":166.339},{"text":"New standard operating procedures,","startTime":167.1,"finishTime":169.25},{"text":"SOPs.","startTime":169.259,"finishTime":170.139},{"text":"Committee and program roles.","startTime":170.91,"finishTime":172.41},{"text":"OSH audit results.","startTime":173.059,"finishTime":175.059},{"text":"Incident investigation reports,","startTime":175.69,"finishTime":177.679},{"text":"corrective actions in progress.","startTime":178.179,"finishTime":179.729},{"text":"Safety officer requirements.","startTime":181.039,"finishTime":182.83},{"text":"Experience,","startTime":183.119,"finishTime":184.199},{"text":"must meet all necessary training and professional experience requirements.","startTime":184.559,"finishTime":188.47},{"text":"Mandatory training,","startTime":189.229,"finishTime":190.529},{"text":"completion of the eight hour OSH orientation course,","startTime":190.949,"finishTime":194.449},{"text":"and the 2-hour trainer's training.","startTime":194.589,"finishTime":196.309},{"text":"Engagement","startTime":197.089,"finishTime":198.05},{"text":"shall manage safety programs and perform additional","startTime":198.36,"finishTime":201.25},{"text":"tasks as designated by the employer.","startTime":201.25,"finishTime":203.589},{"text":"But safety is not only their job,","startTime":204.33,"finishTime":206.399},{"text":"it's everyone's responsibility.","startTime":206.619,"finishTime":208.52},{"text":"If you notice anything unsafe,","startTime":208.899,"finishTime":210.639},{"text":"such as exposed cables,","startTime":210.94,"finishTime":212.49},{"text":"overheating equipment,","startTime":212.74,"finishTime":213.889},{"text":"or blocked exits,","startTime":214.02,"finishTime":215.21},{"text":"report it immediately.","startTime":215.699,"finishTime":217.05},{"text":"Early reporting prevents incidents.","startTime":217.419,"finishTime":219.279},{"text":"Let's recap.","startTime":220.759,"finishTime":221.869},{"text":"All establishments must comply with RA 11058 safety standards.","startTime":222.41,"finishTime":227.809},{"text":"Every person,","startTime":228.25,"finishTime":228.99},{"text":"from employers to workers,","startTime":229.33,"finishTime":230.86},{"text":"has a vital role to play.","startTime":231.009,"finishTime":232.669},{"text":"Shared commitment ensures our OSH program remains effective and successful.","startTime":233.289,"finishTime":237.91}]}},"XRhTTw8kYfEYgbsjt":{"_id":"XRhTTw8kYfEYgbsjt","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/quicktime","status":"online","fileSizeInBytes":652960,"uploadedFileName":"Intro.mov","duration":4.805011,"uploadedFileNameExtension":".mov"},"dates":{"dateCreated":"2026-05-19T03:58:46.808Z","dateModified":"2026-05-19T03:58:46.808Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"SqFPSP5YDPrMFcezC","thumbnail":"dF7FSgzgBZkQLdhth","videoSD":"eiEFXTbt46aj8WRF6","captionData":{"status":"success","captions":[]}},"Z3dZdjgkAAttiTYz9":{"_id":"Z3dZdjgkAAttiTYz9","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":33226386,"uploadedFileName":"Emergency and Disaster​​​ 1.2.mp4","duration":228.710998,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-18T03:04:18.307Z","dateModified":"2026-05-18T03:04:18.307Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"hRtTfBnwi6j5SS8Nw","thumbnail":"TLfjbRM3YcZc8TiPn","videoSD":"yfawzDAryEJHB6BpT","captionData":{"status":"success","captions":[{"text":"Emergency and disaster.","startTime":1,"finishTime":2.5},{"text":"While our basic safety rules and measures are designed to prevent daily accidents,","startTime":4.8,"finishTime":9.39},{"text":"we must also prepare for larger scale events.","startTime":9.72,"finishTime":12.319},{"text":"To respond correctly,","startTime":13.079,"finishTime":14.449},{"text":"we need to distinguish between an emergency and a disaster.","startTime":14.729,"finishTime":17.989},{"text":"An emergency is a serious,","startTime":19.299,"finishTime":21},{"text":"often localized situation","startTime":21.1,"finishTime":22.84},{"text":"that demands immediate action.","startTime":23.02,"finishTime":24.92},{"text":"Think of a small electrical fire or a medical incident in the office.","startTime":25.37,"finishTime":29.159},{"text":"Our evacuation plan and training are built so we","startTime":29.899,"finishTime":32.86},{"text":"can control these situations quickly before they escalate.","startTime":32.86,"finishTime":35.979},{"text":"A disaster,","startTime":37.279,"finishTime":38.24},{"text":"on the other hand,","startTime":38.279,"finishTime":38.979},{"text":"is the result of a calamity event","startTime":39.45,"finishTime":41.599},{"text":"like a severe earthquake or a massive flood.","startTime":42,"finishTime":44.52},{"text":"These cause widespread damage and injury,","startTime":45.33,"finishTime":47.9},{"text":"often overwhelming local resources.","startTime":48.169,"finishTime":50.549},{"text":"While we cannot always prevent a disaster,","startTime":51.009,"finishTime":53.349},{"text":"our daily safety habits and emergency preparedness","startTime":53.65,"finishTime":56.54},{"text":"are what ensure our resilience when they occur.","startTime":56.77,"finishTime":58.83},{"text":"Whether it's a single room emergency or a citywide disaster,","startTime":60.939,"finishTime":64.449},{"text":"the goal remains the same.","startTime":64.779,"finishTime":66.349},{"text":"Stay calm,","startTime":66.699,"finishTime":67.58},{"text":"follow your training,","startTime":67.819,"finishTime":68.739},{"text":"and prioritize life safety.","startTime":68.9,"finishTime":70.66},{"text":"Natural emergencies.","startTime":73.199,"finishTime":74.47},{"text":"Building on our understanding of disasters,","startTime":75.16,"finishTime":77.51},{"text":"we must recognize that some events are beyond human control.","startTime":77.83,"finishTime":81.419},{"text":"Natural emergencies are any events caused by the sheer forces of nature.","startTime":82.309,"finishTime":86.5},{"text":"These can range from localized floods to catastrophic tsunamis.","startTime":87.309,"finishTime":91.55},{"text":"We must stay alert to a wide variety of threats,","startTime":92.26,"finishTime":95.419},{"text":"including","startTime":95.44,"finishTime":96.01},{"text":"water and wind,","startTime":96.339,"finishTime":97.25},{"text":"floods,","startTime":97.58,"finishTime":98.129},{"text":"typhoons,","startTime":98.3,"finishTime":99.019},{"text":"and tsunamis.","startTime":99.099,"finishTime":99.98},{"text":"Geological","startTime":100.739,"finishTime":101.68},{"text":"earthquakes and volcanic eruptions,","startTime":101.809,"finishTime":103.959},{"text":"environmental","startTime":104.459,"finishTime":105.279},{"text":"droughts and landslides,","startTime":105.379,"finishTime":107.36},{"text":"each of these requires a specific response,","startTime":107.739,"finishTime":110.319},{"text":"but they all share one thing in common.","startTime":110.58,"finishTime":112.76},{"text":"They test our preparedness.","startTime":113.019,"finishTime":114.419},{"text":"The biggest challenge with natural disasters is their unpredictability.","startTime":115.839,"finishTime":119.93},{"text":"Some,","startTime":120.44,"finishTime":120.639},{"text":"like typhoons,","startTime":120.72,"finishTime":121.72},{"text":"give us a warning period to prepare.","startTime":122,"finishTime":124.099},{"text":"Others,","startTime":124.48,"finishTime":124.959},{"text":"like earthquakes,","startTime":125.08,"finishTime":126},{"text":"give us no warning at all.","startTime":126.269,"finishTime":127.9},{"text":"They can happen at any time,","startTime":128.279,"finishTime":129.83},{"text":"day or night,","startTime":130.08,"finishTime":130.779},{"text":"shift start or shift end.","startTime":131.16,"finishTime":132.979},{"text":"Because","startTime":133.97,"finishTime":133.979},{"text":"we cannot control these events,","startTime":134.449,"finishTime":136.149},{"text":"our only defense is to just be prepared.","startTime":136.41,"finishTime":138.929},{"text":"Know your evacuation routes,","startTime":139.25,"finishTime":141.07},{"text":"keep your emergency kits ready and stay informed.","startTime":141.33,"finishTime":144.27},{"text":"Readiness is our best chance for safety when nature takes its course.","startTime":144.77,"finishTime":148.49},{"text":"Human-induced emergencies.","startTime":149.83,"finishTime":151.339},{"text":"In the workplace,","startTime":152.039,"finishTime":152.99},{"text":"safety is never an accident.","startTime":153.279,"finishTime":154.839},{"text":"While we often prepare for natural disasters,","startTime":155.58,"finishTime":158.089},{"text":"human-induced emergencies are the crises we have the most power to prevent.","startTime":158.5,"finishTime":162.779},{"text":"These aren't just incidents,","startTime":163.63,"finishTime":165.289},{"text":"they are the results of systemic failures.","startTime":165.55,"finishTime":168.089},{"text":"OS standards show that these emergencies typically stem from four failure points","startTime":168.889,"finishTime":173.259},{"text":"behavioral,","startTime":173.669,"finishTime":174.449},{"text":"fatigue,","startTime":174.649,"finishTime":175.5},{"text":"human error,","startTime":175.83,"finishTime":176.809},{"text":"or a lack of proper training,","startTime":177.029,"finishTime":178.88},{"text":"operational,","startTime":179.789,"finishTime":180.389},{"text":"poor housekeeping,","startTime":180.71,"finishTime":181.539},{"text":"and cluttered workspaces.","startTime":181.55,"finishTime":182.94},{"text":"Technical","startTime":183.82,"finishTime":184.639},{"text":"equipment failure due to skipped maintenance,","startTime":184.899,"finishTime":187.5},{"text":"criminal","startTime":188.059,"finishTime":188.699},{"text":"wilful intent,","startTime":188.97,"finishTime":189.979},{"text":"or arson.","startTime":190.02,"finishTime":190.759},{"text":"We classify these emergencies into 4 high risk areas","startTime":192.789,"finishTime":196.6},{"text":"fire and explosions,","startTime":196.919,"finishTime":198.27},{"text":"ranging from industrial blasts to wildfires","startTime":198.52,"finishTime":201.49},{"text":"caused by a single discarded cigarette.","startTime":201.49,"finishTime":203.44},{"text":"Structural failures,","startTime":204.24,"finishTime":205.679},{"text":"the collapse of buildings or bridges,","startTime":206.039,"finishTime":208.029},{"text":"often due to overloaded designs or neglected repairs.","startTime":208.11,"finishTime":211.399},{"text":"Transport and logistics,","startTime":212.22,"finishTime":213.8},{"text":"high impact accidents involving road vehicles,","startTime":214.059,"finishTime":216.66},{"text":"trains,","startTime":216.94,"finishTime":217.449},{"text":"aircraft,","startTime":217.619,"finishTime":218.22},{"text":"or ships.","startTime":218.3,"finishTime":219.369},{"text":"Specialized accidents,","startTime":219.779,"finishTime":221.259},{"text":"high-tech failures","startTime":221.619,"finishTime":222.82},{"text":"such as space-related incidents or complex workplace machinery mishaps.","startTime":223.1,"finishTime":227.32}]}},"deJ9nZ3igJXtiyQTm":{"_id":"deJ9nZ3igJXtiyQTm","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":16005020,"uploadedFileName":"Safety Recap​​​ 1.0-2.mp4","duration":81.869002,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-18T02:34:22.373Z","dateModified":"2026-05-18T02:34:22.373Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"2qqyvJ3imSZ2CWxA3","thumbnail":"9tayEGzLPdbJvR8ux","videoSD":"CJXwQvxs5HTNEsBkh","captionData":{"status":"success","captions":[{"text":"As we wrap up,","startTime":1.22,"finishTime":2.279},{"text":"let's revisit the core principles that keep us safe.","startTime":2.5,"finishTime":5.48},{"text":"Safety isn't a one-time event.","startTime":6.099,"finishTime":8.039},{"text":"It's a continuous cycle of awareness and action.","startTime":8.3,"finishTime":10.859},{"text":"Remember that 5S is more than just a cleaning tool.","startTime":11.579,"finishTime":14.779},{"text":"It represents our fundamental commitment to housekeeping and workplace","startTime":15.06,"finishTime":19.159},{"text":"organization.","startTime":19.29,"finishTime":19.54},{"text":"When we maintain an organized space,","startTime":20.36,"finishTime":22.5},{"text":"we directly support our fire prevention and control goals by","startTime":22.649,"finishTime":26.549},{"text":"preventing outbreaks and the spread of fire,","startTime":26.85,"finishTime":29.43},{"text":"allowing for early detection and prompt extinguishment,","startTime":30.01,"finishTime":33.25},{"text":"and most importantly,","startTime":33.569,"finishTime":34.72},{"text":"ensuring a prompt and orderly evacuation.","startTime":34.959,"finishTime":37.759},{"text":"To keep this system working,","startTime":41.47,"finishTime":42.909},{"text":"we must remain diligent in 3 areas","startTime":43.11,"finishTime":45.849},{"text":"training.","startTime":46.389,"finishTime":47.049},{"text":"Every employee must be fully trained and familiar with these procedures.","startTime":47.389,"finishTime":51.61},{"text":"Storage.","startTime":52.229,"finishTime":53},{"text":"Our storage areas must remain safe,","startTime":53.31,"finishTime":55.49},{"text":"labeled,","startTime":55.86,"finishTime":56.409},{"text":"and in order at all times.","startTime":56.509,"finishTime":58.349},{"text":"Inspection.","startTime":59.299,"finishTime":60.4},{"text":"Regular checks of our electrical fixtures allow us to","startTime":60.939,"finishTime":63.86},{"text":"detect and correct defects before they become hazards.","startTime":63.86,"finishTime":66.819},{"text":"Safety is a shared responsibility.","startTime":68.3,"finishTime":70.319},{"text":"By following these basic rules and measures,","startTime":70.699,"finishTime":73.01},{"text":"we ensure that every member of our team goes home safe every day.","startTime":73.26,"finishTime":77.4},{"text":"Thank you for your commitment to excellence.","startTime":77.94,"finishTime":79.9}]}},"e8y3xrposd5b2WL5N":{"_id":"e8y3xrposd5b2WL5N","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":3963404,"uploadedFileName":"course title1.1.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-04-20T05:54:06.498Z","dateModified":"2026-04-20T05:54:06.498Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"pXhxZwXoPYvJBwvnN","workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"5neRTdiEiK2x6mbYE","thumbnail":"WjeM8iFZBfrZstysP"},"g2fvtFENeJ5eT5Nm6":{"_id":"g2fvtFENeJ5eT5Nm6","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":20086580,"uploadedFileName":"Basic Safety and Electrical Hazards​​ 1.0-2.mp4","duration":87.413991,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-19T02:45:33.411Z","dateModified":"2026-05-19T02:45:33.411Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"4Ekbcx6uNXSY6zTZE","thumbnail":"wFtLifxyyFtFQqbT4","videoSD":"xKkMH8jA8ZqgeRw9b","captionData":{"status":"success","captions":[{"text":"Basic safety and electrical hazards.","startTime":0.009,"finishTime":2.029},{"text":"Safety is a collective responsibility built on four key pillars,","startTime":4.078,"finishTime":7.96},{"text":"5S housekeeping,","startTime":8.31,"finishTime":9.52},{"text":"fire safety,","startTime":9.84,"finishTime":10.789},{"text":"material handling,","startTime":11.239,"finishTime":12.22},{"text":"and electrical safety.","startTime":12.5,"finishTime":13.75},{"text":"By mastering these basics,","startTime":14.55,"finishTime":16.059},{"text":"we create a workplace that is both efficient and accident-free.","startTime":16.27,"finishTime":19.95},{"text":"Today we're looking closer at electrical safety.","startTime":21.219,"finishTime":23.84},{"text":"Electricity is a powerful tool,","startTime":24.51,"finishTime":26.69},{"text":"but it can be deadly if ignored.","startTime":26.909,"finishTime":28.78},{"text":"You must stay alert for these critical warning signs.","startTime":29.069,"finishTime":31.87},{"text":"System failures,","startTime":32.569,"finishTime":33.97},{"text":"frequent tripped circuit breakers,","startTime":34.299,"finishTime":35.939},{"text":"or blown fuses are not just inconveniences.","startTime":35.95,"finishTime":39.06},{"text":"They are signs that a circuit is overloaded or faulty.","startTime":39.38,"finishTime":42.54},{"text":"Heat warnings","startTime":43.06,"finishTime":44.159},{"text":"if you notice warm tools,","startTime":44.419,"finishTime":45.97},{"text":"wires,","startTime":46.139,"finishTime":46.77},{"text":"cords,","startTime":46.9,"finishTime":47.459},{"text":"or junction boxes,","startTime":47.54,"finishTime":48.7},{"text":"stop work immediately.","startTime":49.06,"finishTime":50.619},{"text":"Heat indicates electrical resistance","startTime":51.099,"finishTime":53.2},{"text":"and is a primary precursor to a fire.","startTime":53.34,"finishTime":55.54},{"text":"Physical damage.","startTime":56.9,"finishTime":58.04},{"text":"Inspect your equipment daily for worn or torn insulation around wires.","startTime":58.34,"finishTime":62.759},{"text":"As shown in the diagram,","startTime":63.18,"finishTime":64.559},{"text":"exposed conductors are immediate shock and fire hazards.","startTime":64.739,"finishTime":68.22},{"text":"Don't wait for a spark to take action.","startTime":69.33,"finishTime":71.44},{"text":"If you encounter any of these red flags,","startTime":71.809,"finishTime":73.889},{"text":"report them to maintenance right away.","startTime":74.25,"finishTime":76.069},{"text":"Remember,","startTime":76.449,"finishTime":77.089},{"text":"see something,","startTime":77.449,"finishTime":78.169},{"text":"say something.","startTime":78.41,"finishTime":79.26},{"text":"Let's keep our energy safe.","startTime":79.559,"finishTime":81.11}]}},"mgXsTDdKpJtWtvXMg":{"_id":"mgXsTDdKpJtWtvXMg","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":9727511,"uploadedFileName":"OSH Statistics 1.1.mp4","duration":74.376009,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2026-05-15T01:12:45.832Z","dateModified":"2026-05-15T01:12:45.832Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"z7qLsKtPGn3ovAsdJ","jobId":"c8QAYmyWg4h86JGvu","thumbnail":"it3qRsBhgWN3hHJ75","videoSD":"LzdTo5KEkWwGsREjE","captionData":{"status":"success","captions":[{"text":"Safety statistics.","startTime":0.289,"finishTime":1.639},{"text":"Did you know","startTime":2.049,"finishTime":3.089},{"text":"every 15 seconds a worker dies from a work-related accident or disease?","startTime":3.45,"finishTime":8.18},{"text":"Every 15 seconds,","startTime":8.689,"finishTime":9.85},{"text":"160 workers have a work-related accident.","startTime":9.93,"finishTime":12.55},{"text":"According to OSH data,","startTime":13.579,"finishTime":15.52},{"text":"there are","startTime":16.02,"finishTime":16.799},{"text":"340 million work-related accidents annually.","startTime":17.379,"finishTime":20.54},{"text":"160 million victims of work-related illness annually,","startTime":21.309,"finishTime":24.85},{"text":"causing 4 days' absence.","startTime":25.059,"finishTime":26.629},{"text":"More than 2 million people die each year from work-related disease.","startTime":27.459,"finishTime":31.079},{"text":"321,000 people die each year from occupational accidents.","startTime":31.94,"finishTime":35.779},{"text":"Accidents occur mostly in","startTime":36.56,"finishTime":38.349},{"text":"agriculture,","startTime":38.529,"finishTime":39.36},{"text":"mining,","startTime":39.45,"finishTime":40},{"text":"construction,","startTime":40.13,"finishTime":40.849},{"text":"and commercial fishing.","startTime":41.009,"finishTime":42.09},{"text":"These are the common reasons we hear when accidents happen","startTime":43.169,"finishTime":46.02},{"text":"or casina.","startTime":46.43,"finishTime":47.029},{"text":"Amalanaman","startTime":48.779,"finishTime":48.84},{"text":"The senior.","startTime":50.549,"finishTime":51.549},{"text":"Kasama Satrabajoyen.","startTime":52.93,"finishTime":54.15},{"text":"These are not real causes,","startTime":54.979,"finishTime":56.29},{"text":"only excuses.","startTime":56.34,"finishTime":57.61},{"text":"These statistics remind us that workplace incidents happen everywhere,","startTime":58.06,"finishTime":61.939},{"text":"not only in high risk industries.","startTime":62.259,"finishTime":64.319},{"text":"Remember the saying,","startTime":64.86,"finishTime":65.94},{"text":"it is better to be safe than sorry.","startTime":66.099,"finishTime":67.94},{"text":"The key takeaway is that most incidents are","startTime":68.73,"finishTime":71.22},{"text":"preventable when we stay aware and proactive.","startTime":71.22,"finishTime":73.639}]}},"o2chzeH7jvFqSiGxP":{"_id":"o2chzeH7jvFq
