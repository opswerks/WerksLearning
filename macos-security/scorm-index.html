erCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"QP5cJDjE7yeDWnwoy","workspaceId":"AdPorMyw28Jp7Q9cy","jobId":"okFwgStF8FWeqh43G","thumbnail":"piosvL6KndGGau9y3","videoSD":"ArSP9MHhA7dWmipKh","captionData":{"status":"success","captions":[{"text":"Welcome to this Mac OS Tahoe tutorial.","startTime":5.46,"finishTime":7.599},{"text":"In this video,","startTime":8.71,"finishTime":9.55},{"text":"we'll walk you through a set of carefully selected new features in Spotlight,","startTime":9.59,"finishTime":13.829},{"text":"Control Center","startTime":14.43,"finishTime":15.39},{"text":"and Safari,","startTime":15.789,"finishTime":16.969},{"text":"the features that can help you work more efficiently and","startTime":17.27,"finishTime":20.01},{"text":"more importantly,","startTime":20.149,"finishTime":20.87},{"text":"more securely.","startTime":21.03,"finishTime":22.17},{"text":"We won't cover every change in Mac OS,","startTime":22.43,"finishTime":24.51},{"text":"but we'll focus on what's most useful for your daily workflow.","startTime":24.709,"finishTime":27.549},{"text":"You'll learn about Spotlight's new file type filters,","startTime":28.989,"finishTime":31.78},{"text":"built-in actions,","startTime":32.029,"finishTime":32.869},{"text":"quick keys,","startTime":32.99,"finishTime":33.9},{"text":"and clipboard history.","startTime":34.099,"finishTime":35.349},{"text":"In Control Center,","startTime":35.709,"finishTime":36.659},{"text":"we'll show you how to customize your controls","startTime":36.909,"finishTime":39.25},{"text":"and create additional pages.","startTime":39.389,"finishTime":41.209},{"text":"In Safari,","startTime":41.549,"finishTime":42.259},{"text":"we'll explore group tabs,","startTime":42.31,"finishTime":43.7},{"text":"bookmarks,","startTime":43.86,"finishTime":44.58},{"text":"how to create web apps,","startTime":44.83,"finishTime":46.299},{"text":"and a few tools that help strengthen your browsing security.","startTime":46.509,"finishTime":49.33},{"text":"Before we begin,","startTime":50.75,"finishTime":51.439},{"text":"let's highlight why this update truly matters.","startTime":51.58,"finishTime":54.279},{"text":"Updating the Mac OS Tahoe is essential for your security.","startTime":54.7,"finishTime":57.919},{"text":"Each new Mac OS version includes critical security","startTime":58.299,"finishTime":60.939},{"text":"patches that protect you from new threats,","startTime":60.939,"finishTime":63.49},{"text":"malware,","startTime":63.77,"finishTime":64.29},{"text":"and vulnerabilities that older systems can't defend against.","startTime":64.3,"finishTime":67.639},{"text":"These updates also boost system stability,","startTime":68.139,"finishTime":70.779},{"text":"performance,","startTime":71.22,"finishTime":71.9},{"text":"and app compatibility,","startTime":72.139,"finishTime":73.5},{"text":"making regular updates one of the simplest and","startTime":73.779,"finishTime":76.58},{"text":"strongest ways to keep your device safe.","startTime":76.58,"finishTime":78.459},{"text":"While we won't dive deeply into the technical security details in this tutorial,","startTime":79.18,"finishTime":83.5},{"text":"the key message is straightforward.","startTime":83.819,"finishTime":85.72},{"text":"Please keep your Mac OS up to date to stay protected.","startTime":86.22,"finishTime":88.94},{"text":"When you receive an advisory from ITSG,","startTime":91.919,"finishTime":94.269},{"text":"make sure to schedule your update promptly.","startTime":94.569,"finishTime":96.529},{"text":"For major updates,","startTime":97.669,"finishTime":98.709},{"text":"often 5 gigabytes to 15 gigabytes or more,","startTime":98.989,"finishTime":102.15},{"text":"we recommend doing the download at home to","startTime":102.629,"finishTime":104.75},{"text":"help manage network bandwidth in the labs.","startTime":104.75,"finishTime":107.3},{"text":"Now that we've covered the why,","startTime":107.55,"finishTime":109.069},{"text":"let's move into the how.","startTime":109.349,"finishTime":110.79},{"text":"With the security benefits in mind,","startTime":111.19,"finishTime":113.089},{"text":"let's jump into the actual tutorial","startTime":113.43,"finishTime":115.79},{"text":"and explore the new Mac OS Tahoe features you'll be using day to day.","startTime":115.989,"finishTime":120.129},{"text":"Let's get started.","startTime":120.629,"finishTime":121.489}]}},"ZhuPjs9Nc9kSex4Ls":{"_id":"ZhuPjs9Nc9kSex4Ls","data":{"attributes":{"status":"online","type":"image","mimetype":"image/jpeg","fileSizeInBytes":179320,"uploadedFileName":"OpsWerksLogo_FullColor@3x-100.jpg","height":296,"uploadedFileNameExtension":".jpg","width":1680},"users":{"_userCreatorID":"fC4kb7RBFBRfNWPQp","_userModifierID":"fC4kb7RBFBRfNWPQp"},"dates":{"dateCreated":"2023-05-12T07:53:49.139Z","dateModified":"2023-05-12T15:23:41.624Z"}},"isVisible":true,"categoryId":"9kKr3aGggMqrEuvov","workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"ShWhw2prKJ8dRgjpK","isArchived":false},"Zi8hEc9sNzq8yrMA7":{"_id":"Zi8hEc9sNzq8yrMA7","data":{"attributes":{"status":"online","type":"image","mimetype":"image/png","fileSizeInBytes":7946506,"uploadedFileName":"onboarding-title-image.png","height":1680,"uploadedFileNameExtension":".png","width":1132},"users":{"_userCreatorID":"fC4kb7RBFBRfNWPQp","_userModifierID":"fC4kb7RBFBRfNWPQp"},"dates":{"dateCreated":"2023-05-12T15:48:09.211Z","dateModified":"2023-05-12T15:48:18.331Z"}},"isVisible":true,"categoryId":"ZkaEp4KHAr2nnmcSw","workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"HDudXGPbGXbYPthPi","isArchived":false},"keX3Av6vycJ5wNfBS":{"_id":"keX3Av6vycJ5wNfBS","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":125811621,"uploadedFileName":"macOS Tahoe - Tutorial (rev. 2025-12-12).mp4","duration":547.811,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2025-12-23T12:35:24.591Z","dateModified":"2025-12-23T12:35:24.591Z"},"users":{"_userCreatorID":"P9kevErK9XWTkwSsS","_userModifierID":"P9kevErK9XWTkwSsS"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"QP5cJDjE7yeDWnwoy","workspaceId":"AdPorMyw28Jp7Q9cy","jobId":"RXWXoc7Q3tvyuxrqr","thumbnail":"H25SNyEG2heDkDwEn","videoSD":"8napSCLLoHSF2xv82","captionData":{"status":"success","captions":[{"text":"Mac OS Tahoe is here.","startTime":1.08,"finishTime":2.589},{"text":"The newest Mac OS version has been released as of September 2025.","startTime":3.38,"finishTime":7.489},{"text":"It has a lot of new features,","startTime":8.189,"finishTime":9.859},{"text":"which includes","startTime":9.93,"finishTime":10.85},{"text":"a new liquid glass design.","startTime":11.189,"finishTime":12.81},{"text":"Then the launch pad being replaced with apps,","startTime":13.97,"finishTime":16.54},{"text":"and many other visual upgrades,","startTime":16.809,"finishTime":18.75},{"text":"looks flashy,","startTime":19.17,"finishTime":20.43},{"text":"but what matters most to us is how to make use of these upgrades.","startTime":20.85,"finishTime":24.17},{"text":"We'll tackle some of the upgrades that we can use to help boost productivity.","startTime":25.799,"finishTime":29.659},{"text":"In this video,","startTime":31.75,"finishTime":32.52},{"text":"we'll cover the new features of Mac OS Spotlight,","startTime":32.529,"finishTime":35.38},{"text":"then","startTime":35.799,"finishTime":36.259},{"text":"the control center,","startTime":36.36,"finishTime":37.439},{"text":"and lastly,","startTime":37.759,"finishTime":38.61},{"text":"Mac OS Safari.","startTime":38.959,"finishTime":40.279},{"text":"First,","startTime":41.7,"finishTime":42.209},{"text":"Mecca spotlight.","startTime":42.439,"finishTime":43.549},{"text":"Spotlight's upgrades","startTime":44.459,"finishTime":45.869},{"text":"include a new setup.","startTime":46.15,"finishTime":47.45},{"text":"If you are fresh from upgrading,","startTime":47.869,"finishTime":49.669},{"text":"a guide will appear when you open Spotlight with Command plus spacebar.","startTime":49.95,"finishTime":54.31},{"text":"4 options are now available.","startTime":55.59,"finishTime":57.27},{"text":"Press command plus one","startTime":61.04,"finishTime":62.68},{"text":"to narrow down your search for applications that are installed in your MacBook.","startTime":62.93,"finishTime":66.73},{"text":"Press command + 2","startTime":70.3,"finishTime":72},{"text":"to narrow down your search","startTime":72.339,"finishTime":73.8},{"text":"to files in your MacBook.","startTime":74.059,"finishTime":75.459},{"text":"Press command + 3,","startTime":79.199,"finishTime":80.91},{"text":"search for actions.","startTime":81.339,"finishTime":82.61},{"text":"These actions include commands in your application.","startTime":83.11,"finishTime":85.41},{"text":"So for example,","startTime":86.93,"finishTime":88.029},{"text":"if you're going to create a new message in Microsoft Teams.","startTime":88.29,"finishTime":91.589},{"text":"Typing","startTime":92.459,"finishTime":93.25},{"text":"new message.","startTime":93.61,"finishTime":94.41},{"text":"And it will appear.","startTime":95.22,"finishTime":96.18},{"text":"As a bonus,","startTime":100.72,"finishTime":101.66},{"text":"you can use quick keys","startTime":101.83,"finishTime":103.48},{"text":"that allows you to set a shortcut word for the command you want to execute.","startTime":103.68,"finishTime":107.099},{"text":"To do so,","startTime":107.819,"finishTime":108.65},{"text":"first type in the command you want to make a quick key of.","startTime":108.94,"finishTime":111.66},{"text":"Then once it appears,","startTime":113.25,"finishTime":114.33},{"text":"click the addu keys on the right and type in the shortcut word.","startTime":115.379,"finishTime":118.529},{"text":"Once you use Spotlight again,","startTime":123.75,"finishTime":125.339},{"text":"just type in the shortcut word you set","startTime":125.959,"finishTime":128.258},{"text":"and the command will be automatically selected.","startTime":128.258,"finishTime":130.72},{"text":"If you want to change the quick key","startTime":136.97,"finishTime":138.99},{"text":"or remove it,","startTime":139.369,"finishTime":140.279},{"text":"just type in the shortcut word again","startTime":140.61,"finishTime":142.429},{"text":"and click the quick key on the side,","startTime":142.77,"finishTime":144.389},{"text":"then change it","startTime":144.97,"finishTime":145.949},{"text":"or remove it.","startTime":146.289,"finishTime":146.97},{"text":"Press command + 4","startTime":150.029,"finishTime":151.929},{"text":"to open up the clipboard history,","startTime":152.199,"finishTime":153.779},{"text":"which shows the recent things you've copied.","startTime":154.279,"finishTime":156.679},{"text":"It is not limited to just text or photos.","startTime":157,"finishTime":159.94},{"text":"It can also show files you've copied.","startTime":160.24,"finishTime":162.82},{"text":"However,","startTime":163,"finishTime":163.74},{"text":"the clipboard can only show up to 8 hours' worth of copied material.","startTime":164.08,"finishTime":167.419},{"text":"If you're looking for something you've copied 9 hours ago,","startTime":167.679,"finishTime":170.339},{"text":"it won't show here.","startTime":170.479,"finishTime":171.58},{"text":"This limitation has been extended up to 30 days in Mac OS Tahoe 26.1.","startTime":171.839,"finishTime":176.039},{"text":"Clipboard history is disabled by default,","startTime":176.529,"finishTime":178.649},{"text":"so you will have to enable it.","startTime":178.809,"finishTime":179.929},{"text":"Second,","startTime":182.009,"finishTime":182.47},{"text":"the control center.","startTime":182.649,"finishTime":183.69},{"text":"Control Center is where you can manage common settings we use.","startTime":184.009,"finishTime":187.089},{"text":"Such as the Wi Fi,","startTime":188,"finishTime":189.139},{"text":"screen mirroring or airplay,","startTime":189.88,"finishTime":191.479},{"text":"display brightness","startTime":191.75,"finishTime":192.979},{"text":"and sound.","startTime":193.199,"finishTime":193.86},{"text":"In older versions of Mac OS,","startTime":194.44,"finishTime":196.46},{"text":"the changes that can be done are limited","startTime":196.759,"finishTime":198.559},{"text":"by adding or removing select modules and settings.","startTime":198.559,"finishTime":201.52},{"text":"But now,","startTime":202.33,"finishTime":203.44},{"text":"we can do further.","startTime":203.86,"finishTime":205.11},{"text":"On the new control center,","startTime":205.449,"finishTime":207.07},{"text":"click edit controls on the bottom,","startTime":207.479,"finishTime":209.47},{"text":"and you will see a window showing all possible","startTime":210.289,"finishTime":212.85},{"text":"commands that can be added to the control center.","startTime":212.85,"finishTime":215.529},{"text":"Buttons that are currently present can also be removed","startTime":221.259,"finishTime":224.619},{"text":"and can be added again.","startTime":224.919,"finishTime":226.24},{"text":"Another perk is,","startTime":235.38,"finishTime":236.479},{"text":"if you've noticed the plus icon,","startTime":236.86,"finishTime":238.779},{"text":"clicking this will add another control center","startTime":239.02,"finishTime":241.679},{"text":"in addition to the one currently active.","startTime":241.86,"finishTime":244.02},{"text":"You can add","startTime":250.029,"finishTime":250.74},{"text":"your own set of buttons.","startTime":251.119,"finishTime":252.32},{"text":"Once you're done adding your set of buttons,","startTime":260.89,"finishTime":263.149},{"text":"you can click the done button on the bottom of the list of controls","startTime":263.41,"finishTime":267.269},{"text":"to save your new control center page.","startTime":267.57,"finishTime":269.839},{"text":"If you feel like you really didn't need to add another control center,","startTime":272.07,"finishTime":275.47},{"text":"you can drag that custom control center out of the top bar,","startTime":275.91,"finishTime":279.489},{"text":"and it will be automatically deleted.","startTime":279.829,"finishTime":281.709},{"text":"Now we come to upgrades made to Safari,","startTime":287.79,"finishTime":290.23},{"text":"Mac OS's default web browser.","startTime":290.75,"finishTime":293.149},{"text":"Safari's upgrade in Mac OS Tahoe","startTime":294.85,"finishTime":297.17},{"text":"is making the following settings default,","startTime":297.369,"finishTime":300.13},{"text":"preventing website tracking","startTime":300.529,"finishTime":302.429},{"text":"and hiding IP address from site trackers.","startTime":302.89,"finishTime":305.589},{"text":"These settings provide further privacy and security","startTime":306.589,"finishTime":309.269},{"text":"as you browse through the internet and through our internet.","startTime":309.47,"finishTime":311.91},{"text":"For this reason,","startTime":312.839,"finishTime":313.399},{"text":"it is requested that you use Safari","startTime":313.44,"finishTime":315.82},{"text":"when browsing through Apple related sites and our Microsoft SharePoint sites.","startTime":316.04,"finishTime":320.2},{"text":"With the many sites we use,","startTime":321.799,"finishTime":323.589},{"text":"they can get rather crowded.","startTime":323.959,"finishTime":325.48},{"text":"You can group tabs together.","startTime":326.269,"finishTime":328.089},{"text":"Group tabs with websites that are related to each","startTime":329.779,"finishTime":332.26},{"text":"other or those that have a single function,","startTime":332.26,"finishTime":334.399},{"text":"or if you have an idea on how to group them,","startTime":334.859,"finishTime":336.82},{"text":"do so.","startTime":337.059,"finishTime":337.66},{"text":"For example,","startTime":339.309,"finishTime":340.089},{"text":"if you have multiple SharePoint sites open,","startTime":340.549,"finishTime":343.309},{"text":"you can group them together","startTime":343.829,"finishTime":345.41},{"text":"by pressing the shift button.","startTime":346.029,"finishTime":347.47},{"text":"And then","startTime":348.399,"finishTime":349.42},{"text":"click all the tabs","startTime":349.76,"finishTime":351.26},{"text":"you want to group.","startTime":351.559,"finishTime":352.39},{"text":"Then click file,","startTime":355.709,"finishTime":356.73},{"text":"then click new tab group with selected tabs.","startTime":357.39,"finishTime":360.19},{"text":"You can change the name of the tab group for better reference.","startTime":370.869,"finishTime":374.109},{"text":"In this case,","startTime":374.429,"finishTime":375.26},{"text":"we can call this group","startTime":375.549,"finishTime":376.929},{"text":"SharePoint.","startTime":377.19,"finishTime":377.869},{"text":"Bookmarks are another option.","startTime":379.82,"finishTime":381.88},{"text":"You can bookmark a specific site for easier searching,","startTime":382.38,"finishTime":385.54},{"text":"select the tab you want to bookmark,","startTime":385.779,"finishTime":387.72},{"text":"and click bookmarks from the menu bar","startTime":388.179,"finishTime":390.239},{"text":"and click Add bookmark.","startTime":390.42,"finishTime":391.98},{"text":"Select the folder to store the bookmark.","startTime":394.299,"finishTime":396.32},{"text":"Then change its name.","startTime":400.459,"finishTime":401.89},{"text":"And add a description,","startTime":407.98,"finishTime":409.2},{"text":"just if you want to.","startTime":409.42,"finishTime":410.54},{"text":"Then click the ad button.","startTime":411.72,"finishTime":413.04},{"text":"Access the bookmark via the sidewalk.","startTime":415.959,"finishTime":417.88},{"text":"Then click bookmarks,","startTime":420.269,"finishTime":421.809},{"text":"and then browse through to find the bookmark you made.","startTime":422.19,"finishTime":424.73},{"text":"Another feature of Safari is to create what is called","startTime":426.72,"finishTime":429.709},{"text":"Safari web apps.","startTime":430.01,"finishTime":431.679},{"text":"Well,","startTime":431.89,"finishTime":432.209},{"text":"it's different from the web apps that we know.","startTime":432.329,"finishTime":434.209},{"text":"Creating a Safari web app means","startTime":434.98,"finishTime":436.859},{"text":"that a specific site can be used independently of Safari,","startTime":436.98,"finishTime":440.239},{"text":"and it will act like other regular installed apps on the MacBook.","startTime":440.619,"finishTime":443.899},{"text":"It also does not share browsing history,","startTime":444.179,"finishTime":446.519},{"text":"cookies,","startTime":446.839,"finishTime":447.489},{"text":"website data,","startTime":448.1,"finishTime":448.679},{"text":"or settings with Safari,","startTime":449.1,"finishTime":450.739},{"text":"which makes it a totally separate","startTime":451.019,"finishTime":453},{"text":"application.","startTime":453.13,"finishTime":453.38},{"text":"To do this,","startTime":455.529,"finishTime":456.48},{"text":"select the tab in Safari you want to turn into a web app.","startTime":456.66,"finishTime":459.38},{"text":"Then click File from the top menu bar","startTime":460.89,"finishTime":463.07},{"text":"and click Add to Doc.","startTime":463.29,"finishTime":464.769},{"text":"Once you do","startTime":469.57,"finishTime":470.5},{"text":"A small window shows.","startTime":471.38,"finishTime":472.769},{"text":"Allowing you to edit the name of the Safari web app.","startTime":473.549,"finishTime":476.079},{"text":"Click the add button when you're done.","startTime":479.1,"finishTime":480.739},{"text":"Then,","startTime":482.82,"finishTime":482.829},{"text":"the Safari web app now appears in the dock","startTime":483.82,"finishTime":486.42},{"text":"and in apps."," ,"finishTime":37.439},{"text":"and lastly,","startTime":37.759,"finishTime":38.61},{"text":"Mac OS Safari.","startTime":38.959,"finishTime":40.279},{"text":"First,","startTime":41.7,"finishTime":42.209},{"text":"Mecca spotlight.","startTime":42.439,"finishTime":43.549},{"text":"Spotlight's upgrades","startTime":44.459,"finishTime":45.869},{"text":"include a new setup.","startTime":46.15,"finishTime":47.45},{"text":"If you are fresh from upgrading,","startTime":47.869,"finishTime":49.669},{"text":"a guide will appear when you open Spotlight with Command plus spacebar.","startTime":49.95,"finishTime":54.31},{"text":"4 options are now available.","startTime":55.59,"finishTime":57.27},{"text":"Press command plus one","startTime":61.04,"finishTime":62.68},{"text":"to narrow down your search for applications that are installed in your MacBook.","startTime":62.93,"finishTime":66.73},{"text":"Press command + 2","startTime":70.3,"finishTime":72},{"text":"to narrow down your search","startTime":72.339,"finishTime":73.8},{"text":"to files in your MacBook.","startTime":74.059,"finishTime":75.459},{"text":"Press command + 3,","startTime":79.199,"finishTime":80.91},{"text":"search for actions.","startTime":81.339,"finishTime":82.61},{"text":"These actions include commands in your application.","startTime":83.11,"finishTime":85.41},{"text":"So for example,","startTime":86.93,"finishTime":88.029},{"text":"if you're going to create a new message in Microsoft Teams.","startTime":88.29,"finishTime":91.589},{"text":"Typing","startTime":92.459,"finishTime":93.25},{"text":"new message.","startTime":93.61,"finishTime":94.41},{"text":"And it will appear.","startTime":95.22,"finishTime":96.18},{"text":"As a bonus,","startTime":100.72,"finishTime":101.66},{"text":"you can use quick keys","startTime":101.83,"finishTime":103.48},{"text":"that allows you to set a shortcut word for the command you want to execute.","startTime":103.68,"finishTime":107.099},{"text":"To do so,","startTime":107.819, ishTime":36.659},{"text":"we'll show you how to customize your controls","startTime":36.909,"finishTime":39.25},{"text":"and create additional pages.","startTime":39.389,"finishTime":41.209},{"text":"In Safari,","startTime":41.549,"finishTime":42.259},{"text":"we'll explore group tabs,","startTime":42.31,"finishTime":43.7},{"text":"bookmarks,","startTime":43.86,"finishTime":44.58},{"text":"how to create web apps,","startTime":44.83,"finishTime":46.299},{"text":"and a few tools that help strengthen your browsing security.","startTime":46.509,"finishTime":49.33},{"text":"Before we begin,","startTime":50.75,"finishTime":51.439},{"text":"let's highlight why this update truly matters.","startTime":51.58,"finishTime":54.279},{"text":"Updating the Mac OS Tahoe is essential for your security.","startTime":54.7,"finishTime":57.919},{"text":"Each new Mac OS version includes critical security","startTime":58.299,"finishTime":60.939},{"text":"patches that protect you from new threats,","startTime":60.939,"finishTime":63.49},{"text":"malware,","startTime":63.77,"finishTime":64.29},{"text":"and vulnerabilities that older systems can't defend against.","startTime":64.3,"finishTime":67.639},{"text":"These updates also boost system stability,","startTime":68.139,"finishTime":70.779},{"text":"performance,","startTime":71.22,"finishTime":71.9},{"text":"and app compatibility,","startTime":72.139,"finishTime":73.5},{"text":"making regular updates one of the simplest and","startTime":73.779,"finishTime":76.58},{"text":"strongest ways to keep your device safe.","startTime":76.58,"finishTime":78.459},{"text":"While we won't dive deeply into the technical security details in this tutorial,","startTime":79.18,"finishTime":83.5},{"text":"the key message is straightforward.","startTime":83.819,"finishTime":85.72},{"text":"Please keep your Mac OS up to date to stay protected.","startTime":86.22,"finishTime":88.94},{"text":"When you receive an advisory from ITSG,","startTime":91.919,"finishTime":94.269},{"text":"make sure to schedule your update promptly.","startTime":94.569,"finishTime":96.529},{"text":"For major updates,","startTime":97.669,"finishTime":98.709},{"text":"often 5 gigabytes to 15 gigabytes or more,","startTime":98.989,"finishTime":102.15},{"text":"we recommend doing the download at home to","startTime":102.629,"finishTime":104.75},{"text":"help manage network bandwidth in the labs.","startTime":104.75,"finishTime":107.3},{"text":"Now that we've covered the why,","startTime":107.55,"finishTime":109.069},{"text":"let's move into the how.","startTime":109.349,"finishTime":110.79},{"text":"With the security benefits in mind,","startTime":111.19,"finishTime":113.089},{"text":"let's jump into the actual tutorial","startTime":113.43,"finishTime":115.79},{"text":"and explore the new Mac OS Tahoe features you'll be using day to day.","startTime":115.989,"finishTime":120.129},{"text":"Let's get started.","startTime":120.629,"finishTime":121.489}]}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["T6aGG2MMC3qzj385k"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"x29Fv4CG58B3ZuZaF":{"_id":"x29Fv4CG58B3ZuZaF","data":{"attributes":{"title":"Title Page","template":"resourceSlide","locale":"en","upload":"vGyeczjdARQtmy3u2"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"width":506.00000000000006,"height":717.442838370565,"x":0,"y":0,"rotationAngle":0,"identifier":"DR6emo9zNa9jjd5xf","kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left"
