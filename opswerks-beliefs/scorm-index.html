cent1":"rgba(0,95,62,1)","accent2":"rgba(0,146,103,1)","accent3":"rgba(185,213,58,1)","accent4":"rgba(73,78,86,1)","accent5":"rgba(94,199,205,1)","accent6":"rgba(8,129,146,1)"},"accentColor":"rgba(0,146,103,1)","headerLogo":"3y8PBXktGWEGsvfDX"},"assetsById":{"3PMtkTsgkxCmbYLCd":{"_id":"3PMtkTsgkxCmbYLCd","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":26689440,"uploadedFileName":"We are here to become our best selves.mp4","duration":80.221995,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-02-21T06:01:50.791Z","dateModified":"2024-02-21T06:01:50.791Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"hHzbuh6ri7n3cYQd3","videoSD":"iJL3MXyMpECS57vgB","captionData":{"status":"success","captions":[{"text":"Hey there,","startTime":5.32,"finishTime":5.63},{"text":"Steve here.","startTime":5.76,"finishTime":6.46},{"text":"Um,","startTime":6.829,"finishTime":7.03},{"text":"I want to talk about one of our core beliefs here at Ops Works,","startTime":7.079,"finishTime":9.76},{"text":"that we are here to become our best selves.","startTime":10.159,"finishTime":12.029},{"text":"Um,","startTime":12.43,"finishTime":12.619},{"text":"each one of us","startTime":12.72,"finishTime":13.609},{"text":"is here to be curious and courageous in asking like,","startTime":13.8,"finishTime":16.92},{"text":"who am I supposed to be,","startTime":17.04,"finishTime":18.219},{"text":"and how will I get there and what do I need to","startTime":18.559,"finishTime":20.35},{"text":"learn along the way to be able to accomplish those things.","startTime":20.35,"finishTime":22.799},{"text":"This exploration helps us each to discover and uncover,","startTime":23.389,"finishTime":26.42},{"text":"you know,","startTime":26.709,"finishTime":27.01},{"text":"our very best selves,","startTime":27.149,"finishTime":28.209},{"text":"um,","startTime":28.629,"finishTime":28.79},{"text":"and in doing the work that we can grow","startTime":28.87,"finishTime":30.75},{"text":"in that direction that helps us build lasting relationships,","startTime":30.75,"finishTime":33.729},{"text":"um,","startTime":34.029,"finishTime":34.229},{"text":"and then really live amazing lives in our communities.","startTime":34.34,"finishTime":36.549},{"text":"And this is sort of our lifelong calling and","startTime":36.63,"finishTime":38.619},{"text":"our mission here.","startTime":38.75,"finishTime":39.61},{"text":"Nobody,","startTime":40.15,"finishTime":40.47},{"text":"nobody has kids and hopes that they will do poorly.","startTime":40.59,"finishTime":43.13},{"text":"Um,","startTime":43.509,"finishTime":43.9},{"text":"they actually want them to do better than they were.","startTime":43.95,"finishTime":46.189},{"text":"Um,","startTime":46.54,"finishTime":46.669},{"text":"we,","startTime":46.75,"finishTime":46.939},{"text":"we all come from an amazing legacy of an unbroken chain of survivors who went","startTime":47.029,"finishTime":50.709},{"text":"on to build up families and relationships that allow the next generation to exist,","startTime":50.709,"finishTime":54.15},{"text":"and we want to continue this legacy.","startTime":54.189,"finishTime":56.27},{"text":"Um,","startTime":56.709,"finishTime":56.97},{"text":"it may not be all of our kids,","startTime":57.029,"finishTime":58.45},{"text":"um,","startTime":58.47,"finishTime":58.909},{"text":"Uh,","startTime":59.319,"finishTime":59.479},{"text":"that","startTime":59.56,"finishTime":59.9},{"text":"they're somebody else's kids though,","startTime":60,"finishTime":61.24},{"text":"and we get to invest in their legacy,","startTime":61.479,"finishTime":62.81},{"text":"and that's what we're doing here.","startTime":62.84,"finishTime":63.84},{"text":"So","startTime":63.97,"finishTime":64.339},{"text":"I'd love for you to,","startTime":64.68,"finishTime":65.639},{"text":"uh,","startTime":65.68,"finishTime":65.839},{"text":"join us in this journey,","startTime":66,"finishTime":66.959},{"text":"um,","startTime":67.239,"finishTime":67.36},{"text":"and just finding out,","startTime":67.4,"finishTime":68.419},{"text":"discovering and helping inspire others to become the best selves.","startTime":68.48,"finishTime":71.22},{"text":"Uh,","startTime":71.47,"finishTime":71.559},{"text":"but the way to do that best is to do it for ourselves","startTime":71.629,"finishTime":74.059},{"text":"and show examples of how they could do it.","startTime":74.239,"finishTime":76.3},{"text":"So with that being said,","startTime":76.839,"finishTime":77.8},{"text":"I'm wishing you well.","startTime":77.949,"finishTime":78.559},{"text":"Take care.","startTime":78.72,"finishTime":79.08},{"text":"Bye-bye.","startTime":79.279,"finishTime":79.68}]}},"3y8PBXktGWEGsvfDX":{"_id":"3y8PBXktGWEGsvfDX","data":{"attributes":{"status":"online","type":"image","mimetype":"image/png","fileSizeInBytes":118971,"uploadedFileName":"opswerks_logo_notext_transparetn.png","height":684,"uploadedFileNameExtension":".png","width":649},"users":{"_userCreatorID":"fC4kb7RBFBRfNWPQp","_userModifierID":"fC4kb7RBFBRfNWPQp"},"dates":{"dateCreated":"2023-05-13T16:29:35.880Z","dateModified":"2023-05-13T16:29:43.336Z"}},"isVisible":true,"categoryId":"9kKr3aGggMqrEuvov","workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"DZzqkwBZ4hr4sZ7eo","isArchived":false},"4H7ed8pGf5gEu55dQ":{"_id":"4H7ed8pGf5gEu55dQ","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":36612,"uploadedFileName":"5.png","height":290,"uploadedFileNameExtension":".png","width":1415},"dates":{"dateCreated":"2024-02-21T03:37:04.573Z","dateModified":"2024-02-21T03:37:04.573Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"DB7nPRJdQwPJHoKSB"},"7EP5ofrSZJyvdzvk3":{"_id":"7EP5ofrSZJyvdzvk3","data":{"attributes":{"status":"online","type":"video","mimetype":"video/mp4","fileSizeInBytes":1199955,"uploadedFileName":"4. Watch Party BVMMs.mp4","duration":5.979,"uploadedFileNameExtension":".mp4"},"users":{"_userCreatorID":"E7susMHWrgbRjpvPu","_userModifierID":"kNAApMq87PNSnqYMb"},"dates":{"dateCreated":"2023-08-04T04:52:17.874Z","dateModified":"2023-08-04T04:52:21.820Z"}},"isVisible":true,"workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"frwnPykaCFvRH93FP","videoSD":"dSRq5XZ773SPAQtxw","captionData":{"status":"success","captions":[]}},"ATd6b9Dei3zWDdMLs":{"_id":"ATd6b9Dei3zWDdMLs","data":{"attributes":{"type":"svg","mimetype":"image/svg+xml","uploadedFileName":"solid-caret-right","status":"online","width":192,"height":512},"dates":{"dateCreated":"2019-01-16T23:08:59.624Z","dateModified":"2019-01-16T23:08:59.624Z"}},"content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 192 512\">\u003cpath d=\"M0 384.662V127.338c0-17.818 21.543-26.741 34.142-14.142l128.662 128.662c7.81 7.81 7.81 20.474 0 28.284L34.142 398.804C21.543 411.404 0 402.48 0 384.662z\"/>\u003c/svg>","searchTerms":"Arrows Caret Right arrow forward next triangle right","isBuiltin":true,"isVisible":true,"categoryLogicalName":"arrows"},"DmBWqyfzTgk4Gd3Bj":{"_id":"DmBWqyfzTgk4Gd3Bj","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":48120674,"uploadedFileName":"Relationships are the Foundation.mp4","duration":153.220998,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-02-21T06:26:54.441Z","dateModified":"2024-02-21T06:26:54.441Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"hPR52DLhWchHBPYr7","videoSD":"yyHx7jxMn4ke3FyFX","captionData":{"status":"success","captions":[{"text":"Hey there,","startTime":5.539,"finishTime":5.9399999999999995},{"text":"Steve here.","startTime":6.07,"finishTime":6.719},{"text":"I want to talk about one of our core beliefs that relationships are the foundation.","startTime":6.9399999999999995,"finishTime":10.42},{"text":"Relationships are everything for us.","startTime":10.779,"finishTime":13.05},{"text":"Uh,","startTime":13.38,"finishTime":13.619},{"text":"they're integrated into all of our beliefs,","startTime":13.699,"finishTime":15.579},{"text":"our vision,","startTime":15.739,"finishTime":16.36},{"text":"our mission,","startTime":16.819,"finishTime":17.36},{"text":"and our methods.","startTime":17.459,"finishTime":18.319},{"text":"They do rely upon them,","startTime":18.62,"finishTime":20.049},{"text":"um,","startTime":20.34,"finishTime":20.459},{"text":"and are drawn from them.","startTime":20.5,"finishTime":21.459},{"text":"Relationships help us to see more broadly,","startTime":21.62,"finishTime":24.01},{"text":"to support more completely,","startTime":24.34,"finishTime":25.559},{"text":"and to celebrate more intensely.","startTime":25.61,"finishTime":27.29},{"text":"Um,","startTime":27.59,"finishTime":27.78},{"text":"our wins are a little bit more worthy when we have someone to celebrate with,","startTime":27.86,"finishTime":30.53},{"text":"and our darker moments are made up a little bit brighter,","startTime":30.54,"finishTime":33.06},{"text":"uh,","startTime":33.34,"finishTime":33.419},{"text":"when we have someone to help us through them.","startTime":33.45,"finishTime":35.06},{"text":"Our relationships are the foundation for everything that we do,","startTime":35.79,"finishTime":38.229},{"text":"and it's for all of our growth.","startTime":38.24,"finishTime":39.479},{"text":"I love the old African proverb that said,","startTime":39.9,"finishTime":41.659},{"text":"if you want to go fast,","startTime":41.7,"finishTime":42.849},{"text":"go alone,","startTime":43.22,"finishTime":43.72},{"text":"but if you want to go far,","startTime":44.459,"finishTime":45.34},{"text":"go together.","startTime":45.5,"finishTime":46.34},{"text":"And so none of us arrived here by ourselves.","startTime":46.58,"finishTime":48.919},{"text":"There's relationships with people that have helped us along the way.","startTime":49.22,"finishTime":52.08},{"text":"But when we talk about relationships,","startTime":52.58,"finishTime":53.819},{"text":"I also want to talk about them.","startTime":53.86,"finishTime":54.959},{"text":"There are relationships with people and their relationships with things.","startTime":55.06,"finishTime":57.759},{"text":"And for me,","startTime":58.099,"finishTime":58.599},{"text":"you know,","startTime":58.939,"finishTime":59.22},{"text":"when I","startTime":59.34,"finishTime":59.919},{"text":"think about the past,","startTime":60.099,"finishTime":61.099},{"text":"There are some relationships with things that were maybe not so healthy,","startTime":61.52,"finishTime":64.29},{"text":"and I realized that it drove me in a different direction.","startTime":64.33,"finishTime":67.11},{"text":"And","startTime":67.169,"finishTime":67.529},{"text":"there are relationships with people that may not have had healthy boundaries or","startTime":67.849,"finishTime":71.269},{"text":"just didn't really know what's going on and,","startTime":71.529,"finishTime":72.97},{"text":"and drove me in another direction.","startTime":73.08,"finishTime":74.139},{"text":"And","startTime":74.169,"finishTime":74.61},{"text":"this culmination of relationships,","startTime":75.05,"finishTime":77.069},{"text":"um,","startTime":77.339,"finishTime":77.769},{"text":"is one side of the steering side.","startTime":78.089,"finishTime":79.47},{"text":"Then you could define like what kind of healthy relationship or","startTime":80.449,"finishTime":83.269},{"text":"type of relationship do you want with things and","startTime":83.61,"finishTime":85.569},{"text":"what kind of type of relationship do you want with people.","startTime":85.809,"finishTime":88.769},{"text":"And so for me,","startTime":89.29,"finishTime":90.01},{"text":"like,","startTime":90.089,"finishTime":90.489},{"text":"you know,","startTime":90.61,"finishTime":90.769},{"text":"with the things relationship,","startTime":90.849,"finishTime":91.889},{"text":"I just don't want the things to own me anymore.","startTime":91.97,"finishTime":93.91},{"text":"And so when I","startTime":94.29,"finishTime":95.15},{"text":"get in when in the past when I would get","startTime":95.489,"finishTime":96.93},{"text":"something that was kind of nice or whatever it was,","startTime":96.93,"finishTime":99.41},{"text":"um,","startTime":99.669,"finishTime":100.089},{"text":"it would actually own me,","startTime":100.209,"finishTime":101.16},{"text":"you know,","startTime":101.25,"finishTime":101.36},{"text":"cause I would worry about like,","startTime":101.489,"finishTime":102.37},{"text":"oh,","startTime":102.41,"finishTime":102.639},{"text":"well,","startTime":102.65,"finishTime":102.809},{"text":"will they get scratched,","startTime":103,"finishTime":103.73},{"text":"damaged,","startTime":103.839,"finishTime":104.169},{"text":"stolen,","startTime":104.209,"finishTime":104.599},{"text":"or those different types of things.","startTime":104.61,"finishTime":105.809},{"text":"And,","startTime":105.889,"finishTime":106.19},{"text":"and for me,","startTime":106.58,"finishTime":106.879},{"text":"I want a different relationship with things where it's like the things.","startTime":106.9,"finishTime":109.709},{"text":"I use","startTime":109.889,"finishTime":110.709},{"text":"those things don't use me.","startTime":111.36,"finishTime":112.79},{"text":"Um,","startTime":113.48,"finishTime":113.489},{"text":"likewise on relationships with people.","startTime":113.569,"finishTime":115.389},{"text":"Um,","startTime":115.68,"finishTime":115.959},{"text":"I like what I found over time is it's","startTime":116.129,"finishTime":118.05},{"text":"really important for me to have relationships with people","startTime":118.05,"finishTime":120.47},{"text":"um that have similar values,","startTime":120.769,"finishTime":122.989},{"text":"values that line up in a similar direction.","startTime":123.37,"finishTime":125.489},{"text":"And so for me,","startTime":126.26,"finishTime":126.83},{"text":"that's really important to understand what those things are for me,","startTime":126.879,"finishTime":129.13},{"text":"to make it clear to others,","startTime":129.429,"finishTime":130.729},{"text":"and that to find out if that's the way they wanna go.","startTime":130.74,"finishTime":133.009},{"text":"Um,","startTime":133.389,"finishTime":133.8},{"text":"and","startTime":134.029,"finishTime":134.369},{"text":"with that foundation set in place,","startTime":134.47,"finishTime":136.009},{"text":"it leads to a greater and better experience throughout life,","startTime":136.1,"finishTime":138.869},{"text":"and that's what I found out.","startTime":138.91,"finishTime":139.869},{"text":"So,","startTime":140.029,"finishTime":140.41},{"text":"I'm hoping you're doing well,","startTime":140.789,"finishTime":141.97},{"text":"and I hope relationships are the foundation for you as well,","startTime":142.11,"finishTime":144.649},{"text":"and that you are very deliberate and","startTime":144.869,"finishTime":147.25},{"text":"um","startTime":147.649,"finishTime":148.08},{"text":"purposeful in the relationships that you form.","startTime":148.19,"finishTime":149.99},{"text":"So with that being said,","startTime":150.27,"finishTime":151.13},{"text":"take care.","startTime":151.35,"finishTime":151.669},{"text":"Talk to you soon.","startTime":151.83,"finishTime":152.35},{"text":"Bye-bye.","startTime":152.55,"finishT ":53.869},{"text":"oh,","startTime":53.909,"finishTime":54.02},{"text":"it's about the work life or the personal life,","startTime":54.06,"finishTime":55.99},{"text":"but","startTime":56.029,"finishTime":56.299},{"text":"if we can find a way to have this integrated in a healthy way,","startTime":56.47,"finishTime":59.049},{"text":"right?","startTime":59.189,"finishTime":59.5},{"text":"Having healthy boundaries,","startTime":59.669,"finishTime":60.729},{"text":"um,","startTime":61.139,"finishTime":61.509},{"text":"the work can be a tremendous place to be.","startTime":61.79,"finishTime":63.529},{"text":"Um,","startTime":63.909,"finishTime":64.25},{"text":"for me,","startTime":64.388,"finishTime":64.709},{"text":"work has been phenomenal in just learning about how to interact","startTime":64.91,"finishTime":68.62},{"text":"with people and build stronger personal relationships to be curious.","startTime":68.62,"finishTime":71.589},{"text":"Um,","startTime":71.949,"finishTime":72.069},{"text":"it's helped me become a better husband,","startTime":72.11,"finishTime":73.61},{"text":"a better father,","startTime":73.83,"finishTime":74.43},{"text":"a better friend to others,","startTime":74.51,"finishTime":75.73},{"text":"uh,","startTime":75.949,"finishTime":76.019},{"text":"in the communities that I'm in.","startTime":76.04,"finishTime":77.37},{"text":"And so I'm hoping the same for you.","startTime":77.779,"finishTime":79.069},{"text":"And that","startTime":79.389,"finishTime":80.019},{"text":"the things that we learned here,","startTime":80.47,"finishTime":81.66},{"text":"all the different things that we're learning in the","startTime":81.959,"finishTime":83.47},{"text":"university and all the courses and all the things,","startTime":83.47,"finishTime":85.5},{"text":"and just the ability to practice it on each other,","startTime":85.51,"finishTime":87.61},{"text":"will lead to great experiences,","startTime":88.23,"finishTime":89.769},{"text":"um,","startTime":90.099,"fin tXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"e34X5yPQGE6BEirMx","videoSD":"xuK4i7RprsXoDNMSr","captionData":{"status":"success","captions":[{"text":"Hey there,","startTime":5.539,"finishTime":5.9},{"text":"Steve here.","startTime":6.01,"finishTime":6.5},{"text":"I want to talk about the mission of OpsWorks,","startTime":6.659,"finishTime":8.869},{"text":"that we are here to help those next to us in front of us live better lives.","startTime":9.18,"finishTime":12.199},{"text":"Well,","startTime":13.47,"finishTime":13.59},{"text":"this is the why and it really doesn't change.","startTime":13.67,"finishTime":16.129},{"text":"It's what we return to when we're trying to make the","startTime":16.43,"finishTime":18.469},{"text":"right decisions instead of the ones that are convenient for us.","startTime":18.469,"finishTime":21.36},{"text":"And the order really,","startTime":21.79,"finishTime":22.75},{"text":"really matters.","startTime":22.829,"finishTime":23.709},{"text":"Um,","startTime":24.069,"finishTime":24.35},{"text":"those next to us are our teammates,","startTime":24.629,"finishTime":26.09},{"text":"and those in front of us are our partners or possibly even our future teammates.","startTime":26.42,"finishTime":29.59},{"text":"We know that we can do our very best work only when","startTime":30.54,"finishTime":32.819},{"text":"we ensure that our people are at the very best first.","startTime":32.819,"finishTime":35.72},{"text":"Um,","startTime":36.259,"finishTime":36.5},{"text":"we aim to help everyone live better lives.","startTime":36.54,"finishTime":38.61},{"text":"Lives are true with purpose,","startTime":38.86,"finishTime":40.24},{"text":"that guides both their work and their personal lives,","startTime":40.74,"finishTime":43.02},{"text":"and that every encounter,","startTime":43.459,"finishTime":44.419},{"text":"everything that we do together,","startTime":44.7,"finishTime":45.619},{"text":"they are opportunities to make real connections","startTime":45.779,"finishTime":48},{"text":"and to really solidify and strengthen relationships.","startTime":48,"finishTime":50.729},{"text":"And when those relationships are strengthened,","startTime":51.06,"finishTime":52.7},{"text":"then we're able to unite our path","startTime":52.819,"finishTime":54.34},{"text":"and,","startTime":54.619,"finishTime":54.9},{"text":"and celebrate our successes together.","startTime":55.009,"finishTime":56.619},{"text":"Now,","startTime":57.459,"finishTime":57.88},{"text":"this mission sometimes and this,","startTime":58.139,"finishTime":59.689},{"text":"you know,","startTime":59.979,"finishTime":60.299},{"text":"it's very challenging at times that,","startTime":60.459,"finishTime":62.52},{"text":"um,","startTime":62.759,"finishTime":63.18},{"text":"sometimes it's the hard decisions that we need to make together.","startTime":63.58,"finishTime":65.669},{"text":"Sometimes it's not","startTime":66.099,"finishTime":66.839},{"text":"the ones that feel good in the short term,","startTime":66.98,"finishTime":68.819},{"text":"but there are the right ones for the long term.","startTime":68.879,"finishTime":70.519},{"text":"And so we work in partnership with each other,","startTime":70.949,"finishTime":72.5},{"text":"and that's why relationships are the foundation,","startTime":72.529,"finishTime":74.9},{"text":"um,","startTime":75.3,"finishTime":75.47},{"text":"so that we're not just guessing at what is the right way and the","startTime":75.54,"finishTime":79.209},{"text":"better life is for you,","startTime":79.41,"finishTime":80.66},{"text":"that we work in conjunction and to identify that.","startTime":81.019,"finishTime":83.319},{"text":"And so I want to welcome you and invite you to join us on this mission","startTime":83.699,"finishTime":86.919},{"text":"of helping those next to us and those in front of us to live better lives,","startTime":87.379,"finishTime":90.37},{"text":"and to allow others to do the same for us.","startTime":90.54,"finishTime":92.62},{"text":"And so with that being said,","startTime":92.86,"finishTime":93.76},{"text":"take care.","startTime":94.18,"finishTime":94.72},{"text":"Talk to you soon.","startTime":94.889,"finishTime":95.44},{"text":"Bye-bye.","startTime":95.739,"finishTime":96.139}]}},"wovsw7Lo9kM53xhvD":{"_id":"wovsw7Lo9kM53xhvD","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":26229605,"uploadedFileName":"Grow and Go.mp4","duration":93.899002,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-02-21T08:18:50.219Z","dateModified":"2024-02-21T08:18:50.219Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"HKrGYYZf5uzm4ybQQ","videoSD":"PprbERoE4apxKHL8A","captionData":{"status":"success","captions":[{"text":"Hey there,","startTime":5.329,"finishTime":5.73},{"text":"Steve here.","startTime":5.849,"finishTime":6.44},{"text":"I want to talk about one of our methods,","startTime":6.57,"finishTime":8.22},{"text":"grow","startTime":8.609,"finishTime":9.109},{"text":"and go.","startTime":9.289,"finishTime":10.09},{"text":"Change and growth are important parts of life.","startTime":10.77,"finishTime":12.568999999999999},{"text":"We see it in the seasons that come and go each year.","startTime":12.77,"finishTime":15.55},{"text":"Uh,","startTime":15.93,"finishTime":16.079},{"text":"and in each season,","startTime":16.17,"finishTime":16.93},{"text":"in every experience that we go through,","startTime":17.03,"finishTime":18.84},{"text":"wisdom is offered to us,","startTime":19.049,"finishTime":20.399},{"text":"and what we learn in one season propels us into the next.","startTime":20.69,"finishTime":23.59},{"text":"Um,","startTime":23.969,"finishTime":24.149},{"text":"and so when we approach all the changes and obstacles in our lives,","startTime":24.17,"finishTime":27.559},{"text":"as opportunities to grow,","startTime":27.729,"finishTime":28.709},{"text":"Um,","startTime":29.309,"finishTime":29.469},{"text":"we can take it and take it forward to amazing places,","startTime":29.549,"finishTime":32.9},{"text":"um,","startTime":33.189,"finishTime":33.31},{"text":"whether it's our","startTime":33.389,"finishTime":34.049},{"text":"families,","startTime":34.189,"finishTime":34.669},{"text":"our friends,","startTime":34.74,"finishTime":35.33},{"text":"our teams,","startTime":35.419,"finishTime":35.939},{"text":"and the communities,","startTime":35.95,"finishTime":36.669},{"text":"and the world around us.","startTime":36.689,"finishTime":37.849},{"text":"And","startTime":38.31,"finishTime":38.759},{"text":"taking,","startTime":38.909,"finishTime":39.349},{"text":"you know,","startTime":39.509,"finishTime":39.63},{"text":"viewing everything as a season is really important to understand that,","startTime":39.79,"finishTime":42.779},{"text":"you know,","startTime":43.15,"finishTime":43.27},{"text":"for myself,","startTime":43.349,"finishTime":43.97},{"text":"when I was in IC and becoming a lead and becoming an IC or","startTime":44.47,"finishTime":47.75},{"text":"changing companies or changing environments or going to college and going to work,","startTime":47.75,"finishTime":51.74},{"text":"all these are different seasons that,","startTime":52.06,"finishTime":53.7},{"text":"you know,","startTime":53.909,"finishTime":54.069},{"text":"we got to learn,","startTime":54.18,"finishTime":54.97},{"text":"we got to grow,","startTime":55.15,"finishTime":55.83},{"text":"and then we went to go,","startTime":55.95,"finishTime":56.709},{"text":"to go do something bigger and better.","startTime":56.869,"finishTime":58.31},{"text":"And so I want to encourage everyone to","startTime":58.88,"finishTime":60.65},{"text":"take the season that you're in right now,","startTime":60.889,"finishTime":62.349},{"text":"not to judge it,","startTime":62.509,"finishTime":63.36},{"text":"not to","startTime":63.889,"finishTime":64.69},{"text":"say I should have been there faster,","startTime":65.05,"finishTime":66.209},{"text":"better,","startTime":66.33,"finishTime":66.61},{"text":"or whatever it is.","startTime":66.68,"finishTime":67.489},{"text":"I am where I am.","startTime":67.769,"finishTime":69.089},{"text":"I'm gonna grow and learn everything I can here,","startTime":69.65,"finishTime":71.629},{"text":"and I don't know where I'm gonna take it,","startTime":71.889,"finishTime":73.04},{"text":"but I know I'm gonna take it somewhere else.","startTime":73.08,"finishTime":74.389},{"text":"And so that's been really helpful for me,","startTime":74.889,"finishTime":76.83},{"text":"and that's actually why OpsWorks is built the way it is,","startTime":77.089,"finishTime":79.29},{"text":"is to help us all to grow and to go on to bigger and better things.","startTime":79.41,"finishTime":82.68},{"text":"So whether here at OpsWorks or even beyond,","startTime":82.889,"finishTime":84.589},{"text":"Um,","startTime":85.139,"finishTime":85.339},{"text":"we would love this to be a,","startTime":85.379,"finishTime":86.5},{"text":"a great season for you to grow","startTime":86.54,"finishTime":88.279},{"text":"and then to go.","startTime":88.54,"finishTime":89.419},{"text":"So,","startTime":89.739,"finishTime":90.069},{"text":"hope you're well.","startTime":90.629,"finishTime":91.379},{"text":"Talk to you soon.","startTime":91.669,"finishTime":92.18},{"text":"Take care.","startTime":92.339,"finishTime":92.739},{"text":"Bye.","startTime":93.019,"finishTime":93.339}]}},"y3oybELdiHdzS6Da7":{"_id":"y3oybELdiHdzS6Da7","data":{"attributes":{"type":"svg","mimetype":"image/svg+xml","uploadedFileName":"regular-lightbulb","status":"online","width":352,"height":512},"dates":{"dateCreated":"2019-01-16T23:08:59.663Z" ext":"best way to get what you want is to give others what they need first,","startTime":11.369,"finishTime":14.399000000000001},{"text":"and it doesn't mean that we don't matter.","startTime":14.609,"finishTime":16.409},{"text":"In fact,","startTime":16.569,"finishTime":16.889},{"text":"it actually is the opposite.","startTime":16.93,"finishTime":18.12},{"text":"We know that when we take this approach,","startTime":18.329,"finishTime":19.68},{"text":"it's the best way to reduce friction and to make progress in ourselves.","startTime":19.729,"finishTime":22.95},{"text":"We can go next because we know that there's an abundance and that we're patient","startTime":23.45,"finishTime":26.51},{"text":"in uh serving","startTime":26.799,"finishTime":27.969},{"text":"a higher cause and a higher purpose.","startTime":28.129,"finishTime":29.629},{"text":"And so with that being said,","startTime":30.409,"finishTime":31.459},{"text":"you know,","startTime":31.7,"finishTime":31.899},{"text":"one way I could try to visualize it is like,","startTime":32.02,"finishTime":33.659},{"text":"you know,","startTime":33.7,"finishTime":33.86},{"text":"there's like a doorway that's like sort of this narrow.","startTime":33.979,"finishTime":36.439},{"text":"And if we try to go in and together,","startTime":36.819,"finishTime":38.34},{"text":"it's constantly gonna be bumping shoulders or bumping into this","startTime":38.38,"finishTime":41.36},{"text":"fight for things.","startTime":41.669,"finishTime":42.479},{"text":"And what I've learned then","startTime":42.819,"finishTime":43.88},{"text":"is that I just like to hold the door open,","startTime":44.139,"finishTime":45.54},{"text":"let the person go through first,","startTime":45.689,"finishTime":46.74},{"text":"and I get to go next.","startTime":46.779,"finishTime":47.88},{"text":"And","startTime":48.18,"finishTime":48.439},{"text":"what I found is that there's a gratitude in for it.","startTime":48.54,"finishTime":50.939},{"text":"There's,","startTime":51.18,"finishTime":51.459},{"text":"you know,","startTime":51.54,"finishTime":51.7},{"text":"sort of this appreciation for what we do.","startTime":51.9,"finishTime":53.939},{"text":"And","startTime":54.4,"finishTime":54.83},{"text":"you get a rise from that.","startTime":55.009,"finishTime":55.849},{"text":"And so like doing good for others has always been,","startTime":55.88,"finishTime":57.619},{"text":"at least for me,","startTime":57.759,"finishTime":58.2},{"text":"has been great for me.","startTime":58.209,"finishTime":59.29},{"text":"Um,","startTime":59.689,"finishTime":59.99},{"text":"and so that's where,","startTime":60,"finishTime":60.81},{"text":"you know,","startTime":61.009,"finishTime":61.169},{"text":"over the years where I found that when I was in competition with others,","startTime":61.24,"finishTime":64.51},{"text":"um,","startTime":64.779,"finishTime":65.309},{"text":"it just made things harder.","startTime":65.93,"finishTime":66.9},{"text":"And I don't know,","startTime":67.169,"finishTime":67.769},{"text":"maybe in my older,","startTime":67.889,"finishTime":68.93},{"text":"more seasoned marinated age,","startTime":69.29,"finishTime":70.949},{"text":"I'm looking for sort of maybe the real easy way,","startTime":71.209,"finishTime":73.4},{"text":"and the real easy way is just go second.","startTime":73.41,"finishTime":75.29},{"text":"And so with that being said,","startTime":75.889,"finishTime":76.779},{"text":"I encourage you to","startTime":76.86,"finishTime":78.019},{"text":"um","startTime":78.26,"finishTime":78.709},{"text":"take a look and consider this mean next mindset for yourself,","startTime":79.099,"finishTime":81.5},{"text":"that the disbelief in helping others,","startTime":81.58,"finishTime":83.559},{"text":"um,","startTime":83.86,"finishTime":84.389},{"text":"doesn't mean you're a doormat,","startTime":84.58,"finishTime":85.65},{"text":"doesn't mean you just,","startTime":85.699,"finishTime":86.419},{"text":"you know,","startTime":86.54,"finishTime":86.699},{"text":"you get to be run over all the time.","startTime":86.779,"finishTime":88.62},{"text":"There's a","startTime":88.699,"finishTime":89.16},{"text":"healthy boundary to have","startTime":89.33,"finishTime":90.599},{"text":"and to find a good place.","startTime":90.86,"finishTime":92.069},{"text":"To actually have it deployed,","startTime":92.194,"finishTime":93.474},{"text":"um,","startTime":93.724,"finishTime":93.995},{"text":"and engaged with others this way.","startTime":94.004,"finishTime":95.504},{"text":"So","startTime":95.644,"finishTime":96.065},{"text":"finding that balance,","startTime":96.485,"finishTime":97.565},{"text":"finding that harmony point for the situation that you're in is really,","startTime":97.805,"finishTime":100.684},{"text":"really important.","startTime":100.764,"finishTime":101.464},{"text":"But then it has unlocked many things in my life,","startTime":101.724,"finishTime":103.705},{"text":"and I hope it does for you as well.","startTime":103.724,"finishTime":105.305},{"text":"So,","startTime":105.525,"finishTime":105.794},{"text":"with that being said,","startTime":105.925,"finishTime":106.565},{"text":"talk to you soon.","startTime":106.724,"finishTime":107.285},{"text":"Take care.","startTime":107.444,"finishTime":107.785},{"text":"Bye-bye.","startTime":108.004,"finishTime":108.364}]}},"zirQbAtiytEmEvNKC":{"_id":"zirQbAtiytEmEvNKC","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"audio","mimetype":"audio/mp4","status":"online","fileSizeInBytes":553907,"uploadedFileName":"BVMMs.MP3","duration":33.671995,"uploadedFileNameExtension":".m4a"},"dates":{"dateCreated":"2024-02-21T05:00:37.925Z","dateModified":"2024-02-21T05:00:37.925Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"7RYWYXkHfQdkYyYQp","workspaceId":"q4F95pPeyCsCR4rWo","captionData":{"status":"success","captions": ":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Which method do you think most resonated to your personal values? Why?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-02-20T07:52:51.459Z","dateCreated":"2024-02-20T07:52:51.459Z"}},"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]}},"resourcesById":{"3NEstvyd8YhjXzQnq":{"_id":"3NEstvyd8YhjXzQnq","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Me-next Mindset","template":"resourceVideo","locale":"en","upload":"zFhqsd3oW2thEiWFr"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here.","startTime":0.439,"finishTime":1.759},{"text":"I wanna talk about one of our core beliefs in the me next mindset.","startTime":1.929,"finishTime":5.51},{"text":"The best way to get what you want is to give others what they need first.","startTime":5.84,"finishTime":9.568999999999999},{"text":"And it doesn't mean that we don't matter. In fact, it actually is the opposite.","startTime":9.72,"finishTime":13.35},{"text":"We know that when we take this approach,","startTime":13.409,"finishTime":14.949},{"text":"it's the best way to reduce friction and to make progress in ourselves,","startTime":14.96,"finishTime":18.149},{"text":"we can go next because we know that there's an abundance and that","startTime":18.53,"finishTime":21.069},{"text":"we are patient in serving a higher cause and a higher purpose.","startTime":21.079,"finishTime":24.989},{"text":"And so with that being said, you know, one way I could try to visualize it is like,","startTime":25.5,"finishTime":28.879},{"text":"you know, there's like a doorway that's like sort of this narrow.","startTime":28.889,"finishTime":31.59},{"text":"And if we try to go in there together,","startTime":31.92,"finishTime":33.61},{"text":"it's constantly gonna be bumping shoulders and bumping into this fight for things.","startTime":33.619,"finishTime":37.79},{"text":"And what I've learned then","startTime":37.95,"finishTime":39.11},{"text":"is that I just like to hold the door open,","startTime":39.22,"finishTime":40.819},{"text":"let the person go through first and I get to go next.","startTime":40.83,"finishTime":43.11},{"text":"And what I found is that there's a gratitude in for it.","startTime":43.299,"finishTime":46.279},{"text":"There's, you know, sort of this appreciation for what you would do.","startTime":46.29,"finishTime":49.169},{"text":"And you get a rise from that.","startTime":49.479,"finishTime":51.09},{"text":"And so like doing good for others has always been,","startTime":51.099,"finishTime":52.919},{"text":"at least for me has been great for me.","startTime":52.93,"finishTime":54.529},{"text":"And so that's where, you know,","startTime":54.799,"finishTime":56.33},{"text":"over the years where I found that when I was in competition with others,","startTime":56.34,"finishTime":59.75},{"startTime":59.889,"finishTime":60.459},{"text":"it just made things harder and I don't know, maybe in my older, more seasoned,","startTime":61.04,"finishTime":65.05},{"text":"marinated age, I'm looking for sort of,","startTime":65.059,"finishTime":67.33},{"text":"maybe the real easy way and the real easy way is to just go second.","startTime":67.339,"finishTime":70.51},{"text":"And so with that being said, I encourage you to,","startTime":70.97,"finishTime":73.269},{"text":" take a look and consider this mean","startTime":73.379,"finishTime":75.75},{"text":"mindset for yourself, that this belief and helping others,","startTime":75.86,"finishTime":78.76},{"text":"doesn't mean you're a doormat, doesn't mean you just, you know,","startTime":78.97,"finishTime":81.91},{"text":"you get to be run over all the time.","startTime":81.919,"finishTime":83.879},{"text":"There's a healthy boundary to have and to find","startTime":83.889,"finishTime":86.519},{"text":"a good place to actually have it deployed,","startTime":86.529,"finishTime":88.644},{"text":" and engaged with others. And","startTime":88.815,"finishTime":90.355},{"text":"so","startTime":90.654,"finishTime":91.245},{"text":"finding that balance,","startTime":91.375,"finishTime":92.845},{"text":"finding that harmony point for the situation that you're in is really,","startTime":92.855,"finishTime":95.904},{"text":"really important,","startTime":95.915,"finishTime":96.794},{"text":"but then it has unlocked many things in my life and I hope it does for you as well.","startTime":96.805,"finishTime":100.605},{"text":"So with that being said, talk to you soon. Take care. Bye bye.","startTime":100.614,"finishTime":103.584}],"background":{"backgroundColor":"koantic(light1, 0, 1)"},"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:11.844Z","dateCreated":"2024-02-20T07:52:51.459Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["zFhqsd3oW2thEiWFr"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"84byEoZfd9KARKqej":{"_id":"84byEoZfd9KARKqej","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"BVMMs","template":"resourceVideo","locale":"en","upload":"ba3XL2ir77PhukZTE"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:24:22.686Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["ba3XL2ir77PhukZTE"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"9pctadNFfAHFc6rk7":{"_id":"9pctadNFfAHFc6rk7","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Relationships are the Foundation","template":"resourceVideo","locale":"en","upload":"DmBWqyfzTgk4Gd3Bj"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here.","startTime":0.579,"finishTime":1.94},{"text":"I want to talk about one of our core beliefs that relationships are the foundation.","startTime":2.039,"finishTime":5.519},{"text":"Relationships, trips are everything for us.","startTime":5.84,"finishTime":8.35},{"text":" They're integrated into all of our beliefs, our vision,","startTime":8.46,"finishTime":11.739},{"text":"our mission and our methods,","startTime":11.92,"finishTime":13.399000000000001},{"text":"they rely upon them,","startTime":13.6,"finishTime":15.189},{"text":" and are drawn from them. Relationships help us to see more broadly,","startTime":15.439,"finishTime":19.28},{"text":"to support more completely and to celebrate more intensely.","startTime":19.44,"finishTime":22.459},{"text":"Our wins are a little bit more worthy when we have someone to","startTime":22.69,"finishTime":25.01},{"text":"celebrate with and our darker moments are made up a little bit brighter,","startTime":25.02,"finishTime":28.239},{"text":"when we have someone to help us through them.","startTime":28.389,"finishTime":30.25},{"text":" Relationships are the foundation for everything that we","startTime":30.84,"finishTime":32.939},{"text":"do and it's for all of our growth.","startTime":32.95,"finishTime":34.97},{"text":"I love the old African Proverb that said, if you wanna go fast,","startTime":34.979,"finishTime":38.069},{"text":"go alone,","startTime":38.18,"finishTime":39.06},{"text":"but if you want to go far, go together.","startTime":39.549,"finishTime":41.459},{"text":"And so none of us arrived here by ourselves.","startTime":41.689,"finishTime":44.09},{"text":"There's relationships with people that have helped us along the way.","startTime":44.29,"finishTime":47.279},{"text":"But when we talk about relationships, I also want to talk about them.","startTime":47.65,"finishTime":50.15},{"text":"There are relationships with people and their relationships with things.","startTime":50.159,"finishTime":52.889},{"text":"And for me, you know, when I think about the past,","startTime":53.24,"finishTime":56.27},{"text":"there are some relationships with things that were maybe not so healthy.","startTime":56.59,"finishTime":59.52},{"text":"And I realized that and it drove me in a different direction and","startTime":59.529,"finishTime":62.68},{"text":"there are relationships with people that may not have had healthy","startTime":62.93,"finishTime":65.559},{"text":"boundaries or just didn't really know what's going on and,","startTime":65.569,"finishTime":68.239},{"text":"and drove me in the other direction.","startTime":68.25,"finishTime":69.379},{"text":"And","startTime":69.389,"finishTime":69.65},{"text":"this culmination of relationships","startTime":70.01,"finishTime":72.339},{"startTime":72.44,"finishTime":72.889},{"text":"is one side of the steering side,","startTime":73.16,"finishTime":74.779},{"text":"then you could define like,","startTime":75.55,"finishTime":76.419},{"text":"what kind of healthy relationship or type of relationship do you want with things?","startTime":76.43,"finishTime":80.5},{"text":"And what kind of type of relationship do you want with people?","startTime":80.51,"finishTime":84},{"text":"And so for me, like, you know, with the things, relationship,","startTime":84.36,"finishTime":87.139},{"text":"I just don't want the things to own me anymore.","startTime":87.15,"finishTime":89.129},{"text":"And so when I","startTime":89.389,"finishTime":90.18},{"text":"get in, when in the past,","startTime":90.47,"finishTime":91.599},{"text":"when we would get something that was kind of nice or whatever it was,","startTime":91.61,"finishTime":94.54},{"text":"it would actually own me, you know, because I would worry about like, oh, will,","startTime":94.739,"finishTime":98.099},{"text":"will it get scratched damaged, stolen or those different types of things?","startTime":98.11,"finishTime":101.12},{"text":"And, and","startTime":101.129,"finishTime":101.389},{"text":"for me,","startTime":101.69,"finishTime":102.169},{"text":"I want a different relationship with things where it's like","startTime":102.18,"finishTime":104.23},{"text":"the things I use those things don't use me.","startTime":104.239,"finishTime":107.959},{"text":"likewise on relationships with people","startTime":108.279,"finishTime":110.62},{"startTime":110.75,"finishTime":111.23},{"text":"I like what I found over time is that it's","startTime":111.239,"finishTime":113.139},{"text":"really important for me to have relationships with people,","startTime":113.15,"finishTime":115.69},{"text":" that have similar values, values that line up in a similar direction.","startTime":115.819,"finishTime":120.66},{"text":"And so for me, it's really important to understand what those things are. For me","startTime":121.37,"finishTime":124.37},{"text":"to make it clear to others and that to find out if that's the way they want to go.","startTime":124.489,"finishTime":128.179},{"startTime":128.46,"finishTime":128.929},{"text":"and with that foundation set in place,","startTime":129.13,"finishTime":131.259},{"text":"it will lead to a greater and better experience throughout life.","startTime":131.27,"finishTime":134.119},{"text":"And that's what I found out. So","startTime":134.13,"finishTime":135.57},{"text":"I'm hoping you're doing well and I hope","startTime":135.85,"finishTime":137.66},{"text":"relationships are the foundation for you as well","startTime":137.669,"finishTime":139.839},{"text":"and that you are very deliberate and,","startTime":139.949,"finishTime":142.429},{"text":"purposeful in the relationships that you form.","startTime":142.71,"finishTime":145.24},{"text":"So with that being said, take care, talk to you soon. Bye bye.","startTime":145.279,"finishTime":148.139}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:30.671Z","dateCreated":"2024-02-20T07:52:51.459Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["DmBWqyfzTgk4Gd3Bj"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"DqSiM59RPTLNWecoZ":{"_id":"DqSiM59RPTLNWecoZ","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Watch Party!","template":"resourceVideo","locale":"en","upload":"7EP5ofrSZJyvdzvk3"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"overlays":[{"identifier":"d9j2psvmSnKHdv79e","kind":"group","overlays":[{"width":219.99999999999997,"htmlContent":"\u003cdiv>&nbsp; &nbsp;Watch Video\u003c/div>\n","customStyle":{"textAlignment":"left","font":{"bold":true,"size":20,"underline":false,"italic":false},"border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"right":true,"top":true,"bottom":true},"fill":{"color":"koantic(accent3, 0, 1)","type":"color"},"verticalAlignment":"middle","fontColor":"koantic(light1, 0, 1)","type":"button","padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Button","roundedCorners":{"bottomLeft":6,"bottomRight":6,"topLeft":6,"topRight":6},"hover":{"fillColor":"koantic(dark2, 0, 1)"}},"height":55,"x":990,"y":639,"rotationAngle":0,"identifier":"EkPFpJ4oXdwyM7Tcj","kind":"overlay","type":"button","exitAnimation":{"type":"fadeOut","duration":500},"start":2,"behaviorType":"continue","entranceAnimation":{"type":"expandIn","duration":700},"clickAction":{"goToPage":{"type":"t F95pPeyCsCR4rWo","assets":["zirQbAtiytEmEvNKC","zwR6YXqQLTiSsa8iE","ZhuPjs9Nc9kSex4Ls","y3oybELdiHdzS6Da7"],"childResources":["K4yisqKzYfadmERML","CMtcDnq3GXJyTfdCk","JgEwZYuL2tQfPj7am","KK3vBajcsnMXsrasw","dWzqdYB8TZGWTstWz","uD2EizBj9dWToFaEF","vDJLP2Qvn9KuHrkuR"],"overlayTemplateIds":[],"fontFamilies":["fidrhaukipktR4DtYkaL","fidwQgqwPsyLenCcXsNb"],"isBuiltin":false,"isSampleData":false,"templateLogicalName":"AltairProcessFlow","_siteID":"a7vTDrSZc6TSbC7kc"},"KsuRGL4ak4wshfaDQ":{"_id":"KsuRGL4ak4wshfaDQ","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Video","template":"resourceVideo","locale":"en","upload":"t3zJAN9MymS78mQwW"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here. I wanna talk about the mission of","startTime":0.569,"finishTime":3.359},{"text":"OpsWerks","startTime":3.549,"finishTime":3.92},{"text":"that we are here to help those next to us in front of us live better lives.","startTime":4.219,"finishTime":7.34},{"text":"Well, this is the why and it really doesn't change.","startTime":8.52,"finishTime":11.289},{"text":"It's what we return to when we're trying to make the right decisions.","startTime":11.51,"finishTime":14.52},{"text":"And instead the ones that are convenient for us","startTime":14.529,"finishTime":16.569},{"text":"and the order really, really matters.","startTime":16.879,"finishTime":18.85},{"text":" If those next to us are our teammates","startTime":19.129,"finishTime":21.37},{"text":"and those in front of us are our partners or possibly even our future teammates,","startTime":21.52,"finishTime":24.79},{"text":"we know that we can do our very best work only when","startTime":25.629,"finishTime":27.94},{"text":"we ensure that our people are at the very best first.","startTime":27.95,"finishTime":30.959},{"text":"We aim to help everyone live better lives.","startTime":31.35,"finishTime":33.86},{"text":"Lives are true with purpose that guides both their","startTime":33.869,"finishTime":36.86},{"text":"work and their personal lives and that every encounter,","startTime":36.869,"finishTime":39.619},{"text":"everything that we do together,","startTime":39.63,"finishTime":40.88},{"text":"they are opportunities to make real connections","startTime":40.889,"finishTime":43.2},{"text":"and to really solidify and strengthen relationships.","startTime":43.209,"finishTime":45.75},{"text":"And when those relationships are strengthened,","startTime":46.159,"finishTime":47.9},{"text":"then we're able to unite our path and, and celebrate our successes together.","startTime":47.909,"finishTime":51.819},{"text":"Now, this mission sometimes and this,","startTime":52.43,"finishTime":54.849},{"text":"you know, is very challenging at times that","startTime":55.08,"finishTime":57.619},{"text":"um sometimes it's the hard decisions that we need to make together","startTime":57.819,"finishTime":60.849},{"text":"sometimes it's not the ones that feel good in the short term,","startTime":60.959,"finishTime":64.019},{"text":"but there are the right ones for the long term.","startTime":64.029,"finishTime":65.69},{"text":"And so we work in partnership with each","startTime":66.04,"finishTime":67.489},{"text":"other and that's why relationships are the foundation.","startTime":67.5,"finishTime":70.029},{"text":"So that we're not just guessing at what is","startTime":70.37,"finishTime":73.22},{"text":"the right way and the better life is for you","startTime":73.23,"finishTime":75.8},{"text":"that we work in conjunction and to identify that.","startTime":76.099,"finishTime":78.37},{"text":"And so I wanna welcome you and invite you to join us on this mission","startTime":78.83,"finishTime":82.209},{"text":"of helping those next to us and those in front of us to","startTime":82.419,"finishTime":84.65},{"text":"live better lives and to allow others to do the same for us.","startTime":84.66,"finishTime":88},{"text":"And so with that being said, take care, talk to you soon. Bye bye.","startTime":88.01,"finishTime":91.279}],"overlays":[],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:40.736Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["t3zJAN9MymS78mQwW"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"Mp63Cv2veM6w8GmoF":{"_id":"Mp63Cv2veM6w8GmoF","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Work can be our werkshop","template":"resourceVideo","locale":"en","upload":"maZLMtzso3CuBEw4L"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here.","startTime":0.519,"finishTime":1.6099999999999999},{"text":"I want to talk about one of our core beliefs that work can be our workshop.","startTime":1.62,"finishTime":5.269},{"text":"work isn't just the office that we're at.","startTime":5.53,"finishTime":7.579},{"text":"And the work that we do isn't just the work that we do.","startTime":7.829,"finishTime":10.539},{"text":" It's part of our personal journey in becoming our best selves.","startTime":10.72,"finishTime":14.079},{"text":"We see that our workplace here at OpsWerks is this should be a safe place to play,","startTime":14.09,"finishTime":18.569},{"text":"to be curious,","startTime":18.59,"finishTime":19.489},{"text":"to experiment uh to experience and to learn different things","startTime":19.5,"finishTime":22.75},{"text":" to help us mature and to connect with others.","startTime":22.76,"finishTime":25.229},{"text":" We think that this place could be a tremendous place for personal growth.","startTime":25.549,"finishTime":29.2},{"text":"And that the fruits that we do here will, you know, lead on to a lifetime of,","startTime":29.209,"finishTime":33.319},{"text":"you know,","startTime":33.33,"finishTime":33.439},{"text":"learning in other places and be able to help us in our particular journey.","startTime":33.45,"finishTime":37.4},{"text":"You know, if we kind of think about it, work is not just like a third of our life, right?","startTime":37.959,"finishTime":42.24},{"text":"If you say that we spend eight hours a day here, but it's really half of our waking life","startTime":42.25,"finishTime":45.959},{"text":"and there's always this push and pull that it's like, oh,","startTime":46.909,"finishTime":49.139},{"text":"it's about the work life or the personal life.","startTime":49.15,"finishTime":51.209},{"text":"But if we could find a way to have this integrated in a healthy way, right?","startTime":51.22,"finishTime":54.7},{"text":"Having healthy boundaries,","startTime":54.709,"finishTime":56.009},{"startTime":56.2,"finishTime":56.639},{"text":"The work can be a tremendous place to be.","startTime":56.869,"finishTime":58.83},{"text":" For me,","startTime":58.99,"finishTime":59.95},{"text":"work has been phenomenal in just learning about how to interact","startTime":59.959,"finishTime":63.799},{"text":"with people and build stronger personal relationships to be curious.","startTime":63.81,"finishTime":67.04},{"text":"It's helped me become a better husband, a better father,","startTime":67.05,"finishTime":69.73},{"text":"a better friend to others uh in the communities and I'm in","startTime":69.739,"finishTime":72.529},{"text":"and so I'm hoping the same for you","startTime":72.889,"finishTime":74.29},{"text":"and that","startTime":74.459,"finishTime":75.18},{"text":"the things that we learn here,","startTime":75.36,"finishTime":76.959},{"text":"all the different things that we're learning in the university and all the courses","startTime":77,"finishTime":80.069},{"text":"and all the things and just the ability to practice it on each other.","startTime":80.08,"finishTime":82.72},{"text":"It lead to great experiences um and great wisdom here so that you can","startTime":83.349,"finishTime":87.379},{"text":"take it on to wherever you are to your other relationships outside of work,","startTime":87.389,"finishTime":91.58},{"text":"to your friends circles, family circles, anywhere else.","startTime":91.589,"finishTime":94.019},{"text":"So with that being said,","startTime":94.029,"finishTime":95.599},{"text":" I'm wishing you well take care and uh make work the workshop for you too. Take care.","startTime":95.8,"finishTime":100.18},{"text":"Bye bye.","startTime":100.19,"finishTime":100.72}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:17.639Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["maZLMtzso3CuBEw4L"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"P68g2SFDXCocTvTcs":{"_id":"P68g2SFDXCocTvTcs","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Make it Meaningful","template":"resourceVideo","locale":"en","upload":"RyN97TDStL8LCTwnQ"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:24:14.822Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["RyN97TDStL8LCTwnQ"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"bFadba4uKifdnZeyo":{"_id":"bFadba4uKifdnZeyo","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Knowledge Check","template":"resourceAssessment","locale":"en"},"video":{"autoPlay":false},"assessment":{"graded":true,"includeInProjectResult":true,"passingGrade":60,"skipQuestions":true,"showFeedback":true,"questions":["j2DfWKekDc5h7qX2b","HZBtnBDQ8SAxSWEfv","vdSyZ2L6wDz8NSqf5"],"numberOfRetries":-2},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-02-20T07:52:51.460Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":[],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"dZ9zGLmWNbLrqSswb":{"_id":"dZ9zGLmWNbLrqSswb","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Thank you!","template":"resourceVideo","locale":"en","upload":"ka4dJvHnyqMEfyPsW"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"needToCompleteSlideForPageCompletion":false,"disableForwardSeeking":true},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:25:33.183Z","dateCreated":"2024-03-06T08:25:10.635Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["ka4dJvHnyqMEfyPsW"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"goDkDzjruKv2wxRWT":{"_id":"goDkDzjruKv2wxRWT","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Grow and Go","template":"resourceVideo","locale":"en","upload":"wovsw7Lo9kM53xhvD"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:24:07.170Z","dateCreated":"2024-02-20T07:52:51.459Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["wovsw7Lo9kM53xhvD"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"gtubskf7bspkqfH7p":{"_id":"gtubskf7bspkqfH7p","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Vision","template":"resourceVideo","locale":"en","upload":"SzDYjyQ5u68REzGEo"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here. I want to talk about the vision of ops works","startTime":0.569,"finishTime":3.779},{"text":"that the work we do today and how we do it","startTime":4,"finishTime":6.199},{"text":"will lead to thriving relationships that will last a lifetime.","startTime":6.21,"finishTime":8.818999999999999},{"text":"And the meaning of work is layered.","startTime":9.659,"finishTime":11.229},{"text":"We could all begin with the sort of the occupation,","startTime":11.63,"finishTime":14.069},{"text":"the things that we do and are we helping our teammates and our customers?","startTime":14.079,"finishTime":17.549},{"text":"But we're also invited to grow in ways that will expand our life outside","startTime":17.819,"finishTime":21.139},{"text":"because we believe that the work can be life enriching.","startTime":21.42,"finishTime":24.26},{"text":"Um So that this inner work that we do our personal journey of growth and exploration","startTime":24.69,"finishTime":28.61},{"text":"will help us each to create lives that are better for, you know,","startTime":28.94,"finishTime":32.139},{"text":"in ourselves and in those around us","startTime":32.15,"finishTime":33.889},{"text":"and how we do. It","startTime":34.74,"finishTime":35.65},{"text":"also matters just as much as getting it done.","startTime":35.869,"finishTime":37.919},{"text":"Did how we do things make relationships stronger or better?","startTime":38.619,"finishTime":41.639},{"text":"Uh Are we closer or farther apart apart because of it?","startTime":42.11,"finishTime":44.919},{"text":"And did we go farther because and do better because of these relationships?","startTime":45.83,"finishTime":49.68},{"text":"Unlike other places that, you know, you and I have been","startTime":50.459,"finishTime":52.9},{"text":"uh where there's scarcity and competition and it's just all around us.","startTime":53.09,"finishTime":56.95},{"text":"Uh We believe in a generous spirit, we believe in abundance","startTime":57.36,"finishTime":60.599},{"text":"that when you grow, I get to grow","startTime":61,"finishTime":63.09},{"text":"that when you succeed, I succeed.","startTime":63.29,"finishTime":64.9},{"text":"And that, well, there's no need to compare ourselves to others.","startTime":65.209,"finishTime":68.089},{"text":"But instead, we can really compare ourselves to how we were last week,","startTime":68.099,"finishTime":72.16},{"text":"last month or even last year.","startTime":72.169,"finishTime":73.55},{"text":"Our beliefs, our vision,","startTime":74.309,"finishTime":75.839},{"text":"our methods","startTime":76.18,"finishTime":77.01},{"text":"uh teach us a way to have a thriving life um","startTime":77.169,"finishTime":79.66},{"text":"and to have rewards along the way on this journey.","startTime":79.669,"finishTime":82.309},{"text":"So I invite you to","startTime":82.69,"finishTime":83.91},{"text":"um understand our vision,","startTime":84.08,"finishTime":85.639},{"text":"integrate that vision with the vision you have for yourself and to find that,","startTime":86.169,"finishTime":89.559},{"text":"that they watch you work together.","startTime":89.58,"finishTime":91.129},{"text":"And so that the future that we have together and the future that we have in the future.","startTime":91.519,"finishTime":94.949},{"text":"Um and that how we measure it 10 2030 years from now,","startTime":95.15,"finishTime":98.8},{"text":"um will we have thriving relationships because of things that we did today?","startTime":99,"finishTime":102.37},{"text":"But really more importantly how we did them.","startTime":102.379,"finishTime":104.389},{"text":"So with that being said,","startTime":104.68,"finishTime":105.669},{"text":"uh talk to you soon, take care, bye-bye.","startTime":105.849,"finishTime":108.25}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:36.539Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["SzDYjyQ5u68REzGEo"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"kCmsegZiSfLfJEEQZ":{"_id":"kCmsegZiSfLfJEEQZ","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"We are here to become our best selves","template":"resourceVideo","locale":"en","upload":"3PMtkTsgkxCmbYLCd"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here.","startTime":0.319,"finishTime":1.649},{"text":" I want to talk about one of our core beliefs here at","startTime":1.909,"finishTime":4.32},{"text":"OpsWerks that we are here to become our best selves.","startTime":4.44,"finishTime":7.55},{"text":" Each one of us is here to be curious and courageous in asking like,","startTime":7.559,"finishTime":12.109},{"text":"who am I supposed to be?","startTime":12.119,"finishTime":13.43},{"text":"And how will I get there?","startTime":13.649000000000001,"finishTime":14.789},{"text":"And what do I need to learn along the way to be able to accomplish those things?","startTime":14.8,"finishTime":18.069},{"text":"This exploration helps us each to discover, uncover, you know,","startTime":18.459,"finishTime":22.29},{"text":"our very best selves.","startTime":22.299,"finishTime":23.739},{"text":"And in doing the work that we can grow","startTime":23.75,"finishTime":25.959},{"text":"in that direction and helps us build lasting relationships.","startTime":25.969,"finishTime":28.889},{"text":" and then really live amazing lives in our communities.","startTime":29.09,"finishTime":31.829},{"text":"And this is sort of our lifelong calling and our mission here.","startTime":31.84,"finishTime":34.84},{"text":"Nobody, nobody has kids and hopes that they will do poorly.","startTime":35.09,"finishTime":38.33},{"text":"They actually want them to do better than they were.","startTime":38.59,"finishTime":41.659},{"startTime":41.669,"finishTime":42.119},{"text":"We all come from an amazing legacy of an unbroken chain","startTime":42.13,"finishTime":45.049},{"text":"of survivors who went on to build up families and relationships","startTime":45.06,"finishTime":47.729},{"text":"that allow the next generation to exist and we want to continue this legacy.","startTime":47.83,"finishTime":51.54},{"text":"It may not be all of our kids","startTime":51.819,"finishTime":54.159},{"text":"that there's somebody else's kids out","startTime":54.43,"finishTime":56.43},{"text":"and we get to invest in their legacy and that's what we're doing here. So","startTime":56.599,"finishTime":59.54},{"text":"I love for you to join us in this journey.","startTime":59.779,"finishTime":62.319},{"text":"And just finding out,","startTime":62.33,"finishTime":63.63},{"text":"discovering and helping inspire others to become the best selves.","startTime":63.639,"finishTime":66.559},{"text":"But the way to do that best is to do it","startTime":66.589,"finishTime":68.519},{"text":"for ourselves and show examples of how they could do it.","startTime":68.529,"finishTime":71.339},{"text":"So with that being said, I'm wishing you well, take care. Bye-bye.","startTime":71.9,"finishTime":74.919}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:22:59.564Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["3PMtkTsgkxCmbYLCd"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"xktW2fwnkN4a9cLnL":{"_id":"xktW2fwnkN4a9cLnL","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Be the Anteambulo","template":"resourceVideo","locale":"en","upload":"dwShsyiLgHtb4fsDY"},"video":{"autoPlay":true,"type":"AWSS3","disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"},"isTranscribingCaptions":false,"captions":[{"text":"Hey there, Steve here. I want to talk about one of our core methods,","startTime":0.589,"finishTime":3.549},{"text":"being the anteambulo","startTime":3.849,"finishTime":5.36},{"startTime":5.61,"finishTime":5.65},{"text":"the anteambulo","startTime":6.26,"finishTime":6.76},{"text":" is the one who goes ahead who clears the path for those next to us","startTime":6.88,"finishTime":10.06},{"text":"and in front of us,","startTime":10.069,"finishTime":10.939},{"text":"it's an important and respected responsibility that we each hold.","startTime":11.239,"finishTime":14.76},{"text":"We're entrusted in,","startTime":14.77,"finishTime":15.739},{"text":"powered to deploy all of our talents and gifts to understand the needs","startTime":15.75,"finishTime":19.379},{"text":"to create solutions and to overcome the challenges ahead of us.","startTime":19.639,"finishTime":22.7},{"text":"And to just find a way","startTime":23.11,"finishTime":24.84},{"text":"and when we clear the path for others more often","startTime":25.049,"finishTime":26.879},{"text":"that we find that our paths are cleared too.","startTime":26.889,"finishTime":29.159},{"text":"And as we're clearing these paths, we get to determine the direction we get to","startTime":29.569,"finishTime":33.22},{"text":"find the right ways to do things in that particular situation that we're in.","startTime":33.479,"finishTime":37.099},{"text":"And it is such a strange word, the anteambulo","startTime":37.27,"finishTime":38.849},{"startTime":38.979,"finishTime":39.389},{"text":" It has the word team in it, which I absolutely love.","startTime":39.79,"finishTime":42.61},{"text":" But really,","startTime":42.639,"finishTime":43.799},{"text":"it's this person that goes ahead and when I've thought about","startTime":43.81,"finishTime":47.369},{"text":"what my successes in life have been in the past,","startTime":47.38,"finishTime":50.24},{"text":"it's when I was in anteambulo for others.","startTime":50.25,"finishTime":52.349},{"startTime":52.729,"finishTime":53.229},{"text":"back in my time, um I was helping, I guess in another company","startTime":53.36,"finishTime":56.799},{"text":" back in like 2001 or so,","startTime":57.169,"finishTime":59.549},{"text":"that, that was actually the last time I had a resume","startTime":59.799,"finishTime":61.93},{"text":"and that I was sort of pulled to different places or","startTime":62.47,"finishTime":65.33},{"text":"doing the right thing for other people.","startTime":66.16,"finishTime":67.849},{"text":" As many as I could um and gave me opportunities.","startTime":68.019,"finishTime":71.699},{"text":"And so I was trying to do the right thing and that,","startTime":71.849,"finishTime":74.51},{"text":"what I found is that it ended up helping me out tremendously. So","startTime":74.86,"finishTime":78.349},{"text":"I'd encourage you to explore what it was like to be an anteambulo","startTime":78.5,"finishTime":81.54},{"text":"for others.","startTime":81.65,"finishTime":82.55},{"text":"And I think what you'll find is what I have","startTime":82.669,"finishTime":84.239},{"text":"found is that when you clear the path for others,","startTime":84.25,"finishTime":86.529},{"text":"when you make way for others,","startTime":86.54,"finishTime":88.389},{"startTime":88.61,"finishTime":89.129},{"text":"that path is cleared for you as well.","startTime":89.349,"finishTime":91.069},{"text":"So with that being said, take care, talk to you soon. Bye bye.","startTime":91.08,"finishTime":94.589}],"background":{"backgroundColor":"koantic(light1, 0, 1)"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:45.155Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["dwShsyiLgHtb4fsDY"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"zsQ8BDBxKEmXDRASq":{"_id":"zsQ8BDBxKEmXDRASq","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Building Healthy Communities","template":"resourceVideo","locale":"en","upload":"WxYGwZ8KBFTkaHrkW"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"needToCompleteSlideForPageCompletion":true,"disableForwardSeeking":true,"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-03-06T08:23:56.904Z","dateCreated":"2024-02-20T07:52:51.460Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["WxYGwZ8KBFTkaHrkW"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"CMtcDnq3GXJyTfdCk":{"_id":"CMtcDnq3GXJyTfdCk","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceImage","locale":"en","title":"image","upload":"QqysSue9KAtQjCdjQ"},"video":{"autoPlay":false},"users":{"_userModifierID":"BzStXPHYosbgj5DiD","_userCreatorID":"BzStXPHYosbgj5DiD"},"dates":{"dateModified":"2024-02-21T03:18:06.163Z","dateCreated":"2024-02-21T03:14:21.835Z"}},"workspaceId":"q4F95pPeyCsCR4rWo","assets":["QqysSue9KAtQjCdjQ"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"JgEw
