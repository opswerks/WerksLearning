7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"eeQfztBDSohnk9rRu","videoSD":"XzdZz6dufYNJ42yNA","captionData":{"status":"success","captions":[{"text":"Hello there.","startTime":3.21,"finishTime":4.11},{"text":"Let's get started with one password.","startTime":4.409,"finishTime":6.329},{"text":"Opswork's password manager of choice.","startTime":6.73,"finishTime":9.189},{"text":"All right,","startTime":11.06,"finishTime":11.55},{"text":"here's what we'll do.","startTime":11.75,"finishTime":12.55},{"text":"We'll activate your account from the activation email,","startTime":13.77,"finishTime":16.309},{"text":"install the desktop and mobile apps,","startTime":16.69,"finishTime":18.479},{"text":"and then install the browser integration plugins.","startTime":18.69,"finishTime":21.36},{"text":"This will take more or less 15 minutes.","startTime":21.649,"finishTime":24.03},{"text":"All right,","startTime":26.129,"finishTime":26.42},{"text":"let's activate your account.","startTime":26.54,"finishTime":27.6},{"text":"Open your obsirk email","startTime":29.049,"finishTime":30.27},{"text":"and look for a message with the subject","startTime":30.77,"finishTime":32.869},{"text":"join obserk on one password.","startTime":33.09,"finishTime":34.79},{"text":"Click on join now and you'll be taken to your browser.","startTime":35.49,"finishTime":38.31},{"text":"If this email isn't around,","startTime":38.97,"finishTime":40.779},{"text":"let ITSG know that you have not received the one password invite","startTime":41.209,"finishTime":44.979},{"text":"and sit tight.","startTime":45.13,"finishTime":46.259},{"text":"They'll resend the activation email.","startTime":46.61,"finishTime":48.29},{"text":"Once this link is open,","startTime":51.209,"finishTime":52.54},{"text":"wait for another email containing a one-time pin.","startTime":52.979,"finishTime":55.52},{"text":"Look for a message with the subject verification code","startTime":55.939,"finishTime":58.72},{"text":"and enter the code in the prompt,","startTime":59.069,"finishTime":60.58},{"text":"then click next.","startTime":60.74,"finishTime":61.919},{"text":"This is one of the passwords that you'll need to remember,","startTime":65.29,"finishTime":67.54},{"text":"so create a long and strong password.","startTime":67.889,"finishTime":69.97},{"text":"Spaces work,","startTime":70.37,"finishTime":71.36},{"text":"so is making a phrase or a sentence.","startTime":71.73,"finishTime":73.69},{"text":"Once you have your password,","startTime":77.18,"finishTime":78.379},{"text":"download the emergency kit.","startTime":78.739,"finishTime":80.18},{"text":"You'll need this file,","startTime":80.97,"finishTime":82.01},{"text":"more specifically the embedded QR code or the secret key inside,","startTime":82.209,"finishTime":86.62},{"text":"in order to sign in with a new device.","startTime":86.65,"finishTime":88.79},{"text":"It's also recommended to print this file and keep it in a safe place","startTime":89.9,"finishTime":93.559},{"text":"like your cabinet.","startTime":94.099,"finishTime":94.97},{"text":"When you're done,","startTime":97.669,"finishTime":98.47},{"text":"sign in with your primary password and explore.","startTime":98.91,"finishTime":101.65},{"text":"Come back when you're done to install the","startTime":102.23,"finishTime":103.91},{"text":"desktop and mobile apps plus its browser integrations.","startTime":103.91,"finishTime":107.209},{"text":"Don't close that window though.","startTime":107.75,"finishTime":108.989},{"text":"The desktop and mobile apps are here to make usage of the application easier.","startTime":112.639,"finishTime":116.669},{"text":"Let's install these.","startTime":117.839,"finishTime":118.8},{"text":"Sign into one password web","startTime":120.83,"finishTime":122.519},{"text":"at opsir.onepassword.com.","startTime":122.629,"finishTime":125.449},{"text":"It's the same one we signed into earlier.","startTime":126.029,"finishTime":128.649},{"text":"Click on your name on the upper right hand corner","startTime":129.029,"finishTime":131.008},{"text":"of the screen and click on get the apps.","startTime":131.008,"finishTime":133.55},{"text":"From there you'll be taken to a list","startTime":136.35,"finishTime":137.75},{"text":"of all the companion applications one password has.","startTime":137.75,"finishTime":140.729},{"text":"Click on","startTime":143.389,"finishTime":144.3},{"text":"add your account directly if you've installed the app on your Mac,","startTime":144.509,"finishTime":147.11},{"text":"then install this for all your devices that you have used","startTime":147.389,"finishTime":150.33},{"text":"and use the QR code to sign in.","startTime":150.52,"finishTime":152.75},{"text":"This is the same QR code present in your emergency kit.","startTime":153.539,"finishTime":156.72},{"text":"Once you've signed into all your devices,","startTime":160,"finishTime":162.059},{"text":"go forth and add all your passwords.","startTime":162.27,"finishTime":164.589},{"text":"Guides are available to import your passwords from other password managers.","startTime":165.029,"finishTime":168.91}]}}},"questionsById":{},"resourcesById":{"LQ3YZzGfv9zaYFfLh":{"_id":"LQ3YZzGfv9zaYFfLh","data":{"attributes":{"title":"Title Page","template":"resourceSlide","locale":"en"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"width":506.00000000000006,"height":717.442838370565,"x":0,"y":0,"rotationAngle":0,"identifier":"DR6emo9zNa9jjd5xf","kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0,
