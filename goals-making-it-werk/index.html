text":"and it helps guide me in the sort of the micro decisions I need to make.","startTime":22.69,"finishTime":25.399},{"text":"And,","startTime":26,"finishTime":26.409},{"text":"and then when I think of smaller,","startTime":26.42,"finishTime":27.389},{"text":"like sort of short term goals,","startTime":27.52,"finishTime":28.6},{"text":"I think of them as more of experiments.","startTime":28.649,"finishTime":30.479},{"text":"So they're kind of lined up in the same direction that I want to go,","startTime":30.85,"finishTime":33.549},{"text":"uh,","startTime":33.93,"finishTime":33.939},{"text":"but there may be like a little,","startTime":34.169,"finishTime":35.45},{"text":"like if we think of things as a journey,","startTime":35.49,"finishTime":36.889},{"text":"there might be a little like side excursions","startTime":36.97,"finishTime":39.189},{"text":"that are maybe in the same direction,","startTime":39.729,"finishTime":41.33},{"text":"but a little bit off to the side.","startTime":41.34,"finishTime":42.569},{"text":"And those tend to be more short term,","startTime":42.919,"finishTime":44.52},{"text":"so they're experiments so I can learn a little bit more,","startTime":44.619,"finishTime":46.509},{"text":"and then it helps guide me","startTime":46.52,"finishTime":47.9},{"text":"in sort of maybe the longer term goals or the","startTime":48.08,"finishTime":50.279},{"text":"sort of iteration or experimentation.","startTime":50.479,"finishTime":52.409},{"text":"So","startTime":52.52,"finishTime":52.9},{"text":"goals are important for me because they keep me honest,","startTime":53.439,"finishTime":55.959},{"text":"they keep me motivated,","startTime":56.04,"finishTime":57.229},{"text":"they keep me going.","startTime":57.639,"finishTime":58.319},{"text":"So I hope that helps and take care.","startTime":58.52,"finishTime":60.599},{"text":"Talk to you soon.","startTime":60.72,"finishTime":61.18},{"text":"Bye.","startTime":61.36,"finishTime":61.56}]}},"4acBiPmg3NmQZJ7ie":{"_id":"4acBiPmg3NmQZJ7ie","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"audio","mimetype":"audio/mp4","status":"online","fileSizeInBytes":252769,"uploadedFileName":"goals2024 (9).mp3","duration":27.455011,"uploadedFileNameExtension":".m4a"},"dates":{"dateCreated":"2024-06-19T03:49:09.241Z","dateModified":"2024-06-19T03:49:09.241Z"},"users":{"_userCreatorID":"5bwyDm87W3Nfiax8C","_userModifierID":"5bwyDm87W3Nfiax8C"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","captionData":{"status":"success","captions":[{"text":"Like all our other subjects,","startTime":0.34,"finishTime":2},{"text":"goals making it work is also anchored in the four emotional intelligence domain.","startTime":2.25,"finishTime":6.53},{"text":"For this specifically,","startTime":7.53,"finishTime":8.729},{"text":"it aims to broaden your self-awareness.","startTime":8.81,"finishTime":11.18},{"text":"What are your personal development goals and how","startTime":11.689,"finishTime":13.93},{"text":"do they align with your professional goals?","startTime":13.93,"finishTime":15.949},{"text":"Self-management,","startTime":17,"finishTime":18.35},{"text":"what strengths and skills you have to make your goals happen.","startTime":18.76,"finishTime":21.59},{"text":"And relationship management.","startTime":22.18,"finishTime":23.79},{"text":"How will you connect with people who can help you with your goals?","startTime":24.139,"finishTime":26.819}]}},"52DC2KCQkBJ7XE8e5":{"_id":"52DC2KCQkBJ7XE8e5","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"audio","mimetype":"audio/mp4","status":"online","fileSizeInBytes":891911,"uploadedFileName":"Define the Goals.MP3","duration":55.066009,"uploadedFileNameExtension":".m4a"},"dates":{"dateCreated":"2024-05-29T06:20:16.447Z","dateModified":"2024-05-29T06:20:16.447Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false {"text":"Smart is where we set and align our goals,","startTime":0.379,"finishTime":3.089},{"text":"and then we track it through consistent evaluation and recognizing wins.","startTime":3.63,"finishTime":7.51}]}},"HE7iK4LHZQ4TD24Gc":{"_id":"HE7iK4LHZQ4TD24Gc","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":1746672,"uploadedFileName":"Grow Framework(1).mp4","duration":51.379,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-06-19T03:26:51.308Z","dateModified":"2024-06-19T03:27:13.558Z"},"users":{"_userCreatorID":"5bwyDm87W3Nfiax8C","_userModifierID":"5bwyDm87W3Nfiax8C"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","thumbnail":"KumXgxsyTdqCdNvce","videoSD":"HtmuMcv333Q6zk84T","captionData":{"status":"success","captions":[{"text":"To make sure we are achieving what is expected of us,","startTime":0.31,"finishTime":2.8689999999999998},{"text":"we practice the grow framework.","startTime":3.039,"finishTime":4.619},{"text":"Grow is a model developed by Sir John Whitmore and colleagues in the late 1980s.","startTime":5.76,"finishTime":10.64},{"text":"It has since become the world's most popular model for problem solving,","startTime":11.6,"finishTime":15.319},{"text":"goal setting,","startTime":15.6,"finishTime":16.2},{"text":"and performance improvement.","startTime":16.318,"finishTime":17.719},{"text":"By understanding the goals set by leaders,","startTime":18.76,"finishTime":21.03},{"text":"assessing the current reality,","startTime":21.28,"finishTime":22.84},{"text":"exploring various options,","startTime":22.92,"finishTime":24.479},{"text":"and identifying the way forward,","startTime":24.68,"finishTime":26.36},{"text":"individuals can effectively navigate their path to","startTime":26.84,"finishTime":29.44},{"text":"success and contribute to organizational objectives.","startTime":29.44,"finishTime":32.159},{"text":"G in grow stands for goals.","startTime":33.389,"finishTime":35.849},{"text":"This is already predefined depending on the IC level.","startTime":36.419,"finishTime":39.869},{"text":"R is reality.","startTime":40.229,"finishTime":41.529},{"text":"O is for options.","startTime":41.869,"finishTime":43.2},{"text":"And lastly,","startTime":43.389,"finishTime":44.029},{"text":"W is way forward.","startTime":44.159,"finishTime":45.61},{"text":"There are different levels of goals depending on","startTime":46.15,"finishTime":48.43},{"text":"how far in the future you are looking.","startTime":48.43,"finishTime":50.11}]}},"J4veS4bdLgh7XCAit":{"_id":"J4veS4bdLgh7XCAit","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":19299351,"uploadedFileName":"Defining your Goal.mp4","duration":183.762,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-05-30T06:31:58.653Z","dateModified":"2024-05-30T06:31:58.653Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"b9MuwRA9yQ5gjtdfA","thumbnail":"FabW8Rwhx4cMWqTPS","videoSD":"5rBHithiJzPCdwkxu","captionData":{"status":"success","captions":[{"text":"Here's an example of a defined goal.","startTime":0.319,"finishTime":2.599},{"text":"And this is the smart version of it.","startTime":8.409,"finishTime":10.409},{"text":"Now we have a goal.","startTime":16.379,"finishTime":17.459},{"text":"What's next?","startTime":17.62,"finishTime":18.559},{"text":"Let's examine the current reality.","startTime":19.139,"finishTime":21.02},{"text":"Too often,","startTime":21.709,"finishTime":22.51},{"text":"people try to solve a problem or reach","startTime":22.75,"finishTime":24.67},{"text":"a goal without fully considering their starting point.","startTime":24.67,"finishTime":27.309},{"text":"And often they're missing some information that","startTime":28.299,"finishTime":30.459},{"text":"they need to reach their goal effectively.","startTime":30.459,"finishTime":32.418},{"text":"As we talk about the current reality,","startTime":33.4,"finishTime":35.4},{"text":"the solutions may start to emerge.","startTime":35.56,"finishTime":37.599},{"text":"Here are some questions to help you do a reality check on your goals.","startTime":38.669,"finishTime":41.99},{"text":"You may answer these questions by yourself and or","startTime":48.439,"finishTime":51.52},{"text":"with the guidance of your leads and collaborators.","startTime":51.52,"finishTime":53.869},{"text":"Take a look and read how we examined the reality of the sample goal earlier.","startTime":60.36,"finishTime":64.319},{"text":"Once we've explored the current reality,","startTime":76.059,"finishTime":78.089},{"text":"it's time to determine what is possible.","startTime":78.25,"finishTime":80.23},{"text":"Meaning all of the possible options for reaching your goal.","startTime":81.209,"finishTime":84.389},{"text":"These questions may be your guide as you explore the","startTime":85.16,"finishTime":87.639},{"text":"options you can take to make your goal happen.","startTime":87.639,"finishTime":89.589},{"text":"Here are some options explored for the sample goal we had earlier.","startTime":101.25,"finishTime":104.589},{"text":"By examining the current reality and exploring the options,","startTime":127.04,"finishTime":130.27},{"text":"we will now have a good idea of how we can achieve our goal.","startTime":130.479,"finishTime":133.38},{"text":"That's great,","startTime":134.25,"finishTime":135.389},{"text":"but in itself this may not be enough.","startTime":135.77,"finishTime":138.309},{"text":"The final step is to commit to specific actions","startTime":138.729,"finishTime":141.369},{"text":"in order to move forward toward our goal.","startTime":141.369,"finishTime":143.449},{"text":"In doing this,","startTime":144.389,"finishTime":145.36},{"text":"we establish their way forwards and boost our motivation.","startTime":145.559,"finishTime":148.479},{"text":"Decide on specific time frames and set accountability and reporting.","startTime":149.61,"finishTime":153.75},{"text":"Agree with your leads and team members if need be.","startTime":154.13,"finishTime":157.009},{"text":"Here are some guide questions.","startTime":157.369,"finishTime":158.809},{"text":"Here is how we established the way forwards for our sample goal.","startTime":164.949,"finishTime":168.21}]}},"Mg5eGu4qpMAsrAvom":{"_id":"Mg5eGu4qpMAsrAvom","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":7866271,"uploadedFileName":"Goals as motivation.mp4","duration":28.238,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-05-28T08:21:00.655Z","dateModified":"2024-05-28T08:21:00.655Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","thumbnail":"B7GyEKBaJziQX3fMY","videoSD":"w6zw225rdQ9sudJnt","captionData":{"status":"success","captions":[{"text":"Goals motivate you.","startTime":0.449,"finishTime":1.85},{"text":"It's easy to put off work until tomorrow when there is no goal on the line.","startTime":2.13,"finishTime":5.829},{"text":"Analyze what's essential and show up for it.","startTime":6.849,"finishTime":9.6},{"text":"To add,","startTime":10.05,"finishTime":10.84},{"text":"having a goal also helps you beat procrastination.","startTime":11.289,"finishTime":14.31},{"text":"When you have goals in life,","startTime":14.729,"finishTime":16.25},{"text":"specific goals for what you want to achieve,","startTime":16.569,"finishTime":18.809},{"text":"it helps you understand that procrastination is dangerous.","startTime":18.969,"finishTime":22.049},{"text":"It is wasted time.","startTime":22.909,"finishTime":24.549},{"text":"It is another day you aren't moving closer to that goal.","startTime":24.829,"finishTime":27.67}]}},"R5AduLtsqNic4m9dn":{"_id":"R5AduLtsqNic4m9dn","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":44602,"uploadedFileName":"Smarter.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2024-05-29T06:29:56.206Z","dateModified":"2024-05-29T06:29:56.206Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","thumbnail":"bonyaHzwENdfhPQqm"},"RtfGJLYrXik7sbYuL":{"_id":"RtfGJLYrXik7sbYuL","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":465958,"uploadedFileName":"Screenshot 2024-05-29 at 11.03.07 AM.png","height":527,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2024-05-29T03:03:32.342Z","dateModified":"2024-05-29T03:03:32.342Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","thumbnail":"ksQ7yZ5rLJNyhzxRW"},"T5hwbsjQveGPNkr3E":{"_id":"T5hwbsjQveGPNkr3E","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":39766,"uploadedFileName":"Relevant.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2024-05-29T07:13:05.039Z","dateModified":"2024-05-29T07:13:05.039Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","thumbnail":"hWNCM6ddoHrMvjuQA"},"W7Bs2BmLWXmcaEGLk":{"_id":"W7Bs2BmLWXmcaE ime":0.409,"finishTime":2.269},{"text":"Why are goals important?","startTime":2.45,"finishTime":3.769},{"text":"We asked some of our leaders that question,","startTime":4.809,"finishTime":6.9399999999999995},{"text":"and here's what they have to say.","startTime":6.98,"finishTime":8.539},{"text":"For Alfie,","startTime":9.02,"finishTime":9.619},{"text":"it gives our lives meaning.","startTime":9.739,"finishTime":11.18},{"text":"It helps us narrow down what we want and trigger new behaviors.","startTime":12.069,"finishTime":15.55},{"text":"It motivates us to develop strategies that will enable","startTime":16.45,"finishTime":19.25},{"text":"us to perform at the required goal level.","startTime":19.25,"finishTime":21.43},{"text":"Not having a goal will only seem like running around in circles.","startTime":22.45,"finishTime":25.989},{"text":"Mark Lee echoed the same.","startTime":27.059,"finishTime":28.6},{"text":"Goal setting is of importance when attempting to achieve success.","startTime":29.459,"finishTime":32.919},{"text":"It gives you focus and allows you to zero in on each day's tasks with laser precision,","startTime":33.38,"finishTime":38.18},{"text":"weeding out wasted effort and idle movement.","startTime":38.5,"finishTime":40.9},{"text":"Move on to the next video and hear what Steve has to say about goals.","startTime":42.049,"finishTime":45.97}]}},"gMHkmqmwzfi5p25Xx":{"_id":"gMHkmqmwzfi5p25Xx","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"audio","mimetype":"audio/mp4","status":"online","fileSizeInBytes":252247,"uploadedFileName":"26.Recognized__Rewarded_Finally.mp3","duration":27.182993,"uploadedFileNameExtension":".m4a"},"dates":{"dateCreated":"2024-05-30T00:57:33.033Z","dateModified":"2024-05-30T00:57:33.033Z"},"users":{"_userCreatorID":"c7xNgDiesaMyvgY73","_userModifierID":"c7xNgDiesaMyvgY73"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"hcairWkv8DKtCywA7","workspaceId":"b9MuwRA9yQ5gjtdfA","captionData":{"status" nishTime":42.029},{"text":"You may answer these questions by yourself and or","startTime":48.36,"finishTime":51.5},{"text":"with the guidance of your leads and collaborators.","startTime":51.509,"finishTime":53.9},{"text":"Take a look and read how we examined the reality of the sample goal earlier.","startTime":60.159,"finishTime":64.239},{"text":"Once we've explored the current reality it's time to determine what is possible.","startTime":75.889,"finishTime":80.22},{"text":"Meaning all of the possible options for reaching your goal.","startTime":81.05,"finishTime":84.209},{"text":"These questions may be your guide.","startTime":84.519,"finishTime":86.559},{"text":"As you explore the options you can take to make your goal happen.","startTime":86.569,"finishTime":89.489},{"text":"Here are some options explored for the sample goal we had earlier.","startTime":101.16,"finishTime":104.589},{"text":"By examining the current reality and exploring the options.","startTime":126.879,"finishTime":130.3},{"text":"We will now have a good idea of how we can achieve our goal.","startTime":130.309,"finishTime":133.339},{"text":"Thats great.","startTime":134.24,"finishTime":135.259},{"text":"But in itself this may not be enough.","startTime":135.669,"finishTime":138.029},{"text":"The final step is to commit to specific","startTime":138.639,"finishTime":140.789},{"text":"actions in order to move forward toward our goal.","startTime":140.8,"finishTime":143.41},{"text":"In doing this, we establish their way forwards and boost our motivation.","startTime":144.419,"finishTime":148.5},{"text":"Decide on specific time frames and set accountability and reporting,","startTime":149.6,"finishTime":153.52},{"text":"agree with your leads and team members if need be.","startTime":154.029,"finishTime":156.889},{"text":"Here are some guide questions.","startTime":157.169,"finishTime":158.83},{"text":"Here is how we established the way forward for our sample goal.","startTime":164.789,"finishTime": 1.389},{"text":"Not having a goal will only seem like running around in circles.","startTime":22.36,"finishTime":25.95},{"text":"Mark Lee echoed the same,","startTime":26.86,"finishTime":28.719},{"text":"goal setting is of importance when attempting to achieve success.","startTime":29.29,"finishTime":32.77},{"text":"It gives you focus and allows you to zero in on each day's tasks with laser precision,","startTime":33.299,"finishTime":38.08},{"text":"weeding out wasted effort and idle movement.","startTime":38.34,"finishTime":40.939},{"text":"Move on to the next video and hear what Steve has to say about goals.","startTime":41.919,"finishTime":45.95}],"needToCompleteSlideForPageCompletion":true,"playbackCompletionAction":{"type":"nextPage"}},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"5bwyDm87W3Nfiax8C","_userCreatorID":"c7xNgDiesaMyvgY73"},"dates":{"dateModified":"2024-06-19T03:33:22.416Z","dateCreated":"2024-05-28T07:48:24.558Z"}},"workspaceId":"b9MuwRA9yQ5gjtdfA","assets":["dDTHBiDoFpEKTHjfS","Cn8y8C5TJW7sGkWhq","XZdXsB6h9wcKSnxiF","WrkQeroYmzXdhLq2Y"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"gTB8KbS8o39AbYpQM":{"_id":"gTB8KbS8o39AbYpQM","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Strategies and Expectations","template":"resourceVideo","locale":"en","upload":"HE7iK4LHZQ4TD24Gc"},"video":{"autoPlay":true,"type":"AWSS3","background":{"backgroundColor":"koantic(light1, 0, 1)"},"playbackCompletionAction":{"type":"nextPage"},"needToCompleteSlideForPageCompletion":true,"overlays":[],"isTranscribingCaptions":false,"captions":[{"text":"To make sure we are achieving what is expected of us. We practice the grow framework.","startTime":0.31,"finishTime":4.739},{"text":"Grow is a model developed by Sir John","startTime":5.67,"finishTime":8.029},{"text":"Whitmore and colleagues in the late 1980's.","startTime":8.039,"finishTime":10.619},{"text":"It has since become the worlds most popular model","startTi nishTime":25.52},{"text":"And, and then when I think of a smaller, like sort of short term goals,","startTime":25.969,"finishTime":28.659},{"text":"I think of them as more of experiments.","startTime":28.67,"finishTime":30.489},{"text":"So they're kind of lined up in the same direction that I want to go.","startTime":30.729,"finishTime":33.56},{"text":"Uh But there may be like little like if we think of things as a journey,","startTime":33.83,"finishTime":36.909},{"text":"there might be a little like side excursions","startTime":36.919,"finishTime":39.169},{"text":"that are maybe in the same direction, but a little bit off to the side","startTime":39.45,"finishTime":42.59},{"text":"and those tend to be more short term.","startTime":42.919,"finishTime":44.599},{"text":"So their experiments, I can learn a little bit more and then it helps guide me","startTime":44.61,"finishTime":47.869},{"text":"in sort of maybe the longer term goals or the sort of iteration or experimentation.","startTime":48.049,"finishTime":52.45},{"text":"So,","startTime":52.459,"finishTime":52.819},{"text":"goals are important for me because they keep me honest, they keep me motivated,","startTime":53.099,"finishTime":57.24},{"text":"they keep me going. So I hope that helps and uh take care, talk to you soon. Bye.","startTime":57.45,"finishTime":61.58}],"playbackCompletionAction":{"type":"nextPage"},"needToCompleteSlideForPageCompletion":true},"assessment":{"graded":false,"showFeedback":true},"users":{"_userModifierID":"5bwyDm87W3Nfiax8C","_userCreatorID":"c7xNgDiesaMyvgY73"},"dates":{"dateModified":"2024-06-13T01:04:12.442Z","dateCreated":"2024-05-28T04:11:47.749Z"}},"workspaceId":"b9MuwRA9yQ5gjtdfA","assets":["2TEgPRGwgzJwJjx2K"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"nGkHYubKy6Xh9sp7z":{"_id":"nGkHYubKy6Xh9sp7z","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"title":"Unlocking Emotionally Intelligent Habits","template":"resourceSlide","locale":"en","upload":"52DC2
