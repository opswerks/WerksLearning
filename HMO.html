<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsWerks HMO FAQ</title>
  <link href="https://fonts.cdnfonts.com/css/rockford-sans" rel="stylesheet">
  <style>
    :root {
      --deep-green: #005F3E;
      --forest-green: #009368;
      --lime-green: #B9D53A;
      --slate-gray: #494E56;
      --teal: #088192;
      --sky-blue: #5EC7CD;
      --bg: #f4f7f6;
      --white: #ffffff;
      --radius: 28px;
      --shadow: 0 20px 40px rgba(0,0,0,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rockford Sans', sans-serif;
      background: linear-gradient(135deg, var(--deep-green), var(--forest-green));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .dashboard {
      width: min(96vw, 1700px);
      aspect-ratio: 16 / 9;
      background: var(--bg);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    }
    .sidebar {
      width: 30%;
      background: linear-gradient(180deg, var(--deep-green), var(--forest-green));
      color: white;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand h1 {
      font-size: clamp(2rem, 3vw, 4rem);
      line-height: 1.05;
      margin-bottom: 16px;
    }
    .brand p {
      line-height: 1.8;
      opacity: 0.85;
      font-size: 0.95rem;
    }
    .menu {
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu-btn {
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      padding: 16px 18px;
      border-radius: 18px;
      text-align: left;
      cursor: pointer;
      transition: 0.3s ease;
      font-size: 0.95rem;
      backdrop-filter: blur(8px);
      font-family: 'Rockford Sans', sans-serif;
    }
    .menu-btn:hover { transform: translateX(6px); background: rgba(255,255,255,0.22); }
    .menu-btn.active { background: var(--lime-green); color: var(--deep-green); font-weight: bold; }
    .content { width: 70%; padding: 34px; display: flex; align-items: center; justify-content: center; }
    .content-card {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: var(--radius);
      padding: 42px;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .tag {
      display: inline-block;
      background: rgba(94,199,205,0.18);
      color: var(--deep-green);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: bold;
      margin-bottom: 24px;
    }
    h2 { color: var(--deep-green); font-size: clamp(1.4rem, 2.5vw, 3rem); line-height: 1.1; margin-bottom: 18px; }
    .description { color: var(--slate-gray); line-height: 1.8; margin-bottom: 34px; max-width: 850px; font-size: 0.95rem; }
    .faq-body { display: flex; flex-direction: column; gap: 14px; }
    .faq-card {
      background: linear-gradient(135deg, rgba(94,199,205,0.10), rgba(185,213,58,0.08));
      border-left: 6px solid var(--forest-green);
      border-radius: 20px;
      padding: 20px 24px;
      transition: 0.3s ease;
    }
    .faq-card:hover { transform: translateY(-3px); }
    .faq-card h4 { color: var(--deep-green); margin-bottom: 10px; font-size: 1rem; }
    .faq-card p { color: var(--slate-gray); line-height: 1.7; font-size: 0.94rem; margin-bottom: 6px; }
    .faq-card ul, .faq-card ol {
      color: var(--slate-gray);
      font-size: 0.94rem;
      line-height: 1.8;
      padding-left: 22px;
      margin-top: 6px;
    }
    @media (max-width: 1200px) {
      body { overflow-y: auto; }
      .dashboard { flex-direction: column; aspect-ratio: unset; height: auto; }
      .sidebar, .content { width: 100%; }
      .content { padding: 24px; }
      .content-card { padding: 28px; }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <h1>HMO FAQ</h1>
        <p>Common questions about HMO enrollment, dependents, deadlines, documents, and support — all in one place.</p>
      </div>
      <div class="menu">
        <button class="menu-btn active" data-category="q1">Can I update my HMO dependents?</button>
        <button class="menu-btn" data-category="q2">Who can I enroll as a dependent?</button>
        <button class="menu-btn" data-category="q3">What if I miss the 30-day deadline?</button>
        <button class="menu-btn" data-category="q4">What documents are required?</button>
        <button class="menu-btn" data-category="q5">Who do I contact for HMO concerns?</button>
      </div>
    </div>
  </aside>
  <main class="content">
    <div class="content-card" id="content-area"></div>
  </main>
</div>

<script>
const faqContent = {
  q1: {
    tag: "HMO Enrollment Updates",
    title: "Can I update my HMO dependents after enrollment?",
    description: "Yes. Changes may be requested during qualified life events that affect dependent eligibility or enrollment status.",
    body: `
      <div class="faq-card">
        <h4>Qualified life events</h4>
        <ul>
          <li>Marriage</li>
          <li>Birth or adoption of a child</li>
          <li>Death of a dependent</li>
          <li>Legal separation or annulment</li>
          <li>Loss of dependent eligibility</li>
        </ul>
      </div>
      <div class="faq-card">
        <h4>Documentation</h4>
        <p>Supporting documents may be required before HMO changes can be processed.</p>
      </div>
    `
  },
  q2: {
    tag: "Dependent Eligibility",
    title: "Who can I enroll as my HMO dependent?",
    description: "Eligible dependents typically follow a standard hierarchy based on company and HMO provider guidelines.",
    body: `
      <div class="faq-card">
        <h4>Dependent hierarchy</h4>
        <ol>
          <li>Legal spouse</li>
          <li>Children</li>
          <li>Parents (if applicable under the HMO policy)</li>
        </ol>
      </div>
      <div class="faq-card">
        <h4>Eligibility rules</h4>
        <p>Dependent enrollment may still be subject to age limits, employment status, or provider rules.</p>
      </div>
    `
  },
  q3: {
    tag: "Enrollment Timelines",
    title: "What happens if I miss the 30-day enrollment deadline?",
    description: "If the enrollment or update request is not submitted within 30 days from the life event, the following may apply:",
    body: `
      <div class="faq-card">
        <h4>Possible outcomes</h4>
        <ul>
          <li>The request may be deferred until the next enrollment window</li>
          <li>Coverage activation may be delayed</li>
          <li>Some dependents may require additional approval or documentation</li>
        </ul>
      </div>
      <div class="faq-card">
        <h4>Best practice</h4>
        <p>To avoid processing delays, employees are encouraged to submit requests and complete requirements as early as possible.</p>
      </div>
    `
  },
  q4: {
    tag: "Required Documentation",
    title: "What documents are usually required for HMO updates?",
    description: "Common supporting documents that may be needed when requesting HMO changes or enrollment updates.",
    body: `
      <div class="faq-card">
        <h4>Common required documents</h4>
        <ul>
          <li>Marriage Certificate</li>
          <li>Birth Certificate</li>
          <li>Valid government IDs</li>
          <li>Proof of dependency</li>
          <li>Court documents (if applicable)</li>
        </ul>
      </div>
      <div class="faq-card">
        <h4>Additional documents</h4>
        <p>HR or Finance may request additional documents depending on the change request.</p>
      </div>
    `
  },
  q5: {
    tag: "Benefits Assistance",
    title: "Who should I contact for HMO concerns or enrollment updates?",
    description: "Employees may coordinate directly with the appropriate team based on the nature of their concern.",
    body: `
      <div class="faq-card">
        <h4>Primary contact</h4>
        <p>For enrollment updates, dependent changes, or HMO concerns, employees should coordinate directly with <strong>HR</strong> or the assigned <strong>Benefits/Finance team</strong> for assistance and processing timelines.</p>
      </div>
    `
  }
};

const buttons = document.querySelectorAll(".menu-btn");
const contentArea = document.getElementById("content-area");

function renderContent(category) {
  const data = faqContent[category];
  contentArea.innerHTML = `
    <div class="tag">${data.tag}</div>
    <h2>${data.title}</h2>
    <p class="description">${data.description}</p>
    <div class="faq-body">${data.body}</div>
  `;
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    buttons.forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    renderContent(button.dataset.category);
  });
});

renderContent("q1");
</script>
</body>
</html>
