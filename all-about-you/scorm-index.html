rtTime":12.289,"finishTime":15.52},{"text":"have better understanding of people around as well.","startTime":15.52,"finishTime":18.629},{"text":"That we truly are different from one another.","startTime":19.559,"finishTime":22.159},{"text":"Pause this video and take the 16","startTime":23.17,"finishTime":25.459},{"text":"personalities assessment to know more about yourself.","startTime":25.459,"finishTime":28.76}]}},"ka4dJvHnyqMEfyPsW":{"_id":"ka4dJvHnyqMEfyPsW","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"video","mimetype":"video/mp4","status":"online","fileSizeInBytes":158172,"uploadedFileName":"Outro.mp4","duration":4.262,"uploadedFileNameExtension":".mp4"},"dates":{"dateCreated":"2024-03-06T02:30:23.410Z","dateModified":"2024-03-06T02:30:23.410Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"Zk3jgkJKmvNG6cJTf","videoSD":"hy2SLhSbnQzX36edZ","captionData":{"status":"success","captions":[]}},"pZgrAzLJc4CdMAZXm":{"_id":"pZgrAzLJc4CdMAZXm","data":{"attributes":{"status":"online","type":"image","mimetype":"image/png","fileSizeInBytes":14694065,"uploadedFileName":"onboarding-key-message-image.png","height":1680,"uploadedFileNameExtension":".png","width":1493},"users":{"_userCreatorID":"fC4kb7RBFBRfNWPQp","_userModifierID":"fC4kb7RBFBRfNWPQp"},"dates":{"dateCreated":"2023-05-12T14:01:04.481Z","dateModified":"2023-05-12T15:47:03.830Z"}},"isVisible":true,"categoryId":"ZkaEp4KHAr2nnmcSw","workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"7Y3MvkbrhjnrL9Eds","isArchived":false},"qNfqQ3yHpaTXhPpMr":{"_id":"qNfqQ3yHpaTXhPpMr","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"type":"image","mimetype":"image/jpeg","status":"online","fileSizeInBytes":2553517,"uploadedFileName":"LOC 9-11.jpg","height":1120,"uploadedFileNameExtension":".jpg","width":1680},"dates":{"dateCreated":"2024-02-01T06:46:24.970Z","dateModified":"2024-02-01T06:46:24.970Z"},"users":{"_userCreatorID":"BzStXPHYosbgj5DiD","_userModifierID":"BzStXPHYosbgj5DiD"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"categoryId":"ZkaEp4KHAr2nnmcSw","workspaceId":"q4F95pPeyCsCR4rWo","thumbnail":"gjebFM9adRpAuruFB"},"qgnioCvqxnmFdSaFe":{"_id":"qgnioCvqxnmFdSaFe","data":{"attributes":{"status":"online","type":"video","mimetype":"video/mp4","fileSizeInBytes":13961953,"uploadedFileName":"16P Discussion.mp4","duration":251.916009,"uploadedFileNameExtension":".mp4"},"users":{"_userCreatorID":"E7susMHWrgbRjpvPu","_userModifierID":"kNAApMq87PNSnqYMb"},"dates":{"dateCreated":"2023-08-06T04:32:22.666Z","dateModified":"2023-08-06T04:32:26.350Z"}},"isVisible":true,"workspaceId":"q4F95pPeyCsCR4rWo","_siteID":"a7vTDrSZc6TSbC7kc","isBuiltin":false,"isSampleData":false,"thumbnail":"E7NjuHBhpKjQGF97d","videoSD":"EWghEindJ4rvA9S2x","captionData":{"status":"success","captions":[{"text":"The results on this assessment reveal your personality type.","startTime":0.2,"finishTime":3.8289999999999997},{"text":"Again,","startTime":4.889,"finishTime":5.559},{"text":"a reminder that the 16 personality assessment does not give clinical diagnosis,","startTime":5.6899999999999995,"finishTime":11.329},{"text":"but rather gives us more information about how and","startTime":11.609,"finishTime":14.689},{"text":"why a person behaves on any specific event.","startTime":14.689,"finishTime":17.69},{"text":"The analysts have intuitive and thinking personality types,","startTime":18.649,"finishTime":22.629},{"text":"which are known for their rationality,","startTime":22.84,"finishTime":24.94},{"text":"impartiality,","startTime":25.04,"finishTime":26.19},{"text":"and intellectual excellence.","startTime":26.44,"finishTime":28.409},{"text":"Diplomats are more on the intuitive and feeling personality types,","startTime":29.389,"finishTime":33.799},{"text":"known for their empathy,","startTime":34.04,"finishTime":35.389},{"text":"diplomatic skills,","startTime":35.619,"finishTime":37.119},{"text":"and passionate idealism.","startTime":37.189,"finishTime":38.84},{"text":"Sentinels are observant and judging personality types","startTime":40.159,"finishTime":43.759},{"text":"known for their practicality and focus on order,","startTime":44.04,"finishTime":47.099},{"text":"security,","startTime":47.47,"finishTime":48.09},{"text":"and stability.","startTime":48.2,"finishTime":49.279},{"text":"While explorers are observant and prospecting personality types","startTime":50.29,"finishTime":54.689},{"text":"who are known for their spontaneity,","startTime":54.93,"finishTime":56.889},{"text":"ingenuity,","startTime":57.09,"finishTime":58.029},{"text":"and flexibility.","startTime":58.13,"finishTime":59.369},{"text":"The mind aspect shows how we interact with our surroundings.","startTime":60.979,"finishTime":64.989},{"text":"Introverted individuals prefer solitary activities and may","startTime":65.809,"finishTime":70.16},{"text":"tend to get exhausted with social interaction.","startTime":70.16,"finishTime":72.989},{"text":"They tend to be quite sensitive to external stimulation,","startTime":74,"finishTime":77.48},{"text":"e.g.,","startTime":77.599,"finishTime":78.209},{"text":"sound,","startTime":78.239,"finishTime":78.54},{"text":"sight,","startTime":78.879,"finishTime":79.36},{"text":"or smell in general.","startTime":79.48,"finishTime":80.94},{"text":"Extroverted individuals prefer group activities and","startTime":82.08,"finishTime":85.65},{"text":"get energized by social interaction.","startTime":85.65,"finishTime":88.11},{"text":"They tend to be more enthusiastic and more easily excited than introverts.","startTime":89.139,"finishTime":93.93},{"text":"The energy aspect determines how we see the world and process information.","startTime":95.699,"finishTime":100.55},{"text":"Observant individuals are highly practical,","startTime":101.569,"finishTime":104.43},{"text":"pragmatic,","startTime":104.68,"finishTime":105.449},{"text":"and down to earth.","startTime":105.529,"finishTime":106.629},{"text":"They tend to have strong habits and focus","startTime":107.54,"finishTime":110.29},{"text":"on what is happening or has already happened.","startTime":110.29,"finishTime":112.9},{"text":"Intuitive individuals are very imaginative,","startTime":113.919,"finishTime":117.04},{"text":"open-minded and curious.","startTime":117.209,"finishTime":118.989},{"text":"They prefer novelty over stability and focus","startTime":119.919,"finishTime":123.11},{"text":"on hidden meanings and future possibilities.","startTime":123.11,"finishTime":126.019},{"text":"The nature aspect determines how we make decisions and cope with emotions.","startTime":127.47,"finishTime":132.889},{"text":"Thinking individuals focus on objectivity and rationality,","startTime":133.3,"finishTime":137.649},{"text":"prioritizing logic over emotions.","startTime":137.949,"finishTime":140.61},{"text":"They tend to hide their feelings and","startTime":141.55,"finishTime":143.589},{"text":"see efficiency as more important than cooperation.","startTime":143.589,"finishTime":146.889},{"text":"Feeling individuals are sensitive and emotionally expressive.","startTime":147.899,"finishTime":151.96},{"text":"They are more empathic and less competitive than thinking types","startTime":152.91,"finishTime":156.839},{"text":"and focus on social harmony and cooperation.","startTime":157.07,"finishTime":160.429},{"text":"The tactics aspect reflects our approach to work,","startTime":161.539,"finishTime":164.85},{"text":"planning,","startTime":165.139,"finishTime":165.58},{"text":"and decision making.","startTime":165.69,"finishTime":166.919},{"text":"Judging individuals are decisive,","startTime":168.009,"finishTime":170.25},{"text":"thorough,","startTime":170.41,"finishTime":170.97},{"text":"and highly organized.","startTime":171.089,"finishTime":172.669},{"text":"They value clarity,","startTime":173.679,"finishTime":175.16},{"text":"predictability,","startTime":175.36,"finishTime":176.279},{"text":"and closure,","startTime":176.309,"finishTime":177.21},{"text":"preferring structure and planning to spontaneity.","startTime":177.52,"finishTime":180.46},{"text":"Prospecting individuals are very good","startTime":181.41,"finishTime":184.1},{"text":"at improvising and spotting opportunities.","startTime":184.1,"finishTime":186.96},{"text":"They tend to be flexible,","startTime":187.889,"finishTime":189.35},{"text":"relaxed,","startTime":189.649,"finishTime":190.279},{"text":"nonconformists who prefer keeping their options open.","startTime":190.289,"finishTime":193.75},{"text":"Finally,","startTime":195.58,"finishTime":196.259},{"text":"the identity aspect underpins all others,","startTime":196.5,"finishTime":199.6},{"text":"showing how confident we are in our abilities and decisions.","startTime":199.86,"finishTime":203.399},{"text":"Assertive individuals are self-assured,","startTime":204.33,"finishTime":206.86},{"text":"even tempered,","startTime":207.059,"finishTime":207.96},{"text":"and resistant to stress.","startTime":207.979,"finishTime":209.639},{"text":"They refuse to worry too much and do not push","startTime":210.6,"finishTime":213.94},{"text":"themselves too hard when it comes to achieving goals.","startTime":213.94,"finishTime":216.86},{"text":"Turbulent individuals are self-conscious and sensitive to stress.","startTime":217.779,"finishTime":222.119},{"text":"They are likely to experience a wide range of emotions and to be success driven,","startTime":223.059,"finishTime":228.119},{"text":"perfectionistic,","startTime":228.339,"finishTime":229.399},{"text":"and eager to improve.","startTime":229.419,"finishTime":231},{"text":"Opsworks places significant importance on developing relationships","startTime":231.99,"finishTime":236.429},{"text":"and promoting teamwork among its staff.","startTime":236.429,"finishTime":239.029},{"text":"The outcomes of this assessment will help us","startTime":239.97,"finishTime":242.5},{"text":"identify the strengths and weaknesses of team members,","startTime":242.5,"finishTime":245.979},{"text":"enabling us to create more efficient teams and foster positive communities.","startTime":246.169,"finishTime":251.039}]}},"uSXDAsRpe6eYDpkyP":{"_id":"uSXDAsRpe6eYDpkyP","data":{"attributes":{"type":"svg","mimetype":"image/svg+xml","uploadedFileName":"regular-heart","status":"online","width":512,"height":512},"dates":{"dateCreated":"2019-01-16T23:08:59.656Z","dateModified":"2019-01-16T23:08:59.656Z"}},"content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\">\u003cpath d=\"M458.4 64.3C400.6 15.7 311.3 23 256 79.3 200.7 23 111.4 15.6 53.6 64.3-21.6 127.6-10.6 230.8 43 285.5l175.4 178.7c10 10.2 23.4 15.9 37.6 15.9 14.3 0 27.6-5.6 37.6-15.8L469 285.6c53.5-54.7 64.7-157.9-10.6-221.3zm-23.6 187.5L259.4 430.5c-2.4 2.4-4.4 2.4-6.8 0L77.2 251.8c-36.5-37.2-43.9-107.6 7.3-150.7 38.9-32.7 98.9-27.8 136.5 10.5l35 35.7 35-35.7c37.8-38.5 97.8-43.2 136.5-10.6 51.1 43.1 43.5 113.9 7.3 150.8z\"/>\u003c/svg>","searchTerms":"Shapes Heart favorite like love relationship","isBuiltin":true,"isVisible":true,"categoryLogicalName":"shapes"},"y3oybELdiHdzS6Da7":{"_id":"y3oybELdiHdzS6Da7","data":{"attributes":{"type":"svg","mimetype":"image/svg+xml","uploadedFileName":"regular-lightbulb","status":"online","width":352,"height":512},"dates":{"dateCreated":"2019-01-16T23:08:59.663Z","dateModified":"2019-01-16T23:08:59.663Z"}},"content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 352 512\">\u003cpath d=\"M176 80c-52.94 0-96 43.06-96 96 0 8.84 7.16 16 16 16s16-7.16 16-16c0-35.3 28.72-64 64-64 8.84 0 16-7.16 16-16s-7.16-16-16-16zM96.06 459.17c0 3.15.93 6.22 2.68 8.84l24.51 36.84c2.97 4.46 7.97 7.14 13.32 7.14h78.85c5.36 0 10.36-2.68 13.32-7.14l24.51-36.84c1.74-2.62 2.67-5.7 2.68-8.84l.05-43.18H96.02l.04 43.18zM176 0C73.72 0 0 82.97 0 176c0 44.37 16.45 84.85 43.5
