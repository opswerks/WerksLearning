ishTime":32.569},{"text":"2500,","startTime":32.7,"finishTime":34.009},{"text":"and 200 pesos respectively.","startTime":34.139,"finishTime":36.119},{"text":"From the net taxable income of 8,869,650 cent tavos,","startTime":37.06,"finishTime":42.139},{"text":"we compute for the monthly tax due based on the graduated compensation tax rates.","startTime":42.15,"finishTime":46.84},{"text":"We will come up with 13,959.18% withholding tax.","startTime":47.779,"finishTime":52.45},{"text":"Deducting government contributions and tax from basic pay,","startTime":53.569,"finishTime":56.88},{"text":"Memre will have a net pay amounting to 81,990.83%. On the other hand,","startTime":57.049,"finishTime":62.24},{"text":"if Memre is a consultant,","startTime":62.5,"finishTime":64.019},{"text":"he will be subject to 8% gross tax rate,","startTime":64.22,"finishTime":66.699},{"text":"where 5% will be withheld by Opsworks and 3% will be paid by the member every quarter.","startTime":66.779,"finishTime":72.04},{"text":"With our sample data,","startTime":72.989,"finishTime":74.099},{"text":"net pay of member A as consultant will be 95,000 pesos.","startTime":74.23,"finishTime":78.379}]}},"t9v8K3eFiZ8nRDgnc":{"_id":"t9v8K3eFiZ8nRDgnc","data":{"attributes":{"type":"svg","mimetype":"image/svg+xml","uploadedFileName":"regular-hand-pointer","status":"online","width":448,"height":512},"dates":{"dateCreated":"2019-01-16T23:08:59.655Z","dateModified":"2019-01-16T23:08:59.655Z"}},"content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 448 512\">\u003cpath d=\"M358.182 179.361c-19.493-24.768-52.679-31.945-79.872-19.098-15.127-15.687-36.182-22.487-56.595-19.629V67c0-36.944-29.736-67-66.286-67S89.143 30.056 89.143 67v161.129c-19.909-7.41-43.272-5.094-62.083 8.872-29.355 21.795-35.793 63.333-14.55 93.152l109.699 154.001C134.632 501.59 154.741 512 176 512h178.286c30.802 0 57.574-21.5 64.557-51.797l27.429-118.999A67.873 67.873 0 0 0 448 326v-84c0-46.844-46.625-79.273-89.818-62.639zM80.
