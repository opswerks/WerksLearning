rvice with OpsWorks.","startTime":29.309,"finishTime":33.83},{"text":"You may request up to 50,000 pesos","startTime":34.159,"finishTime":36.619},{"text":"with flexible payment terms up to 12 months.","startTime":36.759,"finishTime":39.119},{"text":"Most importantly,","startTime":40.33,"finishTime":41.36},{"text":"this is an interest-free 0% advance,","startTime":41.5,"finishTime":43.65},{"text":"meaning you only pay back exactly what you borrowed.","startTime":43.93,"finishTime":46.61}],"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["N2fkw29ASedHBxBpm"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"tZHorZwbcY3Cp5Qn6":{"_id":"tZHorZwbcY3Cp5Qn6","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceAssessment","locale":"en","title":"Knowledge Check"},"dates":{"dateCreated":"2026-06-11T02:07:01.719Z","dateModified":"2026-06-11T02:07:01.719Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"},"assessment":{"graded":true,"includeInProjectResult":true,"passingGrade":100,"skipQuestions":true,"showFeedback":true,"questions":["g4pvycxB9SsepNfAH","n5tKn9AyDG3vGaJZc","xHzxCX4frRMSZFypM"],"numberOfRetries":3,"shuffle":true}},"workspaceId":"z7qLsKtPGn3ovAsdJ","assets":[],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"uw2yvr4PGHxTbbEzf":{"_id":"uw2yvr4PGHxTbbEzf","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceVideo","locale":"en","title":"Network Policy","upload":"hvL6RnqJgcZuJt9uH"},"dates":{"dateCreated":"2026-06-11T02:07:01.719Z","dateModified":"2026-06-11T02:07:01.719Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"type":"AWSS3","captions":[{"text":"Let's go over some important reminders about your paid time off.","startTime":0.009,"finishTime":3.45},{"text":"When planning to take time off,","startTime":3.809,"finishTime":5.36},{"text":"please check your leave balance first","startTime":5.6899999999999995,"finishTime":7.55},{"text":"and submit your request through Bamboo HR.","startTime":7.65,"finishTime":10.18},{"text":"Be sure to coordinate with your team lead as early as possible","startTime":10.96,"finishTime":14.3},{"text":"so your team has enough time to prepare and ensure proper coverage.","startTime":14.52,"finishTime":18.459},{"text":"As a guide,","startTime":18.92,"finishTime":19.639},{"text":"please allow at least 1 week of notice for 1 to 2 days of leave","startTime":19.92,"finishTime":23.659},{"text":"and at least 3 weeks for longer time off.","startTime":23.84,"finishTime":26.26},{"text":"While we want employees to use their time off well,","startTime":26.719,"finishTime":29.469},{"text":"requests may not always be approved if there is not enough leave available,","startTime":29.92,"finishTime":34},{"text":"if the timing makes coverage difficult,","startTime":34.319,"finishTime":36.419},{"text":"or if proper notice is not given.","startTime":36.74,"finishTime":38.56},{"text":"Time off taken without approval","startTime":39.409,"finishTime":41.279},{"text":"may also result in a payroll deduction.","startTime":41.419,"finishTime":43.959},{"text":"Planning ahead and coordinating early","startTime":44.569,"finishTime":46.799},{"text":"helps make the process smoother for you and your team.","startTime":46.939,"finishTime":49.439}],"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["hvL6RnqJgcZuJt9uH"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"v7N3xQ4TEd2tyLXof":{"_id":"v7N3xQ4TEd2tyLXof","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceVideo","locale":"en","title":"Network Policy","upload":"bAawQzrkJEvBJ6aLc"},"dates":{"dateCreated":"2026-06-11T02:07:01.719Z","dateModified":"2026-06-11T02:07:01.719Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"type":"AWSS3","captions":[{"text":"One of the most exciting part of your annual compensation","startTime":0.25,"finishTime":3.349},{"text":"is the 13th month pay.","startTime":3.529,"finishTime":5.05},{"text":"Every employee is entitled to this benefit,","startTime":5.8,"finishTime":8.18},{"text":"provided you have worked with the company for","startTime":8.6,"finishTime":10.439},{"text":"at least one month within the calendar year.","startTime":10.439,"finishTime":12.8},{"text":"This applies whether you are still on probationary status","startTime":13.689,"finishTime":16.909},{"text":"or have already transitioned to a regular employee.","startTime":17.129,"finishTime":19.87},{"text":"As mandated by the law,","startTime":20.77,"finishTime":22.209},{"text":"the 13th month pay must be released to employees","startTime":22.459,"finishTime":25.649},{"text":"no later than December 24th of each year.","startTime":25.649,"finishTime":28.159},{"text":"To get an estimate of your 13th month pay,","startTime":28.95,"finishTime":31.34},{"text":"follow this formula.","startTime":31.799,"finishTime":33.06},{"text":"For example,","startTime":33.479,"finishTime":34.229},{"text":"your monthly basic salary is 30,000 pesos,","startTime":34.439,"finishTime":37.599},{"text":"and it's currently your 6th month in the company.","startTime":37.759,"finishTime":40.18},{"text":"Your prorated 13th month pay is 15,000 pesos.","startTime":40.599,"finishTime":44.15},{"text":"As shown in this example,","startTime":44.33,"finishTime":45.75},{"text":"your 13th month pay is not simply a double pay of your current salary.","startTime":45.959,"finishTime":50.319},{"text":"It is calculated as 1 or 12 of your total basic salary","startTime":50.68,"finishTime":54.74},{"text":"earned throughout the entire calendar year.","startTime":54.88,"finishTime":57.119},{"text":"If an employee leaves the company before the December payout,","startTime":57.75,"finishTime":61.18},{"text":"whether through resignation or termination,","startTime":61.509,"finishTime":63.689},{"text":"they do not lose this benefit.","startTime":64.15,"finishTime":65.669},{"text":"Instead,","startTime":66.3,"finishTime":67.199},{"text":"a prorated 13th month pay will be calculated","startTime":67.5,"finishTime":70.68},{"text":"based on the total basic salary earned during the","startTime":70.9,"finishTime":73.58},{"text":"months they were active in that calendar year.","startTime":73.58,"finishTime":75.959},{"text":"This amount is then included as part of the employee's final pay.","startTime":76.73,"finishTime":80.15}],"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["bAawQzrkJEvBJ6aLc"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"vKNgwR9sRGPFTXyGi":{"_id":"vKNgwR9sRGPFTXyGi","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceVideo","locale":"en","title":"Network Policy","upload":"fg8LcDZs82uQQXdYL"},"dates":{"dateCreated":"2026-06-11T02:07:01.719Z","dateModified":"2026-06-11T02:07:01.719Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nLSY","_userModifierID":"yQX3zSzBuxtp2nLSY"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"type":"AWSS3","captions":[{"text":"At Ops Works,","startTime":0.2,"finishTime":1.279},{"text":"we celebrate employees who reach meaningful service milestones.","startTime":1.44,"finishTime":5.03},{"text":"These rewards recognize your dedication,","startTime":5.42,"finishTime":7.639},{"text":"impact,","startTime":8.079,"finishTime":8.39},{"text":"and commitment to growing with the company.","startTime":8.46,"finishTime":10.5},{"text":"To qualify for either of these rewards,","startTime":11.229,"finishTime":13.47},{"text":"you must be actively employed,","startTime":13.63,"finishTime":15.43},{"text":"not serving resignation notice","startTime":15.71,"finishTime":17.53},{"text":"and not underperformance or corrective action.","startTime":17.69,"finishTime":20.149},{"text":"Employees who complete 5 years with Opsworks will receive a special reward.","startTime":20.989,"finishTime":25.37},{"text":"You may choose between additional paid time off or a cash reward.","startTime":26.229,"finishTime":30.329},{"text":"For the 5th year milestone,","startTime":30.829,"finishTime":32.13},{"text":"if you choose PTO,","startTime":32.43,"finishTime":33.779},{"text":"you will receive 10 additional days that you can use within 1.5 years.","startTime":34.029,"finishTime":38.529},{"text":"These will automatically appear in Bamboo HR.","startTime":38.909,"finishTime":41.549},{"text":"For the cash reward,","startTime":41.99,"finishTime":42.95},{"text":"the amount depends on your role level.","startTime":43.11,"finishTime":45.009},{"text":"For those celebrating their 10th year,","startTime":45.43,"finishTime":47.299},{"text":"the cash reward increases based on your role level,","startTime":47.47,"finishTime":50.38},{"text":"recognizing your long-term impact and contributions.","startTime":50.669,"finishTime":53.509},{"text":"These rewards are subject to tax","startTime":54.389,"finishTime":56.4},{"text":"and cannot be converted into other benefits.","startTime":56.549,"finishTime":58.83},{"text":"OpsWorks may update the program when needed.","startTime":59.619,"finishTime":61.939}],"disableForwardSeeking":true,"needToCompleteSlideForPageCompletion":true}},"workspaceId":"AdPorMyw28Jp7Q9cy","assets":["fg8LcDZs82uQQXdYL"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"vprWhRXZF5DZPCE8e":{"_id":"vprWhRXZF5DZPCE8e","_siteID":"a7vTDrSZc6TSbC7kc","data":{"attributes":{"template":"resourceExternalContent","locale":"en","title":"Compensation Summary"},"dates":{"dateCreated":"2026-06-11T02:07:01.719Z","dateModified":"2026-06-11T02:07:01.719Z"},"users":{"_userCreatorID":"yQX3zSzBuxtp2nL
